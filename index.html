  return `<div style="font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:5px;text-align:${align};color:var(--ink2)">shelf: ${tag}</div>`;
}
function compare(x, y){
  const keys = [...new Set([...Object.keys(x.terpenes), ...Object.keys(y.terpenes)])]
    .filter(k => (x.terpenes[k]||0) > 0 || (y.terpenes[k]||0) > 0)
    .sort((p,q) => ((y.terpenes[q]||0)+(x.terpenes[q]||0)) - ((y.terpenes[p]||0)+(x.terpenes[p]||0)));
  const max = Math.max(...keys.map(k => Math.max(x.terpenes[k]||0, y.terpenes[k]||0)), 0.01);
  return `<div class="card">
    <div class="top">
      <div><h2>${nameVs(x,y)}</h2><div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink2);margin-top:4px">${formLabel(x)}<br>THC ${thcText(x)} · terps ${pctOr(x.total_terpenes, '—')}</div>${cmpShelf(x,'left')}</div>
      <div style="text-align:right"><h2>${nameVs(y,x)}</h2><div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink2);margin-top:4px">${formLabel(y)}<br>THC ${thcText(y)} · terps ${pctOr(y.total_terpenes, '—')}</div>${cmpShelf(y,'right')}</div>
    </div>
    <div class="read" style="margin-top:15px"><div class="eyebrow" style="color:var(--ink2);margin-bottom:10px">The read</div>${read(x,y)}</div>
    <div class="read"><div class="eyebrow" style="color:var(--ink2);margin-bottom:12px">Terpenes</div>
    <div class="cmp" style="margin-top:0">
      ${keys.map(k => {
        const p = x.terpenes[k]||0, q = y.terpenes[k]||0;
        return `<div class="val r">${tpct(p)}</div>
          <div style="display:grid;grid-template-columns:1fr 108px 1fr;align-items:center;gap:9px;grid-column:2;width:100%">
            <div class="tr l"><i style="width:${p/max*100}%;background:${col(k)};opacity:${p>=q?1:.42}"></i></div>
            <div class="nm">${termName(k, keys)}</div>
            <div class="tr r"><i style="width:${q/max*100}%;background:${col(k)};opacity:${q>=p?1:.42}"></i></div>
          </div>
          <div class="val">${tpct(q)}</div>`;
      }).join('')}
    </div></div>
  </div>`;
}

function categoryButtons(catKey, current){
  return `<div class="catseg" data-catkey="${catKey}">${CATEGORIES.map(c =>
    `<button type="button" class="${c===current?'active':''}" data-cat="${c}">${c}</button>`).join('')}</div>`;
}

// ── reusable searchable combobox: filters a product list by strain or brand.
// One instance per `id` (e.g. 'a', 'b', 'similar'); state persists across re-renders.
//
// The <input> node is mounted ONCE by comboShellHTML (called only from the full
// render(), on tab switch / selection / category change — never on keystroke).
// Typing only replaces the .combo-list-holder's contents via updateComboList().
// Destroying and recreating a focused input on every keystroke is exactly the
// bug reported in round 3 (search "can't be typed into") — never do that again.
let COMBO = {};
const comboState = id => COMBO[id] || (COMBO[id] = {query: null, open: false, highlight: -1, filtered: []});
// Compact form for the pickers: "Flower 3.5g", "Preroll 1g×4", "Vape Cart 1g".
//
// The CATEGORY is what these labels used to be missing, and it's the difference
// between two genuinely different products. Acapulco Gold at 1g exists three
// times in this catalogue — a vape cart (83% THC), an infused preroll (44%) and
// a preroll (30%) — and the picker rendered all three as "Acapulco Gold
// (Brand) · 1g". 17 strains here are carried by more than one brand, and one
// pair (Pineapple Express 1g) is a vape versus flower. The only reason that was
// ever workable is that the person using it already knew the shelf by heart.
const comboForm = p => {
  const s = parseSize(p);
  const w = s ? (s.count > 1 ? `${gstr(s.per)}×${s.count}` : gstr(s.per)) : '';
  const c = category(p);
  return (c === 'Vape' ? ['Vape', vapeType(p), w]
                       : [isInfused(p) ? 'Infused' : '', c, w]).filter(Boolean).join(' ');
};
// Ordered by what disambiguates fastest — strain, then form+weight, then brand.
// The Compare tab puts two of these side by side, so on a phone the text WILL
// truncate; this order means what gets cut is the brand, which is also printed
// on the card, rather than the form, which isn't anywhere else in the picker.
const comboLabel = p => p ? `${p.strain} · ${comboForm(p)} · ${p.brand}` : '';
const comboSelectedId = id => id === 'similar' ? sel : id === 'a' ? a : b;
const comboSelectedProduct = id => DATA.find(p => key(p) === comboSelectedId(id));

function comboListHTML(id, list){
  const st = comboState(id);
  if (!st.open) return '';
  const q = (st.query || '').toLowerCase().trim();
  // plain case-insensitive substring match on strain + brand — no fuzzy scoring,
  // no fallback to a stale/previous result. Zero matches means "no matches," full stop.
  // Never offer the product the OTHER box already holds. Picking it leaves both
  // boxes visibly full while the page still says "Pick a second product to
  // compare against" — you did, and it's telling you to do it again. Compare
  // needs two DIFFERENT products (see the x !== y test in render), so the honest
  // place to say so is the list that offered the choice, not a message after it.
  //
  // Compare-from-a-card is what made this worth fixing: it lands you with one
  // side filled and this list open, so the duplicate is sitting right there
  // under the name you just came from.
  const taken = id === 'a' ? b : id === 'b' ? a : null;
  // NOTHING UNTIL YOU HAVE TYPED TWO CHARACTERS.
  //
  // Focusing the box used to drop the whole pool open — 340 products for Find
  // similar, 200 for Compare — which is not a menu anyone scrolls, it is the
  // catalogue with a scrollbar. (Alisha, 24 Aug: "the list is too large to even
  // scroll through to find what you're looking for".)
  //
  // Two, not one, because one barely helps: measured across every first letter
  // in the archive, one character leaves a median of 161 matches and as many as
  // 300 — the same wall of names, marginally shorter. Two takes the median to 22
  // and three to 3.
  //
  // One character still answers, with a line rather than a list, because a
  // picker that goes silent while you type reads as broken. The input's own
  // placeholder carries the instruction before that.
  if (q.length < 2){
    st.filtered = [];
    st.highlight = -1;
    return q.length === 0 ? ''
      : `<ul class="combo-list"><li class="combo-empty">Keep typing…</li></ul>`;
  }

  const filtered = list.filter(p => searchable(p).includes(searchNorm(q))
    && !(taken && key(p) === taken));
  st.filtered = filtered;
  if (!filtered.length) return `<ul class="combo-list"><li class="combo-empty">No matches found</li></ul>`;
  return `<ul class="combo-list">${filtered.map((p,i) => `<li data-id="${key(p)}" class="${i===st.highlight?'hl':''}">${p.strain} <span>${comboForm(p)} · ${p.brand}${stocked(p)?'':' · sold out'}</span></li>`).join('')}</ul>`;
}
function comboShellHTML(id, list, selectedId){
  const st = comboState(id);
  // Fall back to the whole archive for the label so a pre-filled selection that
  // isn't in the (in-stock) list — e.g. a sold-out source carried in from Find
  // similar's Compare ↔ — still shows its name instead of an empty box.
  const selected = list.find(p => key(p) === selectedId) || DATA.find(p => key(p) === selectedId);
  const shown = st.query !== null ? st.query : comboLabel(selected);
  return `<div class="combo" data-combo="${id}">
    <input type="text" class="combo-input" id="combo-${id}" autocomplete="off"
      placeholder="Search strain or brand…" value="${shown.replace(/"/g,'&quot;')}">
    <button type="button" class="clearbtn${shown ? ' show' : ''}" data-clear="combo-${id}" aria-label="Clear">&times;</button>
    <div class="combo-list-holder">${comboListHTML(id, list)}</div>
  </div>`;
}
// Find Similar's source picker searches the WHOLE archive, sold-out included —
// "I loved X, you're out of it, what's close?" is the question it exists to
// answer, so the discontinued product has to be selectable. Compare's two
// pickers stay on the in-stock pool. (Recommendations are filtered separately;
// only in-stock items are ever suggested.)
const comboSource = id => id === 'similar'
  ? DATA.slice().sort((x, y) => x.strain.localeCompare(y.strain, undefined, {sensitivity: 'base'}))
  : pool();
function updateComboList(id){
  const holder = document.querySelector(`[data-combo="${id}"] .combo-list-holder`);
  if (holder) holder.innerHTML = comboListHTML(id, comboSource(id));
}
function comboChoose(id, productId){
  const st = comboState(id);
  st.query = null; st.open = false; st.highlight = -1;
  // Picking a source also sets the result filter to that source's category.
  // "What can I hand this customer instead" almost always means the same shelf
  // — a cart is not a substitute for an eighth, however close the terpenes are.
  // It's a default, not a lock: the segment stays tappable, and All is one tap
  // away. The next selection re-defaults, which is why a manual override isn't
  // remembered across picks.
  if (id === 'similar'){
    sel = productId;
    const src = DATA.find(x => key(x) === productId);
    if (src) simCat = category(src);
  }
  else if (id === 'a') a = productId;
  else if (id === 'b') b = productId;
  render();   // a real selection, not a keystroke — safe to fully rebuild
}

// Find similar → Compare, in one tap. Pre-fills the pair you were already
// looking at (source on the left, the result you tapped on the right) so the
// full side-by-side is one click away instead of two hand-picks. Clearing any
// typed combo text means the pickers show the new selection, not stale input.
// `focusId` is for the card version, which arrives with only ONE side filled and
// has to leave the other to you — cursor in the empty box, picker already open,
// exactly as if you had tapped it.
//
// It opens that picker EXPLICITLY rather than letting focus() trigger the
// focusin handler below. Tempting, since that handler does precisely this — but
// a programmatic focus() does not reliably dispatch focusin (an unfocused or
// background window swallows it), and when it doesn't you land on an empty box
// with no list, which reads as the shortcut half-working. Measured: focus()
// alone left the picker shut every time.
//
// The two paths can't double up: focusin returns early when the picker is
// already open, so a real focus event after this one is a no-op rather than a
// reset of what you just started typing.
//
// It deliberately does NOT guess the second product. Compare used to default to
// the first two products in the list, and the note in render() explains why that
// went: it was a confident-looking answer to a question nobody asked. Filling
// one side is a shortcut; filling both would be an opinion.
function openCompare(leftKey, rightKey, focusId = null){
  tab = 'compare'; a = leftKey; b = rightKey;
  if (COMBO.a) COMBO.a.query = null;
  if (COMBO.b) COMBO.b.query = null;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (focusId){
    const box = document.getElementById('combo-' + focusId);
    if (box){
      const st = comboState(focusId);
      st.open = true; st.query = ''; st.highlight = -1;
      box.value = '';               // direct DOM write, same as focusin does
      updateComboList(focusId);
      box.focus();
    }
  }
}

function render(){
  const P = $('#panel'), O = $('#out');
  document.querySelectorAll('.tabs button').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === tab));
  // The out-of-stock toggle only belongs where you're browsing the whole
  // archive (Compare, Lookup). Match by effect and Find similar both answer
  // "what can I hand this customer?" — a sold-out item is never an answer there,
  // so those tabs are in-stock-only and hide the toggle rather than show a
  // control that does nothing.
  const stockRow = document.querySelector('.stockrow');
  if (stockRow) stockRow.style.display = (tab === 'similar' || tab === 'effect') ? 'none' : '';
  const list = pool();
  // The sandbox strip now lives at the top of the page rather than in the panel,
  // so it's written to its own node here. The record count still has to update
  // as records load, which is why it isn't just static markup.
  const sandtop = document.getElementById('sandtop');
  if (sandtop) sandtop.innerHTML = SANDBOX
    ? `<div class="sandbox-strip">SANDBOX · ${DATA.length} records · nothing here reaches the shop</div>` : '';
  // `banner` is now only the transient flash message, which belongs with the
  // results it's reporting on ("Blue Dream — marked sold out").
  const banner = flash ? `<div class="flash">${flash}</div>` : '';

  if (tab === 'effect'){
    // mount the shell ONCE per render(); typing updates results only, via
    // renderEffectResults() — never touches this <input> node (see combo comment above)
    // Infusion and hardware are settled BEFORE sizes, because sizes are derived
    // from what they leave behind. Reading a stale effInfused here would filter
    // the size list by a control that is about to reset itself.
    const infusedApplies = inStock().some(p =>
      (effCat === 'All' || category(p) === effCat) && isInfused(p));
    if (!infusedApplies) effInfused = 'any';
    const hardwareApplies = effCat === 'Vape';
    if (!hardwareApplies) effHardware = 'any';

    // Sizes offered are the sizes you can actually GET, given everything else
    // already chosen — not every size the category has ever carried.
    //
    // This used to filter on category alone, so picking Sativa left 4.5g in the
    // list when every 4.5g on the shelf is a hybrid. Measured across all
    // category x type x infusion combinations: 186 of 504 offered sizes led to
    // an empty case. 37% of the menu was dead.
    //
    // It is the same rule the infusion control already follows — ask the shelf,
    // don't assert — extended to the one dropdown that was still asserting.
    const sizePool = inStock().filter(p =>
      (effCat === 'All' || category(p) === effCat)
      && (effLean === 'any' || shelfTag(p) === effLean)
      && (effInfused === 'any' || (effInfused === 'yes') === isInfused(p))
      && (effHardware === 'any' || (effHardware === 'none' ? !vapeType(p) : vapeType(p) === effHardware)));
    const sizeKeys = [...new Set(sizePool.map(sizeKey).filter(Boolean))]
      .sort((a,b) => parseFloat(a.slice(2)) - parseFloat(b.slice(2)));
    const sizeSingles = sizeKeys.filter(k => k[0] === 's');
    const sizePacks   = sizeKeys.filter(k => k[0] === 'p');
    // The group-wide options are only offered when the category actually has
    // both kinds, so they have to be allowed here too or picking one and then
    // switching category would silently drop the selection.
    const sizeValid = ['any', ...sizeKeys]
      .concat(sizePacks.length && sizeSingles.length ? ['s|*', 'p|*'] : []);
    if (!sizeValid.includes(effSize)) effSize = 'any';   // category changed out from under it
    // Infusion is a preroll question — 27 of 67 in-stock prerolls are infused,
    // against 1 flower and 0 vapes. So the picker only appears where it can do
    // something, and resets when you leave.
    // The infusion dropdown used to be hard-coded to All and Preroll, on the
    // assumption that only prerolls come infused. Moonrocks broke that: Lobo
    // sells infused FLOWER, and at 50.8% and 57.0% THC against a 27.9% flower
    // median it is the single case where a customer most needs to know. So ask
    // the shelf instead of asserting — the control appears wherever an infused
    // product actually exists in the current category, and disappears when the
    // last one sells out. No vape form says "infused" (concentrate by
    // definition), so this doesn't put a meaningless control on that tab.
    // Cart vs disposable, on the Vape tab only. Deliberately NOT on All: setting
    // it there would hide every flower and preroll on the shelf, which is not
    // what "carts" means to someone asking. Vape-only costs a customer at All
    // one extra tap and can never silently empty the case. (Both are settled
    // above, where the size list needs them.)
    // Every vape names its hardware today, so this option stays hidden. It
    // appears by itself the moment a capture lands without one, because the
    // alternative is a set filter quietly dropping records that match neither
    // value — the failure the shelf-derived infusion control was built to avoid.
    const hardwareUnset = hardwareApplies
      && inStock().some(p => category(p) === 'Vape' && !vapeType(p));
    // Funnel order, top to bottom: category → type → size → effect. The effect
    // box is the last, finest filter ("flower › indica › 3.5g › heavy"), so it
    // sits at the bottom, below the dropdowns.
    P.innerHTML = banner + categoryButtons('effCat', effCat)
      + `<div class="pair">
           <select id="effLean" aria-label="Sativa / Indica / Hybrid"${effLean!=='any'?' data-set':''}>
             <option value="any"${effLean==='any'?' selected':''}>Any type</option>
             <option value="Sativa"${effLean==='Sativa'?' selected':''}>Sativa</option>
             <option value="Indica"${effLean==='Indica'?' selected':''}>Indica</option>
             <option value="Hybrid"${effLean==='Hybrid'?' selected':''}>Hybrid</option>
           </select>
           <select id="effSize" aria-label="Size"${effSize!=='any'?' data-set':''}>
             <option value="any"${effSize==='any'?' selected':''}>Any size</option>
             ${(() => {
               const opt = k => `<option value="${k}"${effSize===k?' selected':''}>${k.slice(2)}</option>`;
               // Only group when there is something to group against. With no
               // packs in the category (Flower, Vape) a lone "Singles" heading
               // would be a distinction the shelf doesn't make.
               // Each group leads with an all-of-this-kind option: the ask at the
               // counter is "a pack of prerolls", and reaching that by size meant
               // knowing which sizes even come in packs (0.6g, 0.7g and 0.9g are
               // packs only; 1g is 25 singles against 1 pack).
               const all = (k, label) => `<option value="${k}"${effSize===k?' selected':''}>${label}</option>`;
               return sizePacks.length && sizeSingles.length
                 ? `<optgroup label="Singles">${all('s|*','All singles')}${sizeSingles.map(opt).join('')}</optgroup>`
                   + `<optgroup label="Multipacks">${all('p|*','All multipacks')}${sizePacks.map(opt).join('')}</optgroup>`
                 : sizeKeys.map(k => `<option value="${k}"${effSize===k?' selected':''}>${k.slice(2)}${k[0]==='p'?' pack':''}</option>`).join('');
             })()}
           </select>
           ${infusedApplies ? `<select id="effInfused" aria-label="Infused or non-infused"${effInfused!=='any'?' data-set':''}>
             <option value="any"${effInfused==='any'?' selected':''}>Any infusion</option>
             <option value="yes"${effInfused==='yes'?' selected':''}>Infused</option>
             <option value="no"${effInfused==='no'?' selected':''}>Non-infused</option>
           </select>` : ''}
           ${hardwareApplies ? `<select id="effHardware" aria-label="Cartridge or disposable"${effHardware!=='any'?' data-set':''}>
             <option value="any"${effHardware==='any'?' selected':''}>Any hardware</option>
             <option value="Cart"${effHardware==='Cart'?' selected':''}>Cart</option>
             <option value="Disposable"${effHardware==='Disposable'?' selected':''}>Disposable</option>
             ${hardwareUnset ? `<option value="none"${effHardware==='none'?' selected':''}>Not specified</option>` : ''}
           </select>` : ''}
         </div>
         <div class="searchwrap">
           <input type="text" id="q" placeholder='e.g. "relaxing but not sleepy" or "for a concert"' value="${window._q||''}">
           <button type="button" class="clearbtn${(window._q||'') ? ' show' : ''}" data-clear="q" aria-label="Clear search">&times;</button>
         </div>`;
    return renderEffectResults();
  }

  if (tab === 'similar'){
    // source: anything in the archive, including sold-out. candidates: in stock only.
    const sources = comboSource('similar');
    // Only keep a selection that still resolves; never invent one. This used to
    // fall back to sources[0], so opening the tab silently picked whatever
    // happened to sort first and presented matches for a product nobody asked
    // about — results that look like an answer to a question you didn't ask.
    if (sel && !DATA.some(p=>key(p)===sel)) sel = null;
    P.innerHTML = banner + comboShellHTML('similar', sources, sel) + categoryButtons('simCat', simCat);
    const p = sel ? DATA.find(x => key(x) === sel) : null;
    if (!p){
      O.innerHTML = sources.length
        ? `<div class="empty">Start with what they liked.<br><span style="font-size:13px">Type a strain or brand above — Compass finds what's closest to it on the shelf.</span></div>`
        : `<div class="empty">No records yet.</div>`;
      return foot();
    }
    // Similarity is a comparison of two terpene profiles. With no profile on the
    // source there is nothing to compare, and every score comes back 0 — which
    // would render as a confident-looking "nothing is close to this." Say the
    // true reason instead.
    if (!hasProfile(p)){
      O.innerHTML = `<div class="card"><div class="warnbox" style="margin:0">
        <b>${p.strain}</b> has no terpene profile on file — the lab reported cannabinoids only.
        There's nothing to match against, so Compass can't suggest a substitute for it.
        Match by the package, the brand, or ask what they liked about it.</div></div>`;
      return foot();
    }

    // Results are ALWAYS in-stock only — the whole question is "what can I hand
    // this customer instead," and a sold-out match can't be handed to anyone.
    // (The source above is the opposite: sold-out included, because the thing
    // they loved being gone is exactly why you're here.) The global "include
    // out-of-stock" toggle is hidden on this tab for the same reason.
    // The category filter narrows the results only — the source is unaffected.
    // hasProfile: a record with no terpene data scores 0 against everything, so
    // it would sit at the bottom of the list as a meaningless "0% match" — it
    // isn't a candidate for a chemistry match at all.
    // collapseBatches here too, or a product with two batches on the shelf
    // returns two matches a fraction of a percent apart — which reads as the
    // tool padding the list rather than as one substitute you can hand over.
    const candidates = collapseBatches(DATA.filter(x => key(x) !== key(p) && stocked(x) && hasProfile(x)
      && (simCat === 'All' || category(x) === simCat)));
    if (!candidates.length){
      // Now that the filter auto-follows the source, the likeliest way to land
      // here is a thin category rather than an empty catalogue — so say which
      // one is the constraint and point at the way out.
      O.innerHTML = simCat === 'All'
        ? `<div class="empty">No records scanned to compare against.</div>`
        : `<div class="empty">Nothing else in stock under ${simCat}.<br><span style="font-size:13px">Tap All above to match across every category.</span></div>`;
      return foot();
    }
    const ranked = candidates.map(x => [sim(p,x), x]).sort((m,n) => n[0]-m[0]);
    // A faint source has lost its volatile terpenes, so "similar" mostly means
    // "also heavy-terpene-dominant" — which is what everything degrades toward.
    // The tool penalises faint everywhere else; Find Similar shouldn't present a
    // confident 96% off an unreliable source without saying so. ~a third of the
    // catalogue is faint, so this fires often.
    const faintSrcNote = p.confidence === 'faint'
      ? `<div class="warnbox" style="margin:0 0 12px">⚠ <b>${p.strain}</b>'s own profile is faint, so these matches are approximate — they mostly share the heavy terpenes that survive in everything. ${smellable(p) ? 'Lean on the package and your nose here.' : 'Lean on brand or price here.'}</div>`
      : '';
    // Same weight first. A 3.5g and a 28g of one strain test differently, and a
    // customer holding an eighth doesn't want an ounce in the list — so matches
    // in the source's own size lead, and strong matches in other sizes drop into
    // the pivot section below (never mixed in). If the source has no parseable
    // weight (vape carts etc.), or nothing else in its size was scanned, fall
    // back to ranking every size — better than an empty screen.
    //
    // Infusion joins size as a primary criterion, and arguably matters more:
    // infused prerolls here run a median 37.2% THC against 27.1% for plain ones,
    // so handing a plain-preroll customer an infused substitute is a bigger
    // change to their evening than handing them a different weight. It isn't
    // special-cased to prerolls — no vape form says "infused" so the split is a
    // no-op there, and Lobo's infused FLOWER gets separated correctly for free.
    //
    // Requiring both still leaves room: across the 124 preroll sources the median
    // candidate pool goes 26 -> 13, and exactly one source ends up with no
    // same-size-same-infusion match at all. `primary` already falls back to the
    // whole ranking when the strict set is empty, so that one degrades rather
    // than breaking.
    // The two kinds of mismatch are NOT the same kind of thing, and dimming both
    // said they were. A different size is a compromise — they wanted an eighth
    // and this is an ounce. A different infusion isn't worse, it's a different
    // product: same weight, same profile, and it will hit differently. That's
    // something to offer plainly and say out loud, not to grey out.
    //
    //   tier 1  same size, same infusion   full cards — the direct answer
    //   tier 2  same size, other infusion  full cards, own heading, NOT dimmed
    //   tier 3  a different size           dimmed, as the pivot always was
    //
    // Tier 2 carries real content most of the time: 99 of 124 preroll sources
    // have a strong one, and 65 of 92 flower sources do — the flower cases being
    // Lobo's Moonrocks, which at 50-57% THC against a 27.9% median is exactly the
    // swap a customer most needs warning about.
    //
    // HARDWARE IS THE VAPE'S VERSION OF INFUSION. No vape form says "infused",
    // so the tier-2 split used to be a no-op for every vape source — a whole
    // category with no secondary criterion at all. But a disposable and a
    // cartridge are not interchangeable in the way the split exists to capture:
    // a customer holding a disposable may own no battery, so handing them a cart
    // is not a near-miss, it is a product they cannot use tonight. Same shape as
    // infusion — same size, same profile, different thing in the hand — so it is
    // the same tier, not a dimmed one. (Alisha, 23 Aug.)
    //
    // It only separates when BOTH sides state their hardware. Twelve vapes on
    // the shelf name none, and an unstated one is not evidence of disagreement —
    // treating it as its own class would strand those twelve in a tier of
    // stragglers, which is worse than saying nothing. So unknown stays put.
    const hwOf = x => category(x) === 'Vape' ? vapeType(x) : '';
    const srcW = weightOnly(p), srcInf = isInfused(p), srcHw = hwOf(p);
    const sameSize = ([,x]) => !srcW || weightOnly(x) === srcW;
    // Either axis can send a candidate to tier 2; for any given source only one
    // of them can fire, since no vape is infused and no preroll has hardware.
    const kindDiffers = x => {
      const hw = hwOf(x);
      return isInfused(x) !== srcInf || (!!srcHw && !!hw && hw !== srcHw);
    };
    const tier1 = preferSameShelf(ranked.filter(r => sameSize(r) && !kindDiffers(r[1])), p);
    const tier2 = preferSameShelf(ranked.filter(r => sameSize(r) && kindDiffers(r[1])), p);
    const tier3 = srcW ? preferSameShelf(ranked.filter(r => !sameSize(r)), p) : [];
    // One source on the shelf — the only 0.9g x5 — has no tier 1 at all. It falls
    // back to the whole ranking, and the two sections below are suppressed so the
    // same cards don't appear twice under contradictory headings.
    const fellBack = !tier1.length;
    // preferSameShelf on the fallback too. It was applied to the three tiers and
    // not to `ranked`, so for exactly the sources that have no same-size match —
    // the 0.9g x5 named above, and any other product alone in its form — the
    // tiebreak silently did not apply and Find similar still led with an
    // outright opposite shelf tag. The window is per-list by design, so this is
    // its own call rather than one hoisted above the tiers.
    const primary = fellBack ? preferSameShelf(ranked, p) : tier1;
    // Two, not four: this is an alternative to consider, not a second list to
    // work through. The THC and total terps now sit on every card, so "stronger"
    // doesn't need asserting in the heading — it's legible on the card itself.
    const altHead = srcHw
      ? (srcHw === 'Disposable' ? 'Also close, but a cartridge' : 'Also close, but a disposable')
      : srcInf ? 'Also close, but not infused' : 'Also close, but infused';
    O.innerHTML = faintSrcNote + (ranked[0][0] < 0.5
        ? `<div class="card"><div class="warnbox" style="margin:0">Nothing <b>scanned</b> is close to <b>${p.strain}</b> — its profile is ${domTerps(p).slice(0,2).map(k=>short(k).toLowerCase()).join('/')}-led and nothing else in here looks like that. <b>Say so. Don't substitute.</b> Worth a look at the shelf too, in case something isn't scanned yet.</div></div>`
        : '')
      + primary.slice(0,4).map(([s,x]) => card(x, matchNote(p, x, s), key(p))).join('')
      // Tier 2 — full brightness on purpose. It's the same weight and a close
      // profile; the only difference is one the heading names outright. Dimming
      // it would say "settle for this", which is the wrong thing to say about a
      // product that may be exactly what they want once they know it's infused.
      + (!fellBack && tier2.length && tier2[0][0] >= 0.5
          ? `<div class="pivot-head">${altHead}</div>`
            + tier2.slice(0,2).map(([s,x]) => card(x, matchNote(p, x, s), key(p))).join('')
          : '')
      // Tier 3 keeps the dimming, because a different size IS a compromise. Same
      // full card though — a compact teaser you can't act on is the wrong shape
      // here. The read, the terpenes and Compare ↔ are all there, so pivoting is
      // a decision you can make rather than a name to go look up.
      + (!fellBack && tier3.length && tier3[0][0] >= 0.5
          // "elsewhere on the shelf", not "in other sizes". Tier 3 is chosen on
          // ONE test — the weight differs — and with All tapped that catches other
          // product types too, so the old heading called a preroll a size. Real
          // case, 28 Aug: Green Goblin's tier 3 held two 1g flowers AND two
          // prerolls, all at 96-97% match, under a heading saying "sizes".
          //
          // The alternatives all named the axis — "formats or sizes", "types or
          // sizes" — and every one then needs a conditional, or it announces
          // formats above a list of plain sizes. This phrasing is true whatever
          // the group holds, so it cannot be wrong and needs no branch. It is
          // vaguer; each card below states its own form, which is where the
          // reader gets the specific answer.
          //
          // "format" was rejected as brand-deck vocabulary, "form" as the data
          // field's own name leaking onto the screen. (Alisha, 28 Aug: "I'm
          // wondering if 'format' is a good word for a budtender".)
          ? `<div class="pivot-head">Closest elsewhere on the shelf — worth a pivot</div>`
            + tier3.slice(0,4).map(([s,x]) =>
                `<div class="card-dim">${card(x, matchNote(p, x, s), key(p))}</div>`).join('')
          : '');
    return foot();
  }

  if (tab === 'lookup'){
    P.innerHTML = banner + `<div class="searchwrap">
        <input type="text" id="lookupQ" placeholder="Type a strain or brand…" value="${lookupQ.replace(/"/g,'&quot;')}">
        <button type="button" class="clearbtn${lookupQ ? ' show' : ''}" data-clear="lookupQ" aria-label="Clear search">&times;</button>
      </div>` + categoryButtons('lookupCat', lookupCat);
    return renderLookupResults();
  }

  // compare
  // Validate a selection against the WHOLE archive, not the in-stock pool: the
  // compare view renders sold-out products fine (DATA.find below), and a source
  // handed in from Find similar's Compare ↔ is often exactly a sold-out item —
  // guarding on the pool would silently swap it for a random in-stock strain.
  // The picker DROPDOWNS still list only in-stock (comboSource uses pool); this
  // only stops a valid pre-set selection from being reset out from under us.
  // Drop a selection that no longer resolves, but never invent one. This used to
  // default to list[0] and list[1], so opening Compare put up a comparison of
  // the two products that happened to sort first — a confident-looking answer to
  // a question nobody asked. Compare ↔ from Find similar still pre-fills both,
  // because there the pair IS the question.
  if (a && !DATA.some(p=>key(p)===a)) a = null;
  if (b && !DATA.some(p=>key(p)===b)) b = null;
  P.innerHTML = banner + `<div class="pair pair-compare">${comboShellHTML('a', list, a)}${comboShellHTML('b', list, b)}</div>`;
  const x = a ? DATA.find(p => key(p) === a) : null, y = b ? DATA.find(p => key(p) === b) : null;
  O.innerHTML = (x && y && x !== y) ? compare(x, y)
    : (x || y)
      ? `<div class="empty">Pick a second product to compare against.</div>`
      : `<div class="empty">Pick two products to compare.<br><span style="font-size:13px">Type a strain or brand in each box — Compass shows how they differ.</span></div>`;
  foot();
}

// ── effect-tab results only: called on every keystroke AND on full render().
// Must never touch #q or the category buttons' DOM nodes wholesale — only
// toggle their .active class and rewrite #out. (Root cause of round-3 bugs
// #1/#2/#3: rebuilding an input on every keystroke kills focus mid-type.)
// ── how many effect results to show, and why it's a shortlist
//
// The score is a RANKING, not a filter. The > 0.02 cut barely cuts: "relaxing"
// clears it on 186 of 191 in-stock products, "not too heavy" on 189 — because
// nearly everything carries some of any given terpene. So there is no natural
// cutoff, and showing everything would just be the whole case in score order.
//
// A cap is therefore right. What was wrong is that it was SILENT: it stopped at
// six with nothing to say there were 180 more, so a budtender scrolling for
// options couldn't tell a shortlist from the end of the shelf. Now it says the
// count and offers the rest.
const EFF_TOP = 6;
// `what` describes the set being counted. An effect query and a terpene search
// are counting different things, and one phrase for both misdescribes whichever
// it wasn't written for.
const moreRow = (total, what = 'that match at all — the rest carry less of what you asked for') =>
  total <= EFF_TOP ? '' : (effShowAll
    ? `<div class="morerow">All ${total} shown, in order. <button type="button" data-effmore="0">Show top ${EFF_TOP}</button></div>`
    : `<div class="morerow">Showing ${EFF_TOP} of <b>${total}</b> ${what}. <button type="button" data-effmore="1">Show all ${total}</button></div>`);

// ── terpene-name search
//
// Rare at the counter, but it is the one search here that asserts NOTHING: it
// reports what the lab measured and ranks by it. That also makes it the honest
// answer for a terpene with no character word — valencene, fenchol and
// caryophyllene oxide become findable without anyone inventing an effect for
// them. The index covers every terpene present in the data, not just the ones
// CHAR knows about.
//
// README has listed "limonene" as an example query since the beginning and it
// never worked; PREMISE has it as designed-but-not-built. This is that.
let _terpIdx = null;
function terpIndex(){
  if (_terpIdx && _terpIdx.n === DATA.length) return _terpIdx.map;
  // Strip to letters and digits so "β-Caryophyllene", "beta-caryophyllene" and
  // "Beta Caryophyllene" all land on one string, and the greek-letter form
  // collapses onto the bare name for free.
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const map = new Map();
  const put = (s, k) => {
    const n = norm(s);
    if (n.length < 4) return;              // "pine" must never reach "pinene"
    if (!map.has(n)) map.set(n, new Set());
    map.get(n).add(k);
  };
  const keys = new Set(Object.keys(CHAR));
  DATA.forEach(p => Object.keys(p.terpenes || {}).forEach(k => keys.add(k)));
  keys.forEach(k => {
    put(k, k);
    put(short(k), k);
    // Bare form, so "pinene" finds BOTH pinenes rather than whichever was
    // indexed last — that's why the map holds a Set per name.
    put(String(k).replace(/^(alpha|beta|gamma|delta|cis|trans)[- ]?/i, ''), k);
  });
  // A record may still hold a pre-alias spelling; keep those searchable.
  Object.entries(TERP_ALIAS).forEach(([from, to]) => { put(from, to); put(short(from), to); });
  _terpIdx = { n: DATA.length, map };
  return map;
}
// Levenshtein, abandoned as soon as it exceeds `max` — we only ever ask "is this
// within two edits", never how far apart two unrelated words are.
function editDist(a, b, max){
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++){
    const cur = [i];
    let best = i;
    for (let j = 1; j <= b.length; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
      if (cur[j] < best) best = cur[j];
    }
    if (best > max) return max + 1;      // whole row already too far; stop
    prev = cur;
  }
  return prev[b.length];
}

// Nobody spells these reliably, so match on WORDS and allow near-misses.
//
// Raw substring matching — the first version of this — is actively dangerous
// here: "nerolidal" contains "nerol", which is a different compound, so a
// misspelling of nerolidol silently returned the wrong terpene. Matching whole
// words and ranking by edit distance puts nerolidol (1 edit) ahead of nerol (4).
//
// Candidates are each word plus each adjacent PAIR joined, so "caryophyllene
// oxide" beats the bare "caryophyllene" on length, and a sentence like
// "something with limonene" still finds limonene — which a ratio test against
// the whole query could not do.
function matchTerpQuery(q){
  const words = String(q || '').toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 1);
  if (!words.length) return null;
  const cands = [...words];
  for (let i = 0; i < words.length - 1; i++) cands.push(words[i] + words[i+1]);
  const map = terpIndex();

  // 1. spelled right — longest candidate wins
  let exact = null;
  cands.forEach(c => { if (c.length >= 4 && map.has(c) && (!exact || c.length > exact.length)) exact = c; });
  if (exact) return finish(map.get(exact), null);

  // 2. spelled close — nearest name within two edits
  let bestD = 3, near = new Set();
  cands.forEach(c => {
    if (c.length < 5) return;            // too short to guess safely from
    for (const [name, keys] of map){
      const d = editDist(c, name, 2);
      if (d < bestD){ bestD = d; near = new Set(keys); }
      else if (d === bestD && d < 3) keys.forEach(k => near.add(k));
    }
  });
  if (near.size) return finish(near, true);

  // 3. started it right — "caryo", "myrc", "bisab", "terpin"
  const pre = new Set();
  cands.forEach(c => { if (c.length < 4) return;
    for (const [name, keys] of map) if (name.startsWith(c)) keys.forEach(k => pre.add(k)); });
  if (pre.size) return finish(pre, true);
  return null;

  // Two different terpenes is a question, not a guess — "terpin" is equally
  // terpinolene and terpineol, and picking one silently would be a coin flip
  // dressed up as an answer.
  function finish(keys, guessed){
    const groups = new Map();
    [...keys].forEach(k => {
      const g = short(k).toLowerCase();
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(k);
    });
    if (groups.size > 1) return { ambiguous: [...groups.keys()].sort() };
    const [label, ks] = [...groups.entries()][0];
    return { keys: ks, label, guessed };
  }
}

function renderEffectResults(){
  const O = $('#out');
  const rawQ = (window._q||'').toLowerCase().trim();
  const detected = detectCategoryWord(rawQ);
  const activeCat = effCat !== 'All' ? effCat : (detected || 'All');   // explicit button wins; text is a bonus

  document.querySelectorAll('[data-catkey="effCat"] button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.cat === activeCat);
  });

  if (NEVER_DRIVE.test(rawQ)){
    O.innerHTML = `<div class="card"><div class="warnbox" style="margin:0">Not something I'll match on. Nothing on the shelf makes anyone okay to drive — that's true whatever the terpenes say, and a "clear-headed" profile doesn't change it.</div></div>`;
    return foot();
  }
  const med = MEDICAL.find(re => re.test(rawQ));
  if (med){
    O.innerHTML = `<div class="card"><div class="warnbox" style="margin:0">I can't match on medical conditions — that's not a claim this tool is allowed to make, or one the science supports. Try describing the <b>feeling</b> instead: "relaxed but clear-headed", "energetic", "mellow".</div></div>`;
    return foot();
  }

  const list = inStock();   // effect recommends what to sell — in-stock only, and the OOS toggle is hidden here
  const scoped = list.filter(p => (activeCat === 'All' || category(p) === activeCat)
    && (effLean === 'any' || filterLean(p) === LEAN_OF[effLean])   // chemistry where it's readable, the package where it isn't
    && (effInfused === 'any' || isInfused(p) === (effInfused === 'yes'))
    && (effHardware === 'any'
        || (effHardware === 'none' ? !vapeType(p) : vapeType(p) === effHardware)));
  if (!rawQ){
    // Nothing typed AND nothing narrowed: say what the box is for instead of
    // dumping the whole case. 149 cards is a scroll, not an answer, and it
    // contradicts the funnel the panel sets up (category > type > size >
    // effect). The moment any filter is touched, browsing IS the intent — so
    // the cards come back. This is also the only place with room to mention
    // that activities work, which nothing else on screen says.
    if (activeCat === 'All' && effLean === 'any' && effSize === 'any'){
      O.innerHTML = `<div class="empty">
        <b style="color:var(--pale)">What are they after?</b><br>
        Describe the feeling — <i>relaxed but clear-headed</i>, <i>energetic</i>, <i>mellow</i> —
        or just say what they're off to do: <i>a concert</i>, <i>cleaning</i>, <i>a movie</i>.<br><br>
        Or pick a category above to browse the case.</div>`;
      return foot();
    }
    // browsing: the size dropdown just narrows, like the category buttons
    const shown = scoped.filter(p => sizeMatches(p, effSize));
    O.innerHTML = shown.length ? shown.map(p => card(p)).join('')
      : `<div class="empty">No ${effSize === 'any'
          ? (activeCat === 'All' ? '' : activeCat.toLowerCase()+' ') + 'records'
          : sizeLabel(effSize)} scanned yet.</div>`;
    return foot();
  }

  // strip a recognized category word so it doesn't get parsed as an effect keyword
  const qClean = detected ? rawQ.replace(CATEGORY_WORDS.find(([re]) => re.test(rawQ))[0], ' ').replace(/\s+/g,' ').trim() : rawQ;

  // A terpene named directly short-circuits the keyword parse. Someone asking
  // for limonene wants limonene — not the effect words limonene happens to carry,
  // and not products that merely score well on "upbeat".
  const tq = matchTerpQuery(qClean);
  if (tq && tq.ambiguous){
    const a = tq.ambiguous;
    const list = a.length > 2
      ? a.slice(0, -1).map(s => `<b>${s}</b>`).join(', ') + ` or <b>${a[a.length-1]}</b>`
      : a.map(s => `<b>${s}</b>`).join(' or ');
    O.innerHTML = `<div class="empty">Did you mean ${list}?<br>
      <span style="font-size:13px">${a.length} different terpenes start that way, so I'd rather ask than guess.</span></div>`;
    return foot();
  }
  if (tq){
    const amt = p => tq.keys.reduce((s, k) => s + (p.terpenes[k] || 0), 0);
    const ranked = scoped.map(p => [p, amt(p)]).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
    if (!ranked.length){
      // Distinguish "we've never seen it" from "it's just sold out" — those send
      // a budtender in completely different directions.
      const seen = DATA.filter(p => hasProfile(p) && amt(p) > 0).length;
      O.innerHTML = `<div class="empty">Nothing in stock carries <b>${tq.label}</b>.${
        seen ? ` ${seen} scanned record${seen > 1 ? 's do' : ' does'}, but not on the shelf right now.` : ''}</div>`;
      return foot();
    }
    O.innerHTML = `<div class="terphead">${tq.guessed ? `Reading that as <b>${tq.label}</b>. ` : ''}Ranked by measured <b>${tq.label}</b> — what the lab found, not a claim about how it feels.${
      REPORTED[tq.keys[0]] ? '' : `<br>Nothing evidenced about ${tq.label}'s character, so there's no read to go with it.`
    }</div>` + ranked.slice(0, effShowAll ? ranked.length : EFF_TOP).map(([p, v]) =>
      card(p, `<div class="match">${tq.label} ${+v.toFixed(2)}%</div>`)).join('')
      + moreRow(ranked.length, `carrying ${tq.label}, most first`);
    return foot();
  }

  // A PRODUCT NAME TYPED INTO THE EFFECT BOX IS A WRONG-TAB MISTAKE, NOT A QUERY.
  //
  // WANT is matched with `includes`, so any effect word sitting inside a name on
  // the shelf fires on it and returns a confident ranking about something else
  // entirely. "Northern Lights" contains `light`, which steers AWAY from myrcene
  // — the opposite of what Northern Lights is. "Golden Garden" contains `garden`,
  // "Dirty Laundry" contains `laundry`, "LA Confidential" contains `confiden`.
  //
  // Matched on the WHOLE name, never a substring of it, and that is the part
  // that makes this safe: "chill" must keep working as an effect even though
  // Cactus Chiller contains it, and "garden" must keep working even though
  // Golden Garden does. Only a query that IS a name — normalised the same way
  // Lookup normalises, so spelling and punctuation don't decide it — is treated
  // as a wrong turn.
  //
  // It points rather than guesses. Lookup is one tap away and answers exactly
  // this question, so there is nothing to be gained by ranking the shelf against
  // a word the customer never meant as a feeling.
  const asName = searchNorm(rawQ);
  if (asName.length > 2){
    const named = DATA.find(p => searchNorm(p.strain) === asName || searchNorm(p.brand) === asName);
    if (named){
      O.innerHTML = `<div class="empty">“${rawQ}” is a ${searchNorm(named.strain) === asName ? 'product' : 'brand'} name, not a feeling.<br>
        <span style="font-size:13px">Try <b>Lookup</b> for that — this tab searches by how something feels.</span></div>`;
      return foot();
    }
  }

  const [pos, neg] = [[], []];
  qClean.split(/\bbut\b|,|\band\b/).forEach(part => {
    // "nothing heavy" used to score as WANTING myrcene and returned the heaviest
    // products on the shelf — \bno\b can't match inside "nothing". Contractions
    // are matched on the suffix so isn't / doesn't / don't / won't all land.
    const negated = /\bnot\b|\bnothing\b|\bnone\b|\bwithout\b|\bavoid\b|\bless\b|\bskip\b|\bno\b|n't/.test(part);
    Object.entries(WANT).forEach(([kw, spec]) => {
      if (!part.includes(kw)) return;
      // a plain array is all "want"; the object form adds terpenes to steer AWAY
      // from (see the activity words). "not for cleaning" flips both lists.
      const want  = Array.isArray(spec) ? spec : (spec.want  || []);
      const avoid = Array.isArray(spec) ? []   : (spec.avoid || []);
      want.forEach(t => (negated ? neg : pos).push(t));
      avoid.forEach(t => (negated ? pos : neg).push(t));
    });
  });
  if (!pos.length && !neg.length){ O.innerHTML = `<div class="empty">Nothing matched “${rawQ}”. Try a feeling — relaxed, energetic, focused, mellow, sleepy, social — or what they're off to do: a concert, cleaning, errands, a movie.</div>`; return foot(); }

  // A query can be purely negative — "not too heavy", "nothing sleepy" — which is
  // ordinary counter language and used to return NOTHING. The score is
  // wanted-minus-avoided, so with nothing wanted every product scored <= 0 and the
  // > 0.02 cut swept the lot. There's no positive to rank against, so rank by
  // ABSENCE instead: least of the avoided terpene first. Faint profiles sort last
  // rather than being penalised numerically — "low in myrcene" off a degraded
  // reading isn't a finding, but it isn't a reason to hide the product either.
  const scored = pos.length
    ? scoped.map(p => {
        const v = vec(p);
        let s = pos.reduce((t,k) => t + (v[k]||0), 0) - neg.reduce((t,k) => t + (v[k]||0)*1.4, 0);
        if (p.confidence === 'faint') s *= 0.45;   // faded profiles don't get to win
        return [s, p];
      }).filter(([s]) => s > 0.02).sort((m,n) => n[0]-m[0])
    : scoped.filter(hasProfile)   // no profile = zero myrcene for the wrong reason
        .map(p => {
          const v = vec(p);
          return [neg.reduce((t,k) => t + (v[k]||0), 0), p];
        }).sort((m,n) => (m[1].confidence === 'faint') - (n[1].confidence === 'faint') || m[0]-n[0]);

  const noFit = `<div class="empty">Nothing scanned fits that. Saying so is better than a bad substitution — but check the shelf for anything not scanned yet.</div>`;
  if (!scored.length){ O.innerHTML = noFit; return foot(); }

  if (effSize === 'any'){
    O.innerHTML = scored.slice(0, effShowAll ? scored.length : EFF_TOP).map(([,p]) => card(p)).join('')
      + moreRow(scored.length);
    return foot();
  }
  // a size is chosen: the desired size ranks full; strong matches in other
  // sizes drop below, dimmed but readable — you might still pivot to one.
  const inSize = scored.filter(([,p]) => sizeMatches(p, effSize));
  const other  = scored.filter(([,p]) => !sizeMatches(p, effSize));
  O.innerHTML =
    (inSize.length
      ? inSize.slice(0, effShowAll ? inSize.length : EFF_TOP).map(([,p]) => card(p)).join('') + moreRow(inSize.length)
      : `<div class="empty">Nothing in ${sizeLabel(effSize)} fits that${other.length ? ' — but these other sizes are close' : '.'}.</div>`)
    + (other.length
      ? `<div class="pivot-head">Great match, other sizes — worth a pivot</div>`
        + other.slice(0,4).map(([,p]) => pivotRow(p)).join('')
      : '');
  return foot();
}
// a strong effect match that's the wrong size — kept readable but subordinate:
// strain, its three dominant terpenes, and the size, so a pivot is one glance away.
function pivotRow(p){
  const chips = domTerps(p).slice(0,3)
    .map(k => `<span><b style="background:${col(k)}"></b>${short(k).toLowerCase()}</span>`).join('');
  return `<div class="pivot">
    <div><div class="pivot-strain">${p.strain}</div><div class="pivot-terps">${chips}</div></div>
    <span class="tag" style="flex:none">${formLabel(p)}</span>
  </div>`;
}

// ── lookup: type → matching list → tap one → full card (reuses card()).
// Search covers whatever the in-stock toggle currently scopes to, same as
// every other tab. Typing (see the #lookupQ input handler) clears lookupSel
// so a fresh keystroke means "search again" — this function must NOT clear it
// itself, since it also runs right after a selection is made.
function renderLookupResults(){
  const O = $('#out');
  if (lookupSel){
    const p = DATA.find(x => key(x) === lookupSel);
    if (p){
      O.innerHTML = `<button type="button" class="lookup-back" data-lookup-back="1">‹ Back to search</button>` + card(p);
      return foot();
    }
    lookupSel = null;
  }
  const q = lookupQ.trim().toLowerCase();
  if (!q){ O.innerHTML = `<div class="empty">Type a strain or brand to look it up.</div>`; return foot(); }
  // Category first, then text. Searching a brand used to return everything it
  // makes — Dank alone is 14 records across flower, prerolls and packs — and the
  // list gave no way to get to the one shelf you were standing at.
  const matches = pool()
    .filter(p => lookupCat === 'All' || category(p) === lookupCat)
    .filter(p => searchable(p).includes(searchNorm(q)));
  O.innerHTML = matches.length
    ? `<div class="lookup-list">${matches.map(p => `<button type="button" class="lookup-row" data-lookup-id="${key(p)}">
         <span class="lookup-left"><span class="lookup-strain">${p.strain}</span><span class="lookup-meta"><span class="lookup-form">${formLabel(p)}</span>${
           // The same chip the card carries, so the colour means one thing in both
           // places. Unverified keeps its dashed outline rather than a colour it
           // hasn't earned.
           (() => { const t = shelfTag(p);
             return `<span class="tag tag-sm tag-${t === 'Unverified' ? 'unset' : (tagStep(t) || 'shelf')}">${t}</span>`; })()
         }</span></span><span class="lookup-right"><span class="lookup-brand">${p.brand}${stocked(p)?'':' · out of stock'}</span><span class="lookup-nums">${
           // THC leads because it's the one number that reliably drives the
           // experience; terps follow because they're what the card is built on.
           // Either can be missing — a bare record has no profile, and a few have
           // no THC on the COA — so each is dropped rather than printed as "—".
           // thcText, not thc1, so a product with two live packages shows the
           // same span the card does. A row that promised one figure and a card
           // that showed a range would read as a bug in whichever you saw second.
           [p.thc != null ? `<b>${thcText(p)}</b> THC` : '',
            hasProfile(p) && p.total_terpenes > 0 ? `${tpct(p.total_terpenes)}% terps` : '']
             .filter(Boolean).join(' · ')
         }</span></span>
       </button>`).join('')}</div>`
    : `<div class="empty">${lookupCat === 'All'
          ? 'Nothing scanned matches that.'
          : `No ${lookupCat.toLowerCase()} matches that — tap All to search every category.`}<br><span style="font-size:13px">It may be on the shelf but not in Compass yet.</span></div>`;
  return foot();
}
function foot(){
  const unverified = DATA.filter(p => shelfTag(p) === 'Unverified').length;
  // Counted in the footer so a new arrival tells YOU, instead of waiting to be
  // noticed at the counter. All Gas and Americano were both found by smelling
  // the jar; nothing in the tool had flagged either one.
  const unread = DATA.filter(p => hasProfile(p) && unreadTerps(p).hits.length).length;
  // "scanned", not "products" — the catalogue is whatever has been through the
  // capture script, which is not the same as what is on the shelf. Every empty
  // state says so too; this keeps the scope visible even when results look full.
  $('#foot').innerHTML = `${DATA.length} scanned · ${DATA.filter(stocked).length} in stock${
    unreadable ? ` · <b style="color:var(--warn)">${unreadable} ${
      unreadableKind === 'data' ? `unreadable — ${unreadable > 1 ? 'those records have' : 'that record has'} a typo`
      : unreadableKind === 'net' ? "didn't load — try refreshing"
      : "missing — some didn't load, some are unreadable"}</b>` : ''}${
    unverified ? ` · <b>${unverified} shelf tag${unverified>1?'s':''} unverified</b> — tap Edit on a card to set one` : ''}${
    unread ? ` · <b>${unread} with a major terpene I can't describe</b>` : ''}<br>
    ●●● real receptor mechanism · ●●○ some human data · ●○○ folklore<br>
    Only caryophyllene has a mechanism (CB2). The rest is inherited from strain databases.<br>
    <b>THC is the one number on the COA that reliably drives the experience.</b>`;
}

document.addEventListener('click', e => {
  const more = e.target.closest('[data-effmore]');
  if (more){ effShowAll = more.dataset.effmore === '1'; renderEffectResults(); return; }

  const t = e.target.closest('.tabs button');
  if (t){ tab = t.dataset.tab; render(); return; }

  const c = e.target.closest('.catseg button');
  if (c){
    const catKey = c.closest('.catseg').dataset.catkey;
    if (catKey === 'effCat') effCat = c.dataset.cat;
    if (catKey === 'simCat') simCat = c.dataset.cat;
    if (catKey === 'lookupCat'){ lookupCat = c.dataset.cat; lookupSel = null; }   // a new shelf means a new search, not the card you had open
    render();
    return;
  }

  const clr = e.target.closest('[data-clear]');
  if (clr){
    const id = clr.dataset.clear;
    const inp = document.getElementById(id);
    if (inp) inp.value = '';                 // direct write; the node stays mounted
    if (id === 'q'){
      // The x means "next customer", so it clears the FILTERS as well as the
      // text. Leaving them set is how a search silently answers from a fraction
      // of the shelf. The category segment is deliberately left alone: it is
      // visibly lit, so nobody loses track of it the way they do a dropdown —
      // this only resets the state that was invisible.
      window._q = '';
      effLean = 'any'; effSize = 'any'; effInfused = 'any'; effHardware = 'any';
      // A full render(), not renderEffectResults(): the dropdowns themselves
      // have to be redrawn to drop their gold `data-set` edge. That replaces the
      // input node, so `inp` below is stale — re-query and focus here, then
      // return, exactly as the combo branch does.
      render();
      const back = document.getElementById(id);
      if (back){ toggleClear(id); back.focus(); }
      return;
    }
    else if (id.startsWith('combo-')){
      // Clearing a picker drops the SELECTION, not just the typed text —
      // otherwise the box looks empty while the results below still show the
      // old product. render() then puts up the "start with what they liked"
      // empty state. Focus is restored after, because render() rebuilds the node.
      const cid = id.slice(6);
      const st = comboState(cid);
      st.query = null; st.open = false; st.highlight = -1;
      // simCat back to All too — it was set from the product being cleared, and
      // an active "Vape" pill above an empty state describes nothing.
      if (cid === 'similar'){ sel = null; simCat = 'All'; }
      else if (cid === 'a') a = null; else if (cid === 'b') b = null;
      render();
      const back = document.getElementById(id);
      if (back) back.focus();
      return;
    }
    else { lookupQ = ''; lookupSel = null; renderLookupResults(); }
    toggleClear(id);
    if (inp) inp.focus();                    // ready to type the next thing
    return;
  }

  const row = e.target.closest('.lookup-row');
  if (row){ lookupSel = row.dataset.lookupId; renderLookupResults(); return; }
  const back = e.target.closest('[data-lookup-back]');
  if (back){ lookupSel = null; renderLookupResults(); }
});
// Keep the open-Why set in sync with what the reader actually does. `toggle`
// doesn't bubble, so listen in the capture phase (which still reaches document
// for non-bubbling events). No re-render here — the <details> already reflects
// its own new state; we're only remembering it for the NEXT render.
document.addEventListener('toggle', e => {
  const d = e.target;
  if (!d.matches || !d.matches('details.why') || !d.dataset.why) return;
  if (d.open) openWhy.add(d.dataset.why); else openWhy.delete(d.dataset.why);
}, true);
document.addEventListener('change', e => {
  if (e.target.id === 'oos') render();
  // Paint the gold "this filter is set" edge on the live element.
  //
  // It used to be applied only in the markup, which meant it never appeared when
  // you actually changed a dropdown: renderEffectResults() rewrites #out and the
  // category buttons, and never touches the .pair row, so the select kept the
  // attribute state it was born with. Verified in the browser — selecting Indica
  // left data-set absent and the border on --ink. The one control whose whole job
  // is making a forgotten filter visible was invisible in the only case that
  // matters, and a forgotten Indica hides 73% of the shelf.
  //
  // Toggled on the mounted node rather than re-rendering, same rule as
  // toggleClear(): a re-render would replace the select mid-interaction and drop
  // focus, which on a phone closes the picker you just used.
  const markSet = el => el.toggleAttribute('data-set', el.value !== 'any');
  if (e.target.id === 'effSize'){ effSize = e.target.value; markSet(e.target); renderEffectResults(); }
  if (e.target.id === 'effLean'){ effLean = e.target.value; markSet(e.target); renderEffectResults(); }
  if (e.target.id === 'effInfused'){ effInfused = e.target.value; markSet(e.target); renderEffectResults(); }
  if (e.target.id === 'effHardware'){ effHardware = e.target.value; markSet(e.target); renderEffectResults(); }
});
// Show the × only when there's something to clear. Toggles a class on the
// button that's already mounted — never re-renders the input, same rule as
// everything else that runs on keystroke.
function toggleClear(inputId){
  const btn = document.querySelector(`[data-clear="${inputId}"]`);
  const inp = document.getElementById(inputId);
  if (btn && inp) btn.classList.toggle('show', !!inp.value);
}

document.addEventListener('input', e => {
  // Each of these updates ONLY the results below its input — the input node
  // itself is never touched, so focus and cursor position are never at risk.
  if (e.target.id === 'q'){ window._q = e.target.value; effShowAll = false; toggleClear('q'); renderEffectResults(); return; }
  if (e.target.id === 'lookupQ'){ lookupQ = e.target.value; lookupSel = null; toggleClear('lookupQ'); renderLookupResults(); return; }
  const inp = e.target.closest('.combo-input');
  if (inp){
    const id = inp.closest('.combo').dataset.combo;
    const st = comboState(id);
    st.query = inp.value; st.open = true; st.highlight = -1;
    toggleClear('combo-' + id);   // same rule as the other inputs: class only, never re-render
    updateComboList(id);
  }
});

// mousedown (not click) so selecting a row fires before the input's blur closes the list
document.addEventListener('mousedown', e => {
  const li = e.target.closest('.combo-list li[data-id]');
  if (!li) return;
  e.preventDefault();
  comboChoose(li.closest('.combo').dataset.combo, li.dataset.id);
});
document.addEventListener('focusin', e => {
  const inp = e.target.closest('.combo-input');
  if (!inp) return;
  const id = inp.closest('.combo').dataset.combo;
  const st = comboState(id);
  if (st.open) return;   // already open (e.g. refocus after a keypress) — don't reset the query
  st.open = true; st.query = ''; st.highlight = -1;
  inp.value = '';         // clear to search fresh; direct DOM write, no re-render
  updateComboList(id);
});
document.addEventListener('focusout', e => {
  const inp = e.target.closest('.combo-input');
  if (!inp) return;
  const id = inp.closest('.combo').dataset.combo;
  const st = comboState(id);
  st.open = false; st.query = null; st.highlight = -1;
  inp.value = comboLabel(comboSelectedProduct(id));   // revert to the current selection's label
  toggleClear('combo-' + id);
  updateComboList(id);
});
document.addEventListener('keydown', e => {
  const inp = e.target.closest('.combo-input');
  if (!inp) return;
  const id = inp.closest('.combo').dataset.combo;
  const st = comboState(id);
  if (e.key === 'ArrowDown'){
    e.preventDefault(); st.open = true; st.highlight = Math.min(st.highlight+1, st.filtered.length-1);
    updateComboList(id);
  } else if (e.key === 'ArrowUp'){
    e.preventDefault(); st.highlight = Math.max(st.highlight-1, 0);
    updateComboList(id);
  } else if (e.key === 'Enter'){
    e.preventDefault();
    if (st.highlight >= 0 && st.filtered[st.highlight]) comboChoose(id, key(st.filtered[st.highlight]));
  } else if (e.key === 'Escape'){
    st.open = false; st.query = null; st.highlight = -1;
    inp.value = comboLabel(comboSelectedProduct(id));
    toggleClear('combo-' + id);
    updateComboList(id);
    inp.blur();
  }
});

// ── loading data
//
// Preferred path is the Worker: it returns every record in ONE response, using
// its own authenticated GitHub quota. Going straight to GitHub from here means
// 1 API call per load against a limit of 60/hour PER IP — and every device on
// the shop's wifi shares that one number, so a busy shift can exhaust it and
// silently drop everyone back to the embedded seed. The Worker path is what
// makes polling safe.
// Turn [{name, sha, url}] into records. The sha in the URL makes each version
// immutable, so the browser's own cache serves anything that hasn't changed and
// only genuinely-edited records cross the network — while a stock change is
// picked up instantly, because editing a file changes its sha.
async function recordsFromIndex(files){
  // allSettled, NOT Promise.all: one unreadable record (a hand-edit typo like
  // `"thc": 26.07%`, invalid JSON) must never sink the whole load. Skip the bad
  // ones, keep the rest, and surface the count in the footer so the break is
  // visible instead of silent. Only a total wipeout falls back to the caller.
  //
  // The two ways a record can fail here are NOT the same problem and must not be
  // reported as one. A rejected fetch is the network — most often a 429, which is
  // what a per-record burst against raw.githubusercontent used to produce at this
  // catalogue size, and the fix for that is to refresh or wait. A rejected .json()
  // is a genuinely broken record, and the fix is to edit the file. Blaming the
  // data for a rate limit sends whoever investigates hunting for a typo that
  // isn't there — which is exactly what happened.
  const settled = await Promise.allSettled(files.map(async f => {
    let r;
    try { r = await fetch(`${f.url}?v=${f.sha}`); }
    catch (e) { throw Object.assign(new Error('unreachable'), {kind: 'net'}); }
    if (!r.ok) throw Object.assign(new Error('http ' + r.status), {kind: 'net', status: r.status});
    let p;
    try { p = await r.json(); }
    catch (e) { throw Object.assign(new Error('invalid json'), {kind: 'data'}); }
    p._key = f.name.replace(/\.json$/, '');   // repo filename is unique by construction; the record's own `id` isn't
    return normTerps(p);   // synonyms resolved once, here — see TERP_ALIAS
  }));
  const ok = settled.filter(s => s.status === 'fulfilled').map(s => s.value);
  const rejects = settled.map((s,i) => [s, files[i]]).filter(([s]) => s.status === 'rejected');
  const bad = rejects.map(([,f]) => f.name);
  const kinds = new Set(rejects.map(([s]) => (s.reason && s.reason.kind) || 'net'));
  unreadable = bad.length;
  unreadableKind = kinds.size > 1 ? 'mixed' : [...kinds][0] || '';
  if (bad.length) console.warn(`Compass: skipped ${bad.length} record(s) [${[...kinds].join('+')}]:`,
    bad, rejects.map(([s]) => s.reason && s.reason.message));
  if (!ok.length) throw new Error('no readable records');   // truly nothing — let the caller fall back
  return ok;
}

async function fetchRecords(){
  if (STOCK_API){
    try {
      // ASK WHETHER IT CHANGED, don't demand it again.
      //
      // This used to append `?t=<now>` and pass `cache: 'no-store'` — a unique
      // URL every time, so nothing anywhere could answer from a cache. That was
      // aimed at a real failure: Cloudflare's edge once pinned a 500 from a
      // broken deploy so hard the fix looked like it hadn't worked. But the fix
      // for THAT now lives at the source — every error response carries
      // no-store (see `j()` in the worker), so a failure cannot be cached in the
      // first place, and the buster was left defeating the cache on the success
      // path too.
      //
      // The cost was quiet and grows with the shelf: a register polls once a
      // minute and got the entire catalogue back every time, ~290KB at 340
      // records, when stock moves a few times an HOUR. Four registers over a
      // twelve-hour day is about 0.8GB of shop wifi to re-send bytes that were
      // almost always identical.
      //
      // A plain fetch does the right thing by itself. The response carries an
      // ETag and max-age=30, so the browser revalidates on each 60s poll,
      // sends If-None-Match, and gets a bodiless 304 whenever nothing moved —
      // then hands this code the copy it already had. No 304 handling is needed
      // here: as far as this function is concerned it still just got the data.
      const res = await fetch(STOCK_API.replace(/\/+$/, '') + '/data');
      if (!res.ok) throw new Error('worker ' + res.status);
      // NO STALENESS LINE HERE, and the Worker's X-Compass-Stock-Checked-At
      // header is deliberately ignored. A footer note reading "Stock last
      // checked N minutes ago" was tried on 28 Aug and removed the same day: the
      // value came from the last response THIS TAB received, so a page left open
      // and unfocused stopped refetching and the number climbed while the shop's
      // stock was in fact current. On a counter iPad open all afternoon it sat
      // in warning red permanently — an alarm that fires on idle tabs, not on
      // stale stock. If this is ever wanted again it has to measure the
      // Worker's own last success at render time, not this page's last fetch.
      const body = await res.json();
      if (Array.isArray(body) && body.length){
        // Two shapes, both live. Whole records is the fast path — one request
        // for the catalogue instead of one per record. The file index is what
        // an older Worker returns, and what the current one falls back to if
        // its bulk read fails, so a redeploy can happen in either order and a
        // GraphQL outage degrades to slow rather than to an empty shelf.
        if (body[0] && body[0].url && body[0].sha) return recordsFromIndex(body);
        // normTerps has to run on this path too. recordsFromIndex does it for
        // the other one, and skipping it here would undo TERP_ALIAS entirely:
        // Y-Terpinene would count separately from gamma-terpinene, and
        // Delta-Terpinene would double Terpinolene on every Alleaves panel that
        // prints both. `_key` arrives from the Worker, which is the only place
        // that knows the repo filename on this path.
        if (body[0] && body[0].strain){
          // The worker drops records it can't read and reports how many in
          // X-Compass-Skipped. Carry that into the footer, because on this path
          // the page never sees the individual records fail — recordsFromIndex,
          // which is where `unreadable` is otherwise set, isn't called at all.
          // Without this a record with a hand-edit typo simply vanishes from the
          // shelf with nothing said, which is the exact failure the unreadable
          // count exists to prevent.
          //
          // Always assigned, never conditionally: a poll that comes back clean
          // has to clear a count left over from the previous one.
          //
          // 'data' because on this path there is no per-record network failure to
          // confuse it with — the archive either arrives or the worker falls back
          // to the index. Skipped here always means the file itself is wrong.
          const dropped = Number(res.headers.get('X-Compass-Skipped')) || 0;
          unreadable = dropped;
          unreadableKind = dropped ? 'data' : '';
          return body.map(p => normTerps(p));
        }
      }
      throw new Error('unrecognised response');
    } catch(e){
      // Worker unreachable or mid-redeploy. Fall through to GitHub rather than
      // dropping everyone to the 9-record embedded seed.
    }
  }
  const idx = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/data`,
    {cache: 'no-store'}).then(r=>r.json());
  if (!Array.isArray(idx)) throw new Error('rate limited');   // caller keeps the seed
  // ?v=<sha> is load-bearing, not decoration: raw.githubusercontent serves
  // max-age=300, so without it a refresh reads a five-minute-old copy and
  // overwrites a stock change that was just made.
  return recordsFromIndex(idx.filter(f => f.name.endsWith('.json'))
    .map(f => ({name: f.name, sha: f.sha, url: f.download_url})));
}

(async function load(){
  DATA.forEach(normTerps);   // the embedded seed goes through the same normalisation
  if (GH_USER && GH_REPO){
    try { DATA = await fetchRecords(); }
    catch(err){ flash = 'Using built-in data — couldn\'t reach the repo.'; }
  }
  render();
  startAutoRefresh();
})();

// ── keep every screen current without anyone touching it
//
// A register sits on this page all shift. Without this it would show whatever
// was true when the page was opened — which would defeat the entire point of
// stock being shared. Refresh on a timer while visible, and immediately when
// someone comes back to the tab.
let refreshTimer = null;
async function refresh(){
  let fresh;
  try { fresh = await fetchRecords(); } catch(e){ return; }   // offline: keep what we have
  if (!fresh || !fresh.length) return;
  DATA = fresh;
  // Re-rendering under someone's fingers would wipe what they're typing, so
  // take the data now and let the next natural render show it.
  const el = document.activeElement;
  const typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
  if (!typing) render();
}
// Appears only once the page is genuinely long — three screens, past every
// short flow. Six results is 2.6 screens on a POS display, so the common case
// never sees it; browsing a category is 24, which is what it exists for.
//
// `hidden` is removed on first show rather than set at load, so a page that is
// never scrolled never puts the control in the accessibility tree at all.
(() => {
  const btn = document.getElementById('totop');
  if (!btn) return;
  const THRESHOLD = () => window.innerHeight * 3;
  let shown = false;
  const sync = () => {
    const want = window.scrollY > THRESHOLD();
    if (want === shown) return;
    shown = want;
    if (want) btn.hidden = false;
    btn.classList.toggle('show', want);
  };
  // passive: this fires on every scroll frame and must never block it.
  addEventListener('scroll', sync, {passive: true});
  addEventListener('resize', sync);
  btn.addEventListener('click', () => {
    // Matches openCompare, and honours the same reduced-motion preference the
    // stylesheet does — a long smooth scroll is exactly what that setting is for.
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({top: 0, behavior: reduce ? 'auto' : 'smooth'});
    // Send focus back to the controls, not just the pixels. A keyboard or
    // screen-reader user who taps this wants to be AT the top, not looking at it.
    const first = document.querySelector('.tabs button');
    if (first) first.focus({preventScroll: true});
  });
  sync();
})();

function startAutoRefresh(){
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => { if (!document.hidden) refresh(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
}
</script>
