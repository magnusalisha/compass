<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A22">
<title>Compass</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Compass">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B2A22; --card:#F1EBE0; --card2:#E7E0D2; --ink:#20261F; --ink2:#5C6558;
    --gold:#C4913B; --line:#D6CDBC; --pale:#C9D6C4; --dim:#7E9182; --warn:#8C3B22;
    --car:#B5462F; --lim:#D4802A; --myr:#6B8C3A; --apn:#3E7A5E; --bpn:#3E7A5E;
    --lin:#8B7BC7; --hum:#8B6A3E; --bis:#D4B483; --tpl:#2F8F7A; --oci:#94A83C;
    --ter:#5E9B8F; --far:#B08A4E; --etc:#9AA694;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--pale);font-family:Inter,system-ui,sans-serif;
       line-height:1.5;padding:22px 18px calc(48px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;
           text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
  h1{font-family:Fraunces,serif;font-size:52px;font-weight:700;color:#F3EFE4;
     letter-spacing:-.02em;line-height:1;margin:12px 0 10px}
  .sub{color:var(--dim);font-size:15px;max-width:34ch;margin-bottom:22px}

  .tabs{display:flex;gap:9px;margin-bottom:16px}
  .tabs button{flex:1;padding:12px 8px;border-radius:999px;border:1px solid var(--dim);
    background:transparent;color:var(--pale);font:600 14px Inter,sans-serif;cursor:pointer}
  /* On a narrow phone four across leaves ~77px each, so "Match by effect" wrapped
     to three lines and the 999px radius turned every tab into a circle. Two rows
     of two keeps each label on one line and the pill shape intact. */
  @media(max-width:440px){ .tabs{display:grid;grid-template-columns:1fr 1fr} }
  .tabs button[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#231A08}

  .stockrow{display:flex;align-items:center;gap:10px;margin-bottom:16px;color:var(--pale);font-size:14px}
  .stockrow input{width:20px;height:20px;accent-color:var(--gold)}

  input[type=text],select{width:100%;padding:15px 16px;border-radius:12px;border:none;
    background:var(--card);color:var(--ink);font:500 16px Inter,sans-serif;margin-bottom:11px}
  select{font-family:'IBM Plex Mono',monospace;font-size:15px;
    appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
    background-position:calc(100% - 20px) calc(50% - 2px),calc(100% - 15px) calc(50% - 2px);
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  input:focus,select:focus{outline:2px solid var(--gold);outline-offset:2px}
  .pair{display:flex;gap:9px}
  .pair select,.pair .combo{flex:1;min-width:0}
  /* Compare's two pickers carry a long label (strain · form · brand). Side by
     side on a 375px phone that leaves about 16 characters each, which cut off
     the form — the exact thing the label is there to show. Stack them on narrow
     screens so each gets the full width. The effect tab's type/size pair keeps
     its row: "Any type" and "Any size" fit fine. */
  @media(max-width:560px){ .pair-compare{display:block} }

  /* clear (×) button living inside the search field */
  .searchwrap{position:relative;margin-bottom:11px}
  .searchwrap input{margin-bottom:0;padding-right:46px}
  .clearbtn{position:absolute;right:7px;top:50%;transform:translateY(-50%);
    width:32px;height:32px;border:none;background:none;color:var(--ink2);
    font:400 21px/1 Inter,sans-serif;border-radius:50%;cursor:pointer;
    display:none;align-items:center;justify-content:center;padding:0}
  .clearbtn.show{display:flex}
  .clearbtn:hover{background:var(--card2);color:var(--ink)}

  .catseg{display:flex;gap:6px;margin-bottom:11px}
  .catseg button{flex:1;padding:9px 6px;border-radius:999px;border:1px solid var(--dim);
    background:transparent;color:var(--pale);font:600 12.5px Inter,sans-serif;cursor:pointer}
  .catseg button.active{background:var(--gold);border-color:var(--gold);color:#231A08}

  .combo{position:relative;margin-bottom:11px}
  .combo input{margin-bottom:0}
  .combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);
    border-radius:12px;max-height:240px;overflow-y:auto;z-index:20;list-style:none;
    box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .combo-list li{padding:12px 16px;font:500 15px Inter,sans-serif;color:var(--ink);cursor:pointer;
    display:flex;gap:8px;align-items:baseline}
  .combo-list li span{color:var(--ink2);font-size:13px}
  .combo-list li:hover,.combo-list li.hl{background:var(--card2)}
  .combo-list li.combo-empty{color:var(--ink2);cursor:default;font-size:13.5px}
  .combo-list li.combo-empty:hover{background:none}

  .card{background:var(--card);color:var(--ink);border-radius:16px;padding:18px;margin-bottom:12px}
  .card.card-faint{border:1px dashed var(--warn)}
  .card h2{font-family:Fraunces,serif;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
  .thc{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:19px;text-align:right;white-space:nowrap}
  .thc small{display:block;font-size:10px;color:var(--ink2);font-weight:400;letter-spacing:.08em}
  .top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;background:#DCE6D8;color:#3D5140;padding:4px 9px;border-radius:5px}
  .tag-shelf{background:#E0DAEF;color:#4B3E70}
  .tag-unset{background:transparent;border:1px dashed var(--line);color:var(--ink2)}

  .stack{display:flex;height:11px;border-radius:6px;overflow:hidden;margin:13px 0 11px;background:#E0D8C8}
  .stack i{height:100%}
  .chips{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink2)}
  /* the plain word riding along with each molecule — present but never louder
     than the measurement it explains */
  .chips em{font-style:normal;opacity:.62}
  .chips span{display:flex;align-items:center;gap:6px}
  .chips b{width:8px;height:8px;border-radius:50%;flex:none}

  /* mirrored comparison — read the difference, don't decode it */
  /* Number columns size to their content; the MIDDLE (bars + name) takes the
     rest. With 1fr on the outer columns instead, the middle collapsed to the
     name width and both bar tracks rendered at 0px — the mirrored comparison
     was invisible. auto/1fr/auto is what gives the bars room. */
  .cmp{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px 10px;margin-top:14px}
  .cmp .val{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink2)}
  .cmp .val.r{text-align:right}
  .cmp .nm{font-size:13.5px;text-align:center;white-space:nowrap;font-weight:500}
  .cmp .tr{height:11px;border-radius:4px;background:#E0D8C8;position:relative}
  .cmp .tr i{position:absolute;top:0;bottom:0;border-radius:4px}
  .cmp .tr.l i{right:0} .cmp .tr.r i{left:0}

  .read{margin-top:18px;padding-top:15px;border-top:1px dashed var(--line)}
  .read p{margin-bottom:10px;font-size:15px}
  .read p:last-child{margin-bottom:0}
  .read-faint{opacity:.88}
  .faint-flag{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--warn);margin-bottom:9px}
  .faint-explain{font-size:12.5px;color:var(--ink2);font-style:italic;margin-top:8px}
  .warnbox{background:#F6E3D3;border:1px solid #E0B99A;color:#7A3A1C;border-radius:10px;
    padding:12px 13px;margin-top:13px;font-size:13.5px;line-height:1.45}
  .ev{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);margin-top:7px;letter-spacing:.04em}
  .why{margin-top:9px;font-size:12.5px;color:var(--ink2)}
  .why summary{cursor:pointer;color:var(--ink2);font-family:'IBM Plex Mono',monospace;font-size:11px;
    text-transform:uppercase;letter-spacing:.06em;list-style:none}
  .why summary::-webkit-details-marker{display:none}
  .why summary::before{content:'▸ '}
  .why[open] summary::before{content:'▾ '}
  .why ul{margin-top:9px;padding-left:16px}
  .why li{margin-bottom:9px;line-height:1.45}
  .why li:last-child{margin-bottom:0}
  .why .ev{display:inline;margin:0 0 0 4px}
  .match{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#3D6B4F;margin-top:12px;font-weight:500}
  .acts{display:flex;gap:18px;margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}
  .acts button,.acts a{background:none;border:none;padding:0;color:var(--ink2);font:500 13.5px Inter,sans-serif;cursor:pointer;text-decoration:none}
  .acts button:hover,.acts a:hover{color:var(--ink);text-decoration:underline}
  .empty{color:var(--dim);text-align:center;padding:34px 14px;font-size:15px}
  .lookup-list{display:flex;flex-direction:column;gap:8px}
  /* effect search: "right terps, wrong size" pivots — dimmed but readable */
  .pivot-head{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--dim);margin:20px 2px 10px}
  .pivot{display:flex;justify-content:space-between;align-items:center;gap:14px;
    background:var(--card);color:var(--ink);border-radius:12px;padding:13px 18px;margin-bottom:8px;opacity:.62}
  /* A wrong-size match, dimmed but whole. opacity doesn't block pointer events,
     so every control inside stays clickable — that's the point. */
  .card-dim{opacity:.62}
  .card-dim:hover,.card-dim:focus-within{opacity:1}
  .pivot-strain{font-family:Fraunces,serif;font-weight:700;font-size:16px}
  .pivot-terps{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:'IBM Plex Mono',monospace;
    font-size:12px;color:var(--ink2);margin-top:5px}
  .pivot-terps span{display:flex;align-items:center;gap:5px}
  .pivot-terps b{width:7px;height:7px;border-radius:50%;flex:none}

  .lookup-left{display:flex;flex-direction:column;gap:3px;min-width:0}
  .lookup-form{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);letter-spacing:.03em}
  .lookup-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--card);color:var(--ink);border:none;border-radius:12px;padding:14px 16px;
    font:inherit;text-align:left;cursor:pointer;width:100%}
  .lookup-row:hover{background:var(--card2)}
  .lookup-strain{font-family:Fraunces,serif;font-weight:700;font-size:15.5px}
  .lookup-brand{color:var(--ink2);font-size:13px;white-space:nowrap;flex:none}
  .lookup-back{background:none;border:none;color:var(--pale);font:600 13.5px Inter,sans-serif;
    cursor:pointer;padding:0;margin-bottom:12px;display:block}
  .lookup-back:hover{color:#fff}
  .foot{margin-top:26px;color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.6}
  .flash{background:#33473A;border:1px solid #48604F;color:var(--pale);border-radius:10px;
    padding:11px 13px;margin-bottom:14px;font-size:13px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="eyebrow">🌿 Budtender's tool</div>
<h1>Compass</h1>
<div class="sub">Match what's on the shelf to what a customer's actually asking for — by terpene, not by strain name.</div>

<div class="tabs" role="tablist">
  <button role="tab" data-tab="effect" aria-selected="true">Match by effect</button>
  <button role="tab" data-tab="similar" aria-selected="false">Find similar</button>
  <button role="tab" data-tab="compare" aria-selected="false">Compare</button>
  <button role="tab" data-tab="lookup" aria-selected="false">Lookup</button>
</div>
<label class="stockrow"><input type="checkbox" id="oos"> Include out-of-stock items</label>
<div id="panel"></div>
<div id="out"></div>
<div class="foot" id="foot"></div>

<script>
// ── point at your repo once it exists
const GH_USER = "magnusalisha", GH_REPO = "compass";
// ── the Cloudflare Worker that writes stock changes back to the repo.
// Paste your Worker URL here after deploying it (see DEPLOY-WORKER.md).
// Left empty, the page still works — it just hides the sold-out buttons
// rather than offering a control that would silently do nothing.
const STOCK_API = "https://compass-stock.magnus-alisha.workers.dev";

const COLOR = {'beta-Caryophyllene':'--car','Limonene':'--lim','beta-Myrcene':'--myr',
  'alpha-Pinene':'--apn','beta-Pinene':'--bpn','Linalool':'--lin','alpha-Humulene':'--hum',
  'alpha-Bisabolol':'--bis','Terpinolene':'--tpl','Ocimene':'--oci','Terpineol':'--ter','Farnesene':'--far'};
// [phrase, evidence 1-3, what it rests on]
// 3 = a real receptor mechanism. 2 = animal work + some human data. 1 = folklore,
// rodent studies at doses you'll never inhale, or aromatherapy. Most of this is a 1.
const REPORTED = {
  'beta-Caryophyllene':['body calm, eases tension',3,'Selective CB2 agonist (Gertsch 2008) — the only terpene with a real receptor mechanism. Human trials still thin.'],
  'Limonene':['lifts mood, brightens',2,'Some small human inhalation studies on mood/anxiety. No cannabinoid-receptor mechanism.'],
  'Linalool':['mellow, softens the edges',2,'Sedative in rodent models and aromatherapy work. Not shown at inhaled cannabis doses.'],
  'beta-Myrcene':['heavy, sedating, couch-leaning',1,'The couch-lock claim traces to rodent studies at doses far above anything you inhale. Popular, poorly evidenced.'],
  'Terpinolene':['heady, alert, buzzy',1,'Essentially strain-database folklore. No mechanism identified.'],
  'alpha-Pinene':['clear-headed, focused',1,'Rests on in-vitro enzyme inhibition. No human data at these doses.'],
  'beta-Pinene':['clear-headed',1,'As above.'],
  'Ocimene':['light, lively',1,'Folklore.'],
  'alpha-Humulene':['grounded, low-key',1,'Folklore. Shares a pathway with caryophyllene but no CB2 activity.'],
  'alpha-Bisabolol':['gentle, easy',1,'Folklore.'],
  'Farnesene':['settled',1,'Folklore.'],
  'Terpineol':['mellow',1,'Folklore.']
};
const dots = n => '●'.repeat(n) + '○'.repeat(3-n);

// ── category: derived from `form`, first rule wins. Add a rule to grow further.
// Vape is checked before Preroll: a disposable never says "preroll", but an
// "Infused Preroll" must not be caught by a loose vape term.
// Word boundaries matter — bare /cart/ would match "carton" and /pod/ "tripod".
// The preroll pattern accepts Preroll, Pre-roll, Pre-Roll and Pre Roll: real
// COAs use all four, and /preroll/i alone was silently filing the hyphenated
// ones under Flower.
const CATEGORY_RULES = [
  [/\b(vapes?|carts?|cartridges?|disposables?|pods?)\b/i, 'Vape'],
  [/pre[\s-]?rolls?/i, 'Preroll'],
];
const category = p => (CATEGORY_RULES.find(([re]) => re.test(p.form)) || [,'Flower'])[1];
const CATEGORIES = ['All', 'Flower', 'Preroll', 'Vape'];
// not a UI filter category (yet) — just enough to pick honest fallback copy below
const isEdible = p => /gummy|edible|chocolate|beverage|tincture|capsule/i.test(p.form);

// A customer's "sativa / indica / hybrid" is a request in the vocabulary the
// package is written in, so it's answered from the package — see filterLean()
// below for the measurements behind that, which reversed an earlier decision to
// answer it from chemistry instead. The card still shows the ⚠ clash where the
// terps disagree; the budtender sees it and can say so.
const LEAN_OF = { Sativa: 'lifting', Indica: 'settling', Hybrid: 'mixed' };

// ── weight / package details, parsed out of `form`.
// weightText: "3.5g", "1g ×4" (multipack), "" when the form has no weight.
// The forms are messy ("0.5g (5pk)", "4-pack", "3ct", "Pre-Roll") so parse
// defensively rather than trust a fixed layout.
// A pack's gram figure is ambiguous: some labels state the PER-UNIT weight
// ("1g 4-pack" = four 1g joints), others the TOTAL ("3.5g 7-pack" = seven 0.5g
// joints, 3.5g total). Nothing in the string says which, and a COA reports net
// weight, not per-unit. So infer: a real preroll is a standard size; if the
// stated grams is implausible as one joint but divides evenly into a standard
// size, it's the total. Genuinely ambiguous cases (e.g. 1.5g 2-pack) default to
// per-unit and show the total too, so a human can sanity-check via Edit.
const STD_UNIT = [0.35, 0.5, 0.7, 0.75, 1, 1.5];
const nearStd = g => STD_UNIT.some(s => Math.abs(s - g) < 0.01);
const gstr = g => (+g.toFixed(2)) + 'g';
const parseSize = p => {
  const w = (p.form||'').match(/(\d+(?:\.\d+)?)\s*g\b/i);
  const pk = (p.form||'').match(/(\d+)\s*-?\s*(?:pk|ct|pack|cpk)/i);
  if (!w) return null;
  const g = parseFloat(w[1]);
  if (!pk) return { per:g, count:1, total:g };
  const n = parseInt(pk[1], 10), perIfTotal = g / n;
  const statedIsTotal = category(p) === 'Preroll' && nearStd(perIfTotal) && !nearStd(g);
  return statedIsTotal ? { per:perIfTotal, count:n, total:g } : { per:g, count:n, total:g*n };
};
const weightText = p => { const s = parseSize(p); if (!s) return '';
  return s.count > 1 ? `${gstr(s.per)} ×${s.count} · ${gstr(s.total)} total` : gstr(s.per); };
// per-unit weight for grouping in the size dropdown — the TRUE per-joint size
const weightOnly = p => { const s = parseSize(p); return s ? gstr(s.per) : ''; };
// vape sub-type — the package distinction a budtender needs
const vapeType = p => /cart/i.test(p.form) ? 'Cart' : /dispos/i.test(p.form) ? 'Disposable' : '';
// Infused means concentrate was added, and it moves the number a lot: infused
// prerolls here average 39.7% THC against 27.6% for plain ones. The word sits in
// a different place in every form string ("Infused Preroll 0.5g", "Preroll 0.6g
// Infused", "Preroll 0.5g (5pk, Live Resin Infused)"), so just look for it.
// Not applied to vapes — those are concentrate by definition.
const isInfused = p => /infus/i.test(p.form || '');
// the label shown in the form chip: "Flower · 3.5g", "Vape · Cart · 1g",
// "Preroll · Infused · 1g"
const formLabel = p => {
  const c = category(p), s = weightText(p);
  if (c === 'Vape') return ['Vape', vapeType(p), s].filter(Boolean).join(' · ');
  return [c, isInfused(p) ? 'Infused' : '', s].filter(Boolean).join(' · ');
};

// ── shelf_tag: what the PACKAGE claims. Never inferred from chemistry — a
// guessed tag would make the label-vs-chemistry comparison measure the guess
// (CLAUDE_CODE_BRIEF.md). Anything unrecognised — a typo, a stray space, a
// missing field — normalises to Unverified, which is excluded from the
// comparison. Failing closed is the point: a mistyped tag must never be
// mistaken for a real one a human stood in front of the package and set.
// The page does NOT own this vocabulary — compass-manage.js does, and the page
// never writes the field. So display whatever string the record holds instead
// of validating against a list here: a value added at the editing end (like
// "Sativa-leaning Hybrid", which some NY brands print) renders with no change
// to this file. Only blank/missing/"Unverified" count as unset.
const shelfTag = p => {
  const v = String(p.shelf_tag || '').trim();
  return (!v || v.toLowerCase() === 'unverified') ? 'Unverified' : v;
};
// The direction each label CLAIMS — used only to decide whether the package
// and the chemistry contradict each other. A plain "Hybrid" asserts no
// direction, and an unrecognised value has no known one, so neither can clash;
// both still display, they just don't get a verdict. Keys are lowercased for
// matching, so capitalisation drift in a hand-edited record still resolves.
const SHELF_EXPECTS = {
  'sativa': 'lifting',
  'sativa-leaning hybrid': 'lifting',
  'indica-leaning hybrid': 'settling',
  'indica': 'settling'
};

// ── The shelf-vs-chemistry verdict line and its ⚠ clash warning were REMOVED
// on 2026-07-30, along with labelCheck(). Recorded here because it was the
// tool's signature feature and removing it deserves a reason on the record.
//
// It claimed the terpenes contradicted the package. Two findings killed it:
//
// 1. Nothing supports the claim. Tested across every non-faint sativa/indica
//    record (n=48/31), no terpene in CHAR separates the two groups at any
//    corrected significance level; myrcene is a coin flip and limonene runs
//    backwards. Learn the directions on half the records, predict the other
//    half: 45.7% accurate against 60.8% for always guessing "sativa". That is
//    the same result the published chemovar work reports — terpene profiles
//    cluster reliably, but not along the sativa/indica axis. It is also exactly
//    why filterLean() below stopped filtering on chemistry. The warning was
//    asserting in prose the claim the dropdown had just abandoned.
//
// 2. Repairing it made it worse. Pointing the line at the measured chemistry
//    (rather than the stored `lean`) fixes the contradiction by construction —
//    36 of 135 cards disagreed with the read printed directly above them — but
//    it would then flag 29 of 48 sativa-labelled products against 7 of 31
//    indica. Caryophyllene and myrcene dominate nearly every profile and both
//    point "settle", so sativa labels absorb almost every hit. That is the
//    structural bias, not a shelf full of mislabelled jars.
//
// The package claim still shows — it's a chip at the top of every card — and
// the read below it is plain English. The tension is visible where it exists;
// Compass just no longer adjudicates it on evidence it doesn't have. A real
// mislabel check needs something outside the terpenes to check against.
//
// `p.lean` now has NO reader anywhere in this page. The capture script still
// writes it; nothing here consults it.
// one tap from the card to this record's file in GitHub's editor. No token: the
// page stays public and read-only, GitHub does the auth. Only for records that
// came from the repo (_key) — the embedded seed has no file to point at.

  for (const [k, d] of gaps){
    const [hi, lo] = d > 0 ? [x,y] : [y,x];
    h += `<p><b>${nm(hi)}</b> carries more ${termName(k, gapKeys).toLowerCase()} (${hi.terpenes[k]||0}% vs ${lo.terpenes[k]||0}%) — ${REPORTED[k]?REPORTED[k][0]:'a character difference'} <span class="ev">${REPORTED[k]?dots(REPORTED[k][1]):''}</span></p>`;
  }
  if (!gaps.length) h += `<p>The profiles are close enough that I'd sell on smell or price.</p>`;
  if (x.thc != null && y.thc != null && Math.abs(x.thc - y.thc) >= 3){
    const [hi, lo] = x.thc >= y.thc ? [x,y] : [y,x];
    h += `<p><b>${nm(hi)}</b> is meaningfully stronger (${thc1(hi.thc)} THC vs ${thc1(lo.thc)}) — that'll drive the experience more than any terpene here.</p>`;
  }
  return h;
}

// Find Similar's result line. A bare "89% similarity" is a decode-it number,
// against the whole point of this tool. So say WHAT makes them close, and — per
// the brief, THC drives the experience more than any terpene — how the strength
// compares to what the customer actually had. `src` is the product they asked
// about; `x` is the in-stock suggestion.
function matchNote(src, x, s){
  let why = '';
  // a faint source has unreliable dominants, so don't assert a shared lead off it
  if (src.confidence !== 'faint' && domTerps(src).length){
    if (domTerps(src)[0] === domTerps(x)[0]) why = `both lead with ${short(domTerps(x)[0]).toLowerCase()}`;
    else {
      const shared = domTerps(x).slice(0,3).find(k => domTerps(src).slice(0,3).includes(k));
      if (shared) why = `both carry ${short(shared).toLowerCase()}`;
    }
  }
  // THC can be missing on either side — don't invent a comparison from a null
  const d = (x.thc != null && src.thc != null) ? x.thc - src.thc : null;
  const thc = d == null
    ? (x.thc == null ? 'THC not recorded' : `${thc1(x.thc)} THC`)
    : Math.abs(d) >= 3
      ? `${d > 0 ? 'stronger' : 'lighter'} — ${thc1(x.thc)} THC vs the ${thc1(src.thc)} you had`
      : `${thc1(x.thc)} THC, about the same strength`;
  return `<div class="match">${Math.round(s*100)}% match${why ? ' · ' + why : ''}<br>${thc}</div>`;
}

// What the package claims, sized for the Compare header. It used to carry the
// ⚠ clash too — the single-card verdict brought into the two-up view — and went
// when that did (see the note where labelCheck used to live). The tag still
// shows: Compare is exactly where someone is weighing "the sativa vs the
// indica", so the package's own word belongs here. Compass just doesn't argue
// with it any more.
function cmpShelf(p, align){
  const tag = shelfTag(p);
  if (tag === 'Unverified') return '';
  return `<div style="font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:5px;text-align:${align};color:var(--ink2)">shelf: ${tag}</div>`;
}
function compare(x, y){
  const keys = [...new Set([...Object.keys(x.terpenes), ...Object.keys(y.terpenes)])]
    .filter(k => (x.terpenes[k]||0) > 0 || (y.terpenes[k]||0) > 0)
    .sort((p,q) => ((y.terpenes[q]||0)+(x.terpenes[q]||0)) - ((y.terpenes[p]||0)+(x.terpenes[p]||0)));
  const max = Math.max(...keys.map(k => Math.max(x.terpenes[k]||0, y.terpenes[k]||0)), 0.01);
  return `<div class="card">
    <div class="top">
      <div><h2>${nameVs(x,y)}</h2><div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink2);margin-top:4px">${formLabel(x)}<br>THC ${thcText(x)} · terps ${x.total_terpenes}%</div>${cmpShelf(x,'left')}</div>
      <div style="text-align:right"><h2>${nameVs(y,x)}</h2><div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink2);margin-top:4px">${formLabel(y)}<br>THC ${thcText(y)} · terps ${y.total_terpenes}%</div>${cmpShelf(y,'right')}</div>
    </div>
    <div class="read" style="margin-top:15px"><div class="eyebrow" style="color:var(--ink2);margin-bottom:10px">The read</div>${read(x,y)}</div>
    <div class="read"><div class="eyebrow" style="color:var(--ink2);margin-bottom:12px">Terpenes</div>
    <div class="cmp" style="margin-top:0">
      ${keys.map(k => {
        const p = x.terpenes[k]||0, q = y.terpenes[k]||0;
        return `<div class="val r">${p||'—'}</div>
          <div style="display:grid;grid-template-columns:1fr 108px 1fr;align-items:center;gap:9px;grid-column:2;width:100%">
            <div class="tr l"><i style="width:${p/max*100}%;background:${col(k)};opacity:${p>=q?1:.42}"></i></div>
            <div class="nm">${termName(k, keys)}</div>
            <div class="tr r"><i style="width:${q/max*100}%;background:${col(k)};opacity:${q>=p?1:.42}"></i></div>
          </div>
          <div class="val">${q||'—'}</div>`;
      }).join('')}
    </div></div>
  </div>`;
}

function categoryButtons(catKey, current){
  return `<div class="catseg" data-catkey="${catKey}">${CATEGORIES.map(c =>
    `<button type="button" class="${c===current?'active':''}" data-cat="${c}">${c}</button>`).join('')}</div>`;
}

// ── reusable searchable combobox: filters a product list by strain or brand.
// One instance per `id` (e.g. 'a', 'b', 'similar'); state persists across re-renders.
//
// The <input> node is mounted ONCE by comboShellHTML (called only from the full
// render(), on tab switch / selection / category change — never on keystroke).
// Typing only replaces the .combo-list-holder's contents via updateComboList().
// Destroying and recreating a focused input on every keystroke is exactly the
// bug reported in round 3 (search "can't be typed into") — never do that again.
let COMBO = {};
const comboState = id => COMBO[id] || (COMBO[id] = {query: null, open: false, highlight: -1, filtered: []});
// Compact form for the pickers: "Flower 3.5g", "Preroll 1g×4", "Vape Cart 1g".
//
// The CATEGORY is what these labels used to be missing, and it's the difference
// between two genuinely different products. Acapulco Gold at 1g exists three
// times in this catalogue — a vape cart (83% THC), an infused preroll (44%) and
// a preroll (30%) — and the picker rendered all three as "Acapulco Gold
// (Brand) · 1g". 17 strains here are carried by more than one brand, and one
// pair (Pineapple Express 1g) is a vape versus flower. The only reason that was
// ever workable is that the person using it already knew the shelf by heart.
const comboForm = p => {
  const s = parseSize(p);
  const w = s ? (s.count > 1 ? `${gstr(s.per)}×${s.count}` : gstr(s.per)) : '';
  const c = category(p);
  return (c === 'Vape' ? ['Vape', vapeType(p), w]
                       : [isInfused(p) ? 'Infused' : '', c, w]).filter(Boolean).join(' ');
};
// Ordered by what disambiguates fastest — strain, then form+weight, then brand.
// The Compare tab puts two of these side by side, so on a phone the text WILL
// truncate; this order means what gets cut is the brand, which is also printed
// on the card, rather than the form, which isn't anywhere else in the picker.
const comboLabel = p => p ? `${p.strain} · ${comboForm(p)} · ${p.brand}` : '';
const comboSelectedId = id => id === 'similar' ? sel : id === 'a' ? a : b;
const comboSelectedProduct = id => DATA.find(p => key(p) === comboSelectedId(id));

function comboListHTML(id, list){
  const st = comboState(id);
  if (!st.open) return '';
  const q = (st.query || '').toLowerCase().trim();
  // plain case-insensitive substring match on strain + brand — no fuzzy scoring,
  // no fallback to a stale/previous result. Zero matches means "no matches," full stop.
  const filtered = list.filter(p => (p.strain + ' ' + p.brand).toLowerCase().includes(q));
  st.filtered = filtered;
  if (!filtered.length) return `<ul class="combo-list"><li class="combo-empty">No matches found</li></ul>`;
  return `<ul class="combo-list">${filtered.map((p,i) => `<li data-id="${key(p)}" class="${i===st.highlight?'hl':''}">${p.strain} <span>${comboForm(p)} · ${p.brand}${stocked(p)?'':' · sold out'}</span></li>`).join('')}</ul>`;
}
function comboShellHTML(id, list, selectedId){
  const st = comboState(id);
  // Fall back to the whole archive for the label so a pre-filled selection that
  // isn't in the (in-stock) list — e.g. a sold-out source carried in from Find
  // similar's Compare ↔ — still shows its name instead of an empty box.
  const selected = list.find(p => key(p) === selectedId) || DATA.find(p => key(p) === selectedId);
  const shown = st.query !== null ? st.query : comboLabel(selected);
  return `<div class="combo" data-combo="${id}">
    <input type="text" class="combo-input" id="combo-${id}" autocomplete="off"
      placeholder="Search strain or brand…" value="${shown.replace(/"/g,'&quot;')}">
    <div class="combo-list-holder">${comboListHTML(id, list)}</div>
  </div>`;
}
// Find Similar's source picker searches the WHOLE archive, sold-out included —
// "I loved X, you're out of it, what's close?" is the question it exists to
// answer, so the discontinued product has to be selectable. Compare's two
// pickers stay on the in-stock pool. (Recommendations are filtered separately;
// only in-stock items are ever suggested.)
const comboSource = id => id === 'similar'
  ? DATA.slice().sort((x, y) => x.strain.localeCompare(y.strain, undefined, {sensitivity: 'base'}))
  : pool();
function updateComboList(id){
  const holder = document.querySelector(`[data-combo="${id}"] .combo-list-holder`);
  if (holder) holder.innerHTML = comboListHTML(id, comboSource(id));
}
function comboChoose(id, productId){
  const st = comboState(id);
  st.query = null; st.open = false; st.highlight = -1;
  if (id === 'similar') sel = productId;
  else if (id === 'a') a = productId;
  else if (id === 'b') b = productId;
  render();   // a real selection, not a keystroke — safe to fully rebuild
}

// Find similar → Compare, in one tap. Pre-fills the pair you were already
// looking at (source on the left, the result you tapped on the right) so the
// full side-by-side is one click away instead of two hand-picks. Clearing any
// typed combo text means the pickers show the new selection, not stale input.
function openCompare(leftKey, rightKey){
  tab = 'compare'; a = leftKey; b = rightKey;
  if (COMBO.a) COMBO.a.query = null;
  if (COMBO.b) COMBO.b.query = null;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render(){
  const P = $('#panel'), O = $('#out');
  document.querySelectorAll('.tabs button').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === tab));
  // The out-of-stock toggle only belongs where you're browsing the whole
  // archive (Compare, Lookup). Match by effect and Find similar both answer
  // "what can I hand this customer?" — a sold-out item is never an answer there,
  // so those tabs are in-stock-only and hide the toggle rather than show a
  // control that does nothing.
  const stockRow = document.querySelector('.stockrow');
  if (stockRow) stockRow.style.display = (tab === 'similar' || tab === 'effect') ? 'none' : '';
  const list = pool();
  const banner = flash ? `<div class="flash">${flash}</div>` : '';

  if (tab === 'effect'){
    // mount the shell ONCE per render(); typing updates results only, via
    // renderEffectResults() — never touches this <input> node (see combo comment above)
    // sizes available in the current category, for the dropdown
    const sizeOpts = [...new Set(inStock()
      .filter(p => effCat === 'All' || category(p) === effCat)
      .map(weightOnly).filter(Boolean))].sort((a,b) => parseFloat(a) - parseFloat(b));
    if (effSize !== 'any' && !sizeOpts.includes(effSize)) effSize = 'any';   // category changed out from under it
    // Funnel order, top to bottom: category → type → size → effect. The effect
    // box is the last, finest filter ("flower › indica › 3.5g › heavy"), so it
    // sits at the bottom, below the two dropdowns.
    P.innerHTML = banner + categoryButtons('effCat', effCat)
      + `<div class="pair">
           <select id="effLean" aria-label="Sativa / Indica / Hybrid">
             <option value="any"${effLean==='any'?' selected':''}>Any type</option>
             <option value="Sativa"${effLean==='Sativa'?' selected':''}>Sativa</option>
             <option value="Indica"${effLean==='Indica'?' selected':''}>Indica</option>
             <option value="Hybrid"${effLean==='Hybrid'?' selected':''}>Hybrid</option>
           </select>
           <select id="effSize" aria-label="Size">
             <option value="any"${effSize==='any'?' selected':''}>Any size</option>
             ${sizeOpts.map(s => `<option value="${s}"${effSize===s?' selected':''}>${s}</option>`).join('')}
           </select>
         </div>
         <div class="searchwrap">
           <input type="text" id="q" placeholder='e.g. "relaxing but not sleepy" or "for a concert"' value="${window._q||''}">
           <button type="button" class="clearbtn${(window._q||'') ? ' show' : ''}" data-clear="q" aria-label="Clear search">&times;</button>
         </div>`;
    return renderEffectResults();
  }

  if (tab === 'similar'){
    // source: anything in the archive, including sold-out. candidates: in stock only.
    const sources = comboSource('similar');
    sel = sel && DATA.some(p=>key(p)===sel) ? sel : key(sources[0]||{});
    P.innerHTML = banner + comboShellHTML('similar', sources, sel) + categoryButtons('simCat', simCat);
    const p = DATA.find(x => key(x) === sel);
    if (!p){ O.innerHTML = `<div class="empty">No records yet.</div>`; return foot(); }
    // Similarity is a comparison of two terpene profiles. With no profile on the
    // source there is nothing to compare, and every score comes back 0 — which
    // would render as a confident-looking "nothing is close to this." Say the
    // true reason instead.
    if (!hasProfile(p)){
      O.innerHTML = `<div class="card"><div class="warnbox" style="margin:0">
        <b>${p.strain}</b> has no terpene profile on file — the lab reported cannabinoids only.
        There's nothing to match against, so Compass can't suggest a substitute for it.
        Match by the package, the brand, or ask what they liked about it.</div></div>`;
      return foot();
    }

    // Results are ALWAYS in-stock only — the whole question is "what can I hand
    // this customer instead," and a sold-out match can't be handed to anyone.
    // (The source above is the opposite: sold-out included, because the thing
    // they loved being gone is exactly why you're here.) The global "include
    // out-of-stock" toggle is hidden on this tab for the same reason.
    // The category filter narrows the results only — the source is unaffected.
    // hasProfile: a record with no terpene data scores 0 against everything, so
    // it would sit at the bottom of the list as a meaningless "0% match" — it
    // isn't a candidate for a chemistry match at all.
    const candidates = DATA.filter(x => key(x) !== key(p) && stocked(x) && hasProfile(x)
      && (simCat === 'All' || category(x) === simCat));
    if (!candidates.length){
      O.innerHTML = `<div class="empty">No ${simCat === 'All' ? '' : simCat.toLowerCase()+' '}records scanned to compare against.</div>`;
      return foot();
    }
    const ranked = candidates.map(x => [sim(p,x), x]).sort((m,n) => n[0]-m[0]);
    // A faint source has lost its volatile terpenes, so "similar" mostly means
    // "also heavy-terpene-dominant" — which is what everything degrades toward.
    // The tool penalises faint everywhere else; Find Similar shouldn't present a
    // confident 96% off an unreliable source without saying so. ~a third of the
    // catalogue is faint, so this fires often.
    const faintSrcNote = p.confidence === 'faint'
      ? `<div class="warnbox" style="margin:0 0 12px">⚠ <b>${p.strain}</b>'s own profile is faint, so these matches are approximate — they mostly share the heavy terpenes that survive in everything. Lean on the package and your nose here.</div>`
      : '';
    // Same weight first. A 3.5g and a 28g of one strain test differently, and a
    // customer holding an eighth doesn't want an ounce in the list — so matches
    // in the source's own size lead, and strong matches in other sizes drop into
    // the pivot section below (never mixed in). If the source has no parseable
    // weight (vape carts etc.), or nothing else in its size was scanned, fall
    // back to ranking every size — better than an empty screen.
    const srcW = weightOnly(p);
    const same  = srcW ? ranked.filter(([,x]) => weightOnly(x) === srcW) : ranked;
    const other = srcW ? ranked.filter(([,x]) => weightOnly(x) !== srcW) : [];
    const primary = same.length ? same : ranked;
    O.innerHTML = faintSrcNote + (ranked[0][0] < 0.5
        ? `<div class="card"><div class="warnbox" style="margin:0">Nothing <b>scanned</b> is close to <b>${p.strain}</b> — its profile is ${domTerps(p).slice(0,2).map(k=>short(k).toLowerCase()).join('/')}-led and nothing else in here looks like that. <b>Say so. Don't substitute.</b> Worth a look at the shelf too, in case something isn't scanned yet.</div></div>`
        : '')
      + primary.slice(0,4).map(([s,x]) => card(x, matchNote(p, x, s), key(p))).join('')
      // Other sizes get the SAME full card, just dimmed — a compact teaser you
      // can't act on is the wrong shape here. The dimming still says "this isn't
      // the size you asked for", but the read, the terpenes and Compare ↔ are
      // all there, so pivoting is a decision you can actually make rather than
      // a name you then have to go look up.
      + (same.length && other.length && other[0][0] >= 0.5
          ? `<div class="pivot-head">Closest in other sizes — worth a pivot</div>`
            + other.slice(0,4).map(([s,x]) =>
                `<div class="card-dim">${card(x, matchNote(p, x, s), key(p))}</div>`).join('')
          : '');
    return foot();
  }

  if (tab === 'lookup'){
    P.innerHTML = banner + `<div class="searchwrap">
        <input type="text" id="lookupQ" placeholder="Type a strain or brand…" value="${lookupQ.replace(/"/g,'&quot;')}">
        <button type="button" class="clearbtn${lookupQ ? ' show' : ''}" data-clear="lookupQ" aria-label="Clear search">&times;</button>
      </div>`;
    return renderLookupResults();
  }

  // compare
  // Validate a selection against the WHOLE archive, not the in-stock pool: the
  // compare view renders sold-out products fine (DATA.find below), and a source
  // handed in from Find similar's Compare ↔ is often exactly a sold-out item —
  // guarding on the pool would silently swap it for a random in-stock strain.
  // The picker DROPDOWNS still list only in-stock (comboSource uses pool); this
  // only stops a valid pre-set selection from being reset out from under us.
  a = a && DATA.some(p=>key(p)===a) ? a : key(list[0]||{});
  b = b && DATA.some(p=>key(p)===b) ? b : key(list[1]||{});
  P.innerHTML = banner + `<div class="pair pair-compare">${comboShellHTML('a', list, a)}${comboShellHTML('b', list, b)}</div>`;
  const x = DATA.find(p => key(p) === a), y = DATA.find(p => key(p) === b);
  O.innerHTML = (x && y && x !== y) ? compare(x, y) : `<div class="empty">Pick two different products.</div>`;
  foot();
}

// ── effect-tab results only: called on every keystroke AND on full render().
// Must never touch #q or the category buttons' DOM nodes wholesale — only
// toggle their .active class and rewrite #out. (Root cause of round-3 bugs
// #1/#2/#3: rebuilding an input on every keystroke kills focus mid-type.)
function renderEffectResults(){
  const O = $('#out');
  const rawQ = (window._q||'').toLowerCase().trim();
  const detected = detectCategoryWord(rawQ);
  const activeCat = effCat !== 'All' ? effCat : (detected || 'All');   // explicit button wins; text is a bonus

  document.querySelectorAll('[data-catkey="effCat"] button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.cat === activeCat);
  });

  if (NEVER_DRIVE.test(rawQ)){
    O.innerHTML = `<div class="card"><div class="warnbox" style="margin:0">Not something I'll match on. Nothing on the shelf makes anyone okay to drive — that's true whatever the terpenes say, and a "clear-headed" profile doesn't change it.</div></div>`;
    return foot();
  }
  const med = MEDICAL.find(re => re.test(rawQ));
  if (med){
    O.innerHTML = `<div class="card"><div class="warnbox" style="margin:0">I can't match on medical conditions — that's not a claim this tool is allowed to make, or one the science supports. Try describing the <b>feeling</b> instead: "relaxed but clear-headed", "energetic", "mellow".</div></div>`;
    return foot();
  }

  const list = inStock();   // effect recommends what to sell — in-stock only, and the OOS toggle is hidden here
  const scoped = list.filter(p => (activeCat === 'All' || category(p) === activeCat)
    && (effLean === 'any' || filterLean(p) === LEAN_OF[effLean]));   // chemistry where it's readable, the package where it isn't
  if (!rawQ){
    // Nothing typed AND nothing narrowed: say what the box is for instead of
    // dumping the whole case. 149 cards is a scroll, not an answer, and it
    // contradicts the funnel the panel sets up (category > type > size >
    // effect). The moment any filter is touched, browsing IS the intent — so
    // the cards come back. This is also the only place with room to mention
    // that activities work, which nothing else on screen says.
    if (activeCat === 'All' && effLean === 'any' && effSize === 'any'){
      O.innerHTML = `<div class="empty">
        <b style="color:var(--pale)">What are they after?</b><br>
        Describe the feeling — <i>relaxed but clear-headed</i>, <i>energetic</i>, <i>mellow</i> —
        or just say what they're off to do: <i>a concert</i>, <i>cleaning</i>, <i>a movie</i>.<br><br>
        Or pick a category above to browse the case.</div>`;
      return foot();
    }
    // browsing: the size dropdown just narrows, like the category buttons
    const shown = effSize === 'any' ? scoped : scoped.filter(p => weightOnly(p) === effSize);
    O.innerHTML = shown.length ? shown.map(p => card(p)).join('')
      : `<div class="empty">No ${effSize === 'any' ? (activeCat === 'All' ? '' : activeCat.toLowerCase()+' ') : effSize+' '}records scanned yet.</div>`;
    return foot();
  }

  // strip a recognized category word so it doesn't get parsed as an effect keyword
  const qClean = detected ? rawQ.replace(CATEGORY_WORDS.find(([re]) => re.test(rawQ))[0], ' ').replace(/\s+/g,' ').trim() : rawQ;

  const [pos, neg] = [[], []];
  qClean.split(/\bbut\b|,|\band\b/).forEach(part => {
    const negated = /\bnot\b|\bwithout\b|\bno\b/.test(part);
    Object.entries(WANT).forEach(([kw, spec]) => {
      if (!part.includes(kw)) return;
      // a plain array is all "want"; the object form adds terpenes to steer AWAY
      // from (see the activity words). "not for cleaning" flips both lists.
      const want  = Array.isArray(spec) ? spec : (spec.want  || []);
      const avoid = Array.isArray(spec) ? []   : (spec.avoid || []);
      want.forEach(t => (negated ? neg : pos).push(t));
      avoid.forEach(t => (negated ? pos : neg).push(t));
    });
  });
  if (!pos.length && !neg.length){ O.innerHTML = `<div class="empty">Nothing matched “${rawQ}”. Try a feeling — relaxed, energetic, focused, mellow, sleepy, social — or what they're off to do: a concert, cleaning, errands, a movie.</div>`; return foot(); }

  const scored = scoped.map(p => {
    const v = vec(p);
    let s = pos.reduce((t,k) => t + (v[k]||0), 0) - neg.reduce((t,k) => t + (v[k]||0)*1.4, 0);
    if (p.confidence === 'faint') s *= 0.45;   // faded profiles don't get to win
    return [s, p];
  }).filter(([s]) => s > 0.02).sort((m,n) => n[0]-m[0]);

  const noFit = `<div class="empty">Nothing scanned fits that. Saying so is better than a bad substitution — but check the shelf for anything not scanned yet.</div>`;
  if (!scored.length){ O.innerHTML = noFit; return foot(); }

  if (effSize === 'any'){
    O.innerHTML = scored.slice(0,6).map(([,p]) => card(p)).join('');
    return foot();
  }
  // a size is chosen: the desired size ranks full; strong matches in other
  // sizes drop below, dimmed but readable — you might still pivot to one.
  const inSize = scored.filter(([,p]) => weightOnly(p) === effSize);
  const other  = scored.filter(([,p]) => weightOnly(p) !== effSize);
  O.innerHTML =
    (inSize.length
      ? inSize.slice(0,6).map(([,p]) => card(p)).join('')
      : `<div class="empty">Nothing in ${effSize} fits that${other.length ? ' — but these other sizes are close' : '.'}.</div>`)
    + (other.length
      ? `<div class="pivot-head">Great match, other sizes — worth a pivot</div>`
        + other.slice(0,4).map(([,p]) => pivotRow(p)).join('')
      : '');
  return foot();
}
// a strong effect match that's the wrong size — kept readable but subordinate:
// strain, its three dominant terpenes, and the size, so a pivot is one glance away.
function pivotRow(p){
  const chips = domTerps(p).slice(0,3)
    .map(k => `<span><b style="background:${col(k)}"></b>${short(k).toLowerCase()}</span>`).join('');
  return `<div class="pivot">
    <div><div class="pivot-strain">${p.strain}</div><div class="pivot-terps">${chips}</div></div>
    <span class="tag" style="flex:none">${formLabel(p)}</span>
  </div>`;
}

// ── lookup: type → matching list → tap one → full card (reuses card()).
// Search covers whatever the in-stock toggle currently scopes to, same as
// every other tab. Typing (see the #lookupQ input handler) clears lookupSel
// so a fresh keystroke means "search again" — this function must NOT clear it
// itself, since it also runs right after a selection is made.
function renderLookupResults(){
  const O = $('#out');
  if (lookupSel){
    const p = DATA.find(x => key(x) === lookupSel);
    if (p){
      O.innerHTML = `<button type="button" class="lookup-back" data-lookup-back="1">‹ Back to search</button>` + card(p);
      return foot();
    }
    lookupSel = null;
  }
  const q = lookupQ.trim().toLowerCase();
  if (!q){ O.innerHTML = `<div class="empty">Type a strain or brand to look it up.</div>`; return foot(); }
  const matches = pool().filter(p => (p.strain + ' ' + p.brand).toLowerCase().includes(q));
  O.innerHTML = matches.length
    ? `<div class="lookup-list">${matches.map(p => `<button type="button" class="lookup-row" data-lookup-id="${key(p)}">
         <span class="lookup-left"><span class="lookup-strain">${p.strain}</span><span class="lookup-form">${formLabel(p)}</span></span><span class="lookup-brand">${p.brand}${stocked(p)?'':' · out of stock'}</span>
       </button>`).join('')}</div>`
    : `<div class="empty">Nothing scanned matches that.<br><span style="font-size:13px">It may be on the shelf but not in Compass yet.</span></div>`;
  return foot();
}
function foot(){
  const unverified = DATA.filter(p => shelfTag(p) === 'Unverified').length;
  // "scanned", not "products" — the catalogue is whatever has been through the
  // capture script, which is not the same as what is on the shelf. Every empty
  // state says so too; this keeps the scope visible even when results look full.
  $('#foot').innerHTML = `${DATA.length} scanned · ${DATA.filter(stocked).length} in stock${
    unreadable ? ` · <b style="color:var(--warn)">${unreadable} unreadable (a data typo?)</b>` : ''}${
    unverified ? ` · <b>${unverified} shelf tag${unverified>1?'s':''} unverified</b> — tap Edit on a card to set one` : ''}<br>
    ●●● real receptor mechanism · ●●○ some human data · ●○○ folklore<br>
    Only caryophyllene has a mechanism (CB2). The rest is inherited from strain databases.<br>
    <b>THC is the one number on the COA that reliably drives the experience.</b>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('.tabs button');
  if (t){ tab = t.dataset.tab; render(); return; }

  const c = e.target.closest('.catseg button');
  if (c){
    const catKey = c.closest('.catseg').dataset.catkey;
    if (catKey === 'effCat') effCat = c.dataset.cat;
    if (catKey === 'simCat') simCat = c.dataset.cat;
    render();
    return;
  }

  const clr = e.target.closest('[data-clear]');
  if (clr){
    const id = clr.dataset.clear;
    const inp = document.getElementById(id);
    if (inp) inp.value = '';                 // direct write; the node stays mounted
    if (id === 'q'){ window._q = ''; renderEffectResults(); }
    else { lookupQ = ''; lookupSel = null; renderLookupResults(); }
    toggleClear(id);
    if (inp) inp.focus();                    // ready to type the next thing
    return;
  }

  const row = e.target.closest('.lookup-row');
  if (row){ lookupSel = row.dataset.lookupId; renderLookupResults(); return; }
  const back = e.target.closest('[data-lookup-back]');
  if (back){ lookupSel = null; renderLookupResults(); }
});
// Keep the open-Why set in sync with what the reader actually does. `toggle`
// doesn't bubble, so listen in the capture phase (which still reaches document
// for non-bubbling events). No re-render here — the <details> already reflects
// its own new state; we're only remembering it for the NEXT render.
document.addEventListener('toggle', e => {
  const d = e.target;
  if (!d.matches || !d.matches('details.why') || !d.dataset.why) return;
  if (d.open) openWhy.add(d.dataset.why); else openWhy.delete(d.dataset.why);
}, true);
document.addEventListener('change', e => {
  if (e.target.id === 'oos') render();
  if (e.target.id === 'effSize'){ effSize = e.target.value; renderEffectResults(); }
  if (e.target.id === 'effLean'){ effLean = e.target.value; renderEffectResults(); }
});
// Show the × only when there's something to clear. Toggles a class on the
// button that's already mounted — never re-renders the input, same rule as
// everything else that runs on keystroke.
function toggleClear(inputId){
  const btn = document.querySelector(`[data-clear="${inputId}"]`);
  const inp = document.getElementById(inputId);
  if (btn && inp) btn.classList.toggle('show', !!inp.value);
}

document.addEventListener('input', e => {
  // Each of these updates ONLY the results below its input — the input node
  // itself is never touched, so focus and cursor position are never at risk.
  if (e.target.id === 'q'){ window._q = e.target.value; toggleClear('q'); renderEffectResults(); return; }
  if (e.target.id === 'lookupQ'){ lookupQ = e.target.value; lookupSel = null; toggleClear('lookupQ'); renderLookupResults(); return; }
  const inp = e.target.closest('.combo-input');
  if (inp){
    const id = inp.closest('.combo').dataset.combo;
    const st = comboState(id);
    st.query = inp.value; st.open = true; st.highlight = -1;
    updateComboList(id);
  }
});

// mousedown (not click) so selecting a row fires before the input's blur closes the list
document.addEventListener('mousedown', e => {
  const li = e.target.closest('.combo-list li[data-id]');
  if (!li) return;
  e.preventDefault();
  comboChoose(li.closest('.combo').dataset.combo, li.dataset.id);
});
document.addEventListener('focusin', e => {
  const inp = e.target.closest('.combo-input');
  if (!inp) return;
  const id = inp.closest('.combo').dataset.combo;
  const st = comboState(id);
  if (st.open) return;   // already open (e.g. refocus after a keypress) — don't reset the query
  st.open = true; st.query = ''; st.highlight = -1;
  inp.value = '';         // clear to search fresh; direct DOM write, no re-render
  updateComboList(id);
});
document.addEventListener('focusout', e => {
  const inp = e.target.closest('.combo-input');
  if (!inp) return;
  const id = inp.closest('.combo').dataset.combo;
  const st = comboState(id);
  st.open = false; st.query = null; st.highlight = -1;
  inp.value = comboLabel(comboSelectedProduct(id));   // revert to the current selection's label
  updateComboList(id);
});
document.addEventListener('keydown', e => {
  const inp = e.target.closest('.combo-input');
  if (!inp) return;
  const id = inp.closest('.combo').dataset.combo;
  const st = comboState(id);
  if (e.key === 'ArrowDown'){
    e.preventDefault(); st.open = true; st.highlight = Math.min(st.highlight+1, st.filtered.length-1);
    updateComboList(id);
  } else if (e.key === 'ArrowUp'){
    e.preventDefault(); st.highlight = Math.max(st.highlight-1, 0);
    updateComboList(id);
  } else if (e.key === 'Enter'){
    e.preventDefault();
    if (st.highlight >= 0 && st.filtered[st.highlight]) comboChoose(id, key(st.filtered[st.highlight]));
  } else if (e.key === 'Escape'){
    st.open = false; st.query = null; st.highlight = -1;
    inp.value = comboLabel(comboSelectedProduct(id));
    updateComboList(id);
    inp.blur();
  }
});

// ── loading data
//
// Preferred path is the Worker: it returns every record in ONE response, using
// its own authenticated GitHub quota. Going straight to GitHub from here means
// 1 API call per load against a limit of 60/hour PER IP — and every device on
// the shop's wifi shares that one number, so a busy shift can exhaust it and
// silently drop everyone back to the embedded seed. The Worker path is what
// makes polling safe.
// Turn [{name, sha, url}] into records. The sha in the URL makes each version
// immutable, so the browser's own cache serves anything that hasn't changed and
// only genuinely-edited records cross the network — while a stock change is
// picked up instantly, because editing a file changes its sha.
async function recordsFromIndex(files){
  // allSettled, NOT Promise.all: one unreadable record (a hand-edit typo like
  // `"thc": 26.07%`, invalid JSON) must never sink the whole load. Skip the bad
  // ones, keep the rest, and surface the count in the footer so the break is
  // visible instead of silent. Only a total wipeout falls back to the caller.
  const settled = await Promise.allSettled(files.map(async f => {
    const p = await fetch(`${f.url}?v=${f.sha}`).then(r=>r.json());
    p._key = f.name.replace(/\.json$/, '');   // repo filename is unique by construction; the record's own `id` isn't
    return p;
  }));
  const ok = settled.filter(s => s.status === 'fulfilled').map(s => s.value);
  const bad = files.filter((f,i) => settled[i].status === 'rejected').map(f => f.name);
  unreadable = bad.length;
  if (bad.length) console.warn('Compass: skipped ' + bad.length + ' unreadable record(s):', bad);
  if (!ok.length) throw new Error('no readable records');   // truly nothing — let the caller fall back
  return ok;
}

async function fetchRecords(){
  if (STOCK_API){
    try {
      // The cache-buster is deliberate. `cache: 'no-store'` only governs the
      // browser's own cache — Cloudflare's edge cache sits in front of it, and
      // it once pinned a 500 from a broken deploy so hard that the fix looked
      // like it hadn't worked. A unique URL each time cannot be served stale.
      // The Worker still collapses its GitHub calls internally, under its own
      // fixed cache key, so this costs nothing.
      const res = await fetch(STOCK_API.replace(/\/+$/, '') + '/data?t=' + Date.now(), {cache: 'no-store'});
      if (!res.ok) throw new Error('worker ' + res.status);
      const body = await res.json();
      if (Array.isArray(body) && body.length){
        // Current Worker returns a file index; an older one returned whole
        // records. Accept either so a redeploy can happen in any order.
        if (body[0] && body[0].url && body[0].sha) return recordsFromIndex(body);
        if (body[0] && body[0].strain) return body;
      }
      throw new Error('unrecognised response');
    } catch(e){
      // Worker unreachable or mid-redeploy. Fall through to GitHub rather than
      // dropping everyone to the 9-record embedded seed.
    }
  }
  const idx = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/data`,
    {cache: 'no-store'}).then(r=>r.json());
  if (!Array.isArray(idx)) throw new Error('rate limited');   // caller keeps the seed
  // ?v=<sha> is load-bearing, not decoration: raw.githubusercontent serves
  // max-age=300, so without it a refresh reads a five-minute-old copy and
  // overwrites a stock change that was just made.
  return recordsFromIndex(idx.filter(f => f.name.endsWith('.json'))
    .map(f => ({name: f.name, sha: f.sha, url: f.download_url})));
}

(async function load(){
  if (GH_USER && GH_REPO){
    try { DATA = await fetchRecords(); }
    catch(err){ flash = 'Using built-in data — couldn\'t reach the repo.'; }
  }
  render();
  startAutoRefresh();
})();

// ── keep every screen current without anyone touching it
//
// A register sits on this page all shift. Without this it would show whatever
// was true when the page was opened — which would defeat the entire point of
// stock being shared. Refresh on a timer while visible, and immediately when
// someone comes back to the tab.
let refreshTimer = null;
async function refresh(){
  if (busyKey) return;                      // don't fight an in-flight write
  let fresh;
  try { fresh = await fetchRecords(); } catch(e){ return; }   // offline: keep what we have
  if (!fresh || !fresh.length) return;
  DATA = applyRecentWrites(fresh);
  // Re-rendering under someone's fingers would wipe what they're typing, so
  // take the data now and let the next natural render show it.
  const el = document.activeElement;
  const typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
  if (!typing) render();
}
function startAutoRefresh(){
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => { if (!document.hidden) refresh(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
}
</script>
</body>
