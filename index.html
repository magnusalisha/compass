<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A22">
<title>Compass</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Compass">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B2A22; --card:#F1EBE0; --card2:#E7E0D2; --ink:#20261F; --ink2:#5C6558;
    --gold:#C4913B; --line:#D6CDBC; --pale:#C9D6C4; --dim:#7E9182; --warn:#8C3B22;
    --car:#B5462F; --lim:#D4802A; --myr:#6B8C3A; --apn:#3E7A5E; --bpn:#3E7A5E;
    --lin:#8B7BC7; --hum:#8B6A3E; --bis:#D4B483; --tpl:#2F8F7A; --oci:#94A83C;
    --ter:#5E9B8F; --far:#B08A4E; --etc:#9AA694;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--pale);font-family:Inter,system-ui,sans-serif;
       line-height:1.5;padding:22px 18px calc(48px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;
           text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
  h1{font-family:Fraunces,serif;font-size:52px;font-weight:700;color:#F3EFE4;
     letter-spacing:-.02em;line-height:1;margin:12px 0 10px}
  .sub{color:var(--dim);font-size:15px;max-width:34ch;margin-bottom:22px}

  .tabs{display:flex;gap:9px;margin-bottom:16px}
  .tabs button{flex:1;padding:12px 8px;border-radius:999px;border:1px solid var(--dim);
    background:transparent;color:var(--pale);font:600 14px Inter,sans-serif;cursor:pointer}
  /* On a narrow phone four across leaves ~77px each, so "Match by effect" wrapped
     to three lines and the 999px radius turned every tab into a circle. Two rows
     of two keeps each label on one line and the pill shape intact. */
  @media(max-width:440px){ .tabs{display:grid;grid-template-columns:1fr 1fr} }
  .tabs button[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#231A08}

  .stockrow{display:flex;align-items:center;gap:10px;margin-bottom:16px;color:var(--pale);font-size:14px}
  .stockrow input{width:20px;height:20px;accent-color:var(--gold)}

  input[type=text],select{width:100%;padding:15px 16px;border-radius:12px;border:none;
    background:var(--card);color:var(--ink);font:500 16px Inter,sans-serif;margin-bottom:11px}
  select{font-family:'IBM Plex Mono',monospace;font-size:15px;
    appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
    background-position:calc(100% - 20px) calc(50% - 2px),calc(100% - 15px) calc(50% - 2px);
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  input:focus,select:focus{outline:2px solid var(--gold);outline-offset:2px}
  /* A set filter must LOOK set. Every dropdown rendered identically whether it
     said "Any type" or "Indica", so the only way to notice a filter left on from
     the last customer was to read the words — and a forgotten one hides most of
     the shelf: Indica alone hides 73% of what's in stock, Flower and Indica
     together hide 92%. Gold because that is already the active colour on the
     tabs and the category segment, so it needs no explaining.
     Focus keeps its OUTLINE, which sits outside the border and offset from it,
     so a focused-but-unset dropdown never passes for a set one. */
  select[data-set]{border:1px solid var(--gold);color:var(--ink);font-weight:600}
  /* Two per row fits a 375px phone. The effect tab shows a third (infusion) on
     All/Preroll only — at three, 110px each would truncate "Non-infused", so
     let it wrap to a second line rather than cramp. */
  .pair{display:flex;gap:9px;flex-wrap:wrap}
  .pair select,.pair .combo{flex:1 1 140px;min-width:0}
  /* Compare's two pickers carry a long label (strain · form · brand). Side by
     side on a 375px phone that leaves about 16 characters each, which cut off
     the form — the exact thing the label is there to show. Stack them on narrow
     screens so each gets the full width. The effect tab's type/size pair keeps
     its row: "Any type" and "Any size" fit fine. */
  @media(max-width:560px){ .pair-compare{display:block} }

  /* clear (×) button living inside the search field */
  .searchwrap{position:relative;margin-bottom:11px}
  .searchwrap input{margin-bottom:0;padding-right:46px}
  .clearbtn{position:absolute;right:7px;top:50%;transform:translateY(-50%);
    width:32px;height:32px;border:none;background:none;color:var(--ink2);
    font:400 21px/1 Inter,sans-serif;border-radius:50%;cursor:pointer;
    display:none;align-items:center;justify-content:center;padding:0}
  .clearbtn.show{display:flex}
  .clearbtn:hover{background:var(--card2);color:var(--ink)}

  /* unmistakable at a glance on a phone mid-shift */
  /* Sits above everything, edge to edge. It's a statement about the whole page,
     not about the results, so it reads as a system strip rather than content —
     and pulling it out of the panel means it stops being re-rendered under the
     tabs on every keystroke. Negative margins cancel body's 22px/18px padding;
     the top one is bigger to reach the very edge. */
  .sandbox-strip{background:#8C3B22;color:#FFEDE4;font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.09em;text-transform:uppercase;text-align:center;
    padding:9px 12px;font-weight:600;margin:-22px -18px 18px}

  .catseg{display:flex;gap:6px;margin-bottom:11px}
  .catseg button{flex:1;padding:9px 6px;border-radius:999px;border:1px solid var(--dim);
    background:transparent;color:var(--pale);font:600 12.5px Inter,sans-serif;cursor:pointer}
  .catseg button.active{background:var(--gold);border-color:var(--gold);color:#231A08}

  .combo{position:relative;margin-bottom:11px}
  /* room for the × so a long "strain · form · brand" label doesn't run under it */
  .combo input{margin-bottom:0;padding-right:46px}
  .combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);
    border-radius:12px;max-height:240px;overflow-y:auto;z-index:20;list-style:none;
    box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .combo-list li{padding:12px 16px;font:500 15px Inter,sans-serif;color:var(--ink);cursor:pointer;
    display:flex;gap:8px;align-items:baseline}
  .combo-list li span{color:var(--ink2);font-size:13px}
  .combo-list li:hover,.combo-list li.hl{background:var(--card2)}
  .combo-list li.combo-empty{color:var(--ink2);cursor:default;font-size:13.5px}
  .combo-list li.combo-empty:hover{background:none}

  .card{background:var(--card);color:var(--ink);border-radius:16px;padding:18px;margin-bottom:12px}
  .card.card-faint{border:1px dashed var(--warn)}
  .card h2{font-family:Fraunces,serif;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
  .thc{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:19px;text-align:right;white-space:nowrap}
  .thc small{display:block;font-size:10px;color:var(--ink2);font-weight:400;letter-spacing:.08em}
  /* Sits under the THC so the card's two headline numbers are together, the same
     pairing Compare already shows. Normal letter-spacing — the .08em above is for
     the all-caps "THC" label and looks stretched on a mixed-case string. */
  .thc .terp-total{margin-top:7px;letter-spacing:.01em;font-size:10.5px}
  .top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;background:#DCE6D8;color:#3D5140;padding:4px 9px;border-radius:5px}
  /* The shelf tag carries a colour along ONE axis: the direction the package
     claims. Five steps because the vocabulary has five values, and a scale that
     skips steps is not a scale. Tuned in CIELAB rather than by eye — every
     neighbouring pair is at least 6.5 apart in perceived colour, the poles are
     29.5 apart, and the faintest text sits at 5.6:1.
     Muted on purpose. Green-for-sativa and purple-for-indica is the industry's
     folklore shorthand, and the evidence dots exist to argue against it; a quiet
     tint on a chip that visibly QUOTES the package stays on the right side of
     that. Saturated fills would put Compass's voice behind the claim.
     .tag-shelf stays as the fallback, so a value added at the editing end still
     renders — see the note above shelfTag(). */
  .tag-shelf{background:#E0DAEF;color:#4B3E70}
  .tag-s1{background:#BEDBCC;color:#1F4A38}   /* Sativa                */
  .tag-s2{background:#DEE9DF;color:#3B6152}   /* Sativa-leaning Hybrid */
  .tag-s3{background:#E3DED2;color:#4A4F45}   /* Hybrid — no direction */
  .tag-s4{background:#E5DFEE;color:#59497F}   /* Indica-leaning Hybrid */
  .tag-s5{background:#D4C9EA;color:#3B2E5E}   /* Indica                */
  .tag-unset{background:transparent;border:1px dashed var(--line);color:var(--ink2)}

  .stack{display:flex;height:11px;border-radius:6px;overflow:hidden;margin:13px 0 11px;background:#E0D8C8}
  .stack i{height:100%}
  .chips{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink2)}
  /* the plain word riding along with each molecule — present but never louder
     than the measurement it explains */
  .chips em{font-style:normal;opacity:.62}
  .chips span{display:flex;align-items:center;gap:6px}
  .chips b{width:8px;height:8px;border-radius:50%;flex:none}

  /* mirrored comparison — read the difference, don't decode it */
  /* Number columns size to their content; the MIDDLE (bars + name) takes the
     rest. With 1fr on the outer columns instead, the middle collapsed to the
     name width and both bar tracks rendered at 0px — the mirrored comparison
     was invisible. auto/1fr/auto is what gives the bars room. */
  .cmp{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:6px 10px;margin-top:14px}
  .cmp .val{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink2)}
  .cmp .val.r{text-align:right}
  .cmp .nm{font-size:13.5px;text-align:center;white-space:nowrap;font-weight:500}
  .cmp .tr{height:11px;border-radius:4px;background:#E0D8C8;position:relative}
  .cmp .tr i{position:absolute;top:0;bottom:0;border-radius:4px}
  .cmp .tr.l i{right:0} .cmp .tr.r i{left:0}

  .read{margin-top:18px;padding-top:15px;border-top:1px dashed var(--line)}
  .read p{margin-bottom:10px;font-size:15px}
  .read p:last-child{margin-bottom:0}
  /* The read is what someone came to the counter for, and it was the only body
     line set BELOW the 15px default — 14px and muted, quieter than the strength
     line under it. 17px sits between body (15) and the strain name (19), and
     full-strength ink stops it reading as a caption.
     Selector is p.says, not .says: `.read p` would otherwise win on specificity
     and silently keep the 15px. */
  .read p.says{font-size:17px;color:var(--ink);line-height:1.45}
  .read-faint{opacity:.88}
  .faint-flag{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--warn);margin-bottom:9px}
  .faint-explain{font-size:12.5px;color:var(--ink2);font-style:italic;margin-top:8px}
  .unread{font-size:12.5px;color:var(--ink2);font-style:italic;margin-top:8px}
  .warnbox{background:#F6E3D3;border:1px solid #E0B99A;color:#7A3A1C;border-radius:10px;
    padding:12px 13px;margin-top:13px;font-size:13.5px;line-height:1.45}
  .ev{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);margin-top:7px;letter-spacing:.04em}
  /* Bottom margin matches the top. It was absent because nothing used to follow
     the WHY panel; Strength now does, and with the global *{margin:0} reset the
     two sat flush against each other. Collapses with .unread's 8px, so a card
     carrying both doesn't get a double gap. */
  .why{margin-top:9px;margin-bottom:9px;font-size:12.5px;color:var(--ink2)}
  .why:last-child{margin-bottom:0}
  .why summary{cursor:pointer;color:var(--ink2);font-family:'IBM Plex Mono',monospace;font-size:11px;
    text-transform:uppercase;letter-spacing:.06em;list-style:none}
  .why summary::-webkit-details-marker{display:none}
  .why summary::before{content:'▸ '}
  .why[open] summary::before{content:'▾ '}
  .why ul{margin-top:9px;padding-left:16px}
  .why li{margin-bottom:9px;line-height:1.45}
  .why li:last-child{margin-bottom:0}
  .why .ev{display:inline;margin:0 0 0 4px}
  .match{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#3D6B4F;margin-top:12px;font-weight:500}
  .acts{display:flex;gap:18px;margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}
  .acts button,.acts a{background:none;border:none;padding:0;color:var(--ink2);font:500 13.5px Inter,sans-serif;cursor:pointer;text-decoration:none}
  .acts button:hover,.acts a:hover{color:var(--ink);text-decoration:underline}
  .empty{color:var(--dim);text-align:center;padding:34px 14px;font-size:15px}
  .terphead{color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:11.5px;
    line-height:1.6;margin:0 0 12px;letter-spacing:.02em}
  .terphead b{color:var(--pale)}
  .morerow{color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:11.5px;
    line-height:1.6;margin:14px 0 0;letter-spacing:.02em}
  .morerow b{color:var(--pale)}
  .morerow button{display:block;margin-top:8px;font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;letter-spacing:.02em;color:var(--gold);background:none;
    border:1px solid var(--gold);border-radius:999px;padding:7px 14px;cursor:pointer}
  .morerow button:hover{background:rgba(200,163,74,.12)}
  .lookup-list{display:flex;flex-direction:column;gap:8px}
  /* effect search: "right terps, wrong size" pivots — dimmed but readable */
  .pivot-head{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--dim);margin:20px 2px 10px}
  .pivot{display:flex;justify-content:space-between;align-items:center;gap:14px;
    background:var(--card);color:var(--ink);border-radius:12px;padding:13px 18px;margin-bottom:8px;opacity:.62}
  /* A wrong-size match, dimmed but whole. opacity doesn't block pointer events,
     so every control inside stays clickable — that's the point. */
  .card-dim{opacity:.62}
  .card-dim:hover,.card-dim:focus-within{opacity:1}
  .pivot-strain{font-family:Fraunces,serif;font-weight:700;font-size:16px}
  .pivot-terps{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:'IBM Plex Mono',monospace;
    font-size:12px;color:var(--ink2);margin-top:5px}
  .pivot-terps span{display:flex;align-items:center;gap:5px}
  .pivot-terps b{width:7px;height:7px;border-radius:50%;flex:none}

  .lookup-left{display:flex;flex-direction:column;gap:4px;min-width:0}
  .lookup-form{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);letter-spacing:.03em}
  /* Form and shelf tag share a line: what it is, then which way the package says
     it points. Wraps rather than truncating — an infused multipack's form text is
     long, and on a narrow screen the chip drops below it instead of squeezing. */
  .lookup-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
  /* Same scale as the card's chips, one step down to sit beside 11px form text. */
  .tag-sm{font-size:9px;padding:3px 7px;letter-spacing:.09em}
  .lookup-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--card);color:var(--ink);border:none;border-radius:12px;padding:14px 16px;
    font:inherit;text-align:left;cursor:pointer;width:100%}
  .lookup-row:hover{background:var(--card2)}
  .lookup-strain{font-family:Fraunces,serif;font-weight:700;font-size:15.5px}
  /* Right column: who makes it, and how strong. The rows carried no chemistry at
     all, so telling two batches of one strain apart meant opening each in turn —
     85% of strain searches return a single record, but the ones that don't are
     exactly the ones worth comparing. */
  .lookup-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
  .lookup-brand{color:var(--ink2);font-size:13px;white-space:nowrap;flex:none}
  .lookup-nums{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink2);
    letter-spacing:.03em;white-space:nowrap}
  .lookup-nums b{color:var(--ink);font-weight:600}
  /* On a phone the two columns fight: "Preroll · Infused · 0.5g ×5 · 2.5g total"
     wraps and strands its tail beside the figures. Stack instead — the form gets
     the full width, and brand and figures share the line below it. */
  @media (max-width:430px){
    .lookup-row{flex-direction:column;align-items:stretch;gap:7px}
    .lookup-right{flex-direction:row;align-items:baseline;justify-content:space-between;width:100%}
  }
  /* Back to top. Browsing a category is 24 screens on a POS display and 42 on a
     phone, and the only reason to return is to change a filter — so this is the
     cheap half of that problem. The expensive half is that the layout caps at
     680px and never uses a wide screen; see the handoff.

     Styled as an unselected tab rather than in gold: gold means "this is the
     one you picked", and a utility that is always present must not claim it.
     Opaque background because it floats over cards, which are light. */
  #totop{position:fixed;right:16px;z-index:40;
    bottom:calc(16px + env(safe-area-inset-bottom));
    padding:11px 16px;border-radius:999px;border:1px solid var(--dim);
    background:var(--bg);color:var(--pale);font:600 13.5px Inter,sans-serif;
    cursor:pointer;
    /* Two shadows doing different jobs. The inset is a flat fill lifted slightly
       off --bg: on a phone this floats over light CARDS, where an opaque dark
       pill reads fine, but on a POS display the column is only 680px of a
       1920px screen so it floats over the BACKGROUND — the same colour as
       itself, leaving a 1px border to do all the work. The outer shadow
       separates it from the light cards. */
    box-shadow:inset 0 0 0 999px rgba(201,214,196,.07), 0 2px 10px rgba(0,0,0,.4);
    opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s}
  #totop.show{opacity:1;transform:none}
  #totop:hover{border-color:var(--pale);color:#fff}
  /* 44px is the smallest reliable touch target, and this is used on a counter
     with a customer waiting. */
  @media(max-width:440px){ #totop{padding:13px 18px} }

  .lookup-back{background:none;border:none;color:var(--pale);font:600 13.5px Inter,sans-serif;
    cursor:pointer;padding:0;margin-bottom:12px;display:block}
  .lookup-back:hover{color:#fff}
  .foot{margin-top:26px;color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.6}
  .flash{background:#33473A;border:1px solid #48604F;color:var(--pale);border-radius:10px;
    padding:11px 13px;margin-bottom:14px;font-size:13px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="sandtop"></div>
<div class="eyebrow">🌿 Budtender's tool</div>
<h1>Compass</h1>
<div class="sub">Match what's on the shelf to what a customer's actually asking for — by terpene, not by strain name.</div>

<div class="tabs" role="tablist">
  <button role="tab" data-tab="effect" aria-selected="true">Match by effect</button>
  <button role="tab" data-tab="similar" aria-selected="false">Find similar</button>
  <button role="tab" data-tab="compare" aria-selected="false">Compare</button>
  <button role="tab" data-tab="lookup" aria-selected="false">Lookup</button>
</div>
<label class="stockrow"><input type="checkbox" id="oos"> Include out-of-stock items</label>
<div id="panel"></div>
<div id="out"></div>
<div class="foot" id="foot"></div>
<button id="totop" type="button" aria-label="Back to top" hidden>↑ Top</button>

<script>
// ── point at your repo once it exists
const GH_USER = "magnusalisha", GH_REPO = "compass";
// Sandbox is derived from the repo name, never set by hand — so index.html is
// byte-identical in both places and a change can move either direction without
// an edit. Only the GH_REPO/STOCK_API constants differ between environments.
const SANDBOX = /sandbox/i.test(GH_REPO);
// Tell the two apart in the tab bar, not just on the page. With both open at
// once — which is the normal way to compare a change against live — the titles
// were identical and the only way to tell which was which was to switch to it.
// Derived from SANDBOX rather than written into <title>, so index.html stays
// byte-identical between the two repos and this can ship to prod inert.
if (SANDBOX) document.title = 'Compass SANDBOX';
// ── the Cloudflare Worker that writes stock changes back to the repo.
// Paste your Worker URL here after deploying it (see DEPLOY-WORKER.md).
// Left empty, the page still works — it just hides the sold-out buttons
// rather than offering a control that would silently do nothing.
const STOCK_API = "https://compass-stock.magnus-alisha.workers.dev";

const COLOR = {'beta-Caryophyllene':'--car','Limonene':'--lim','beta-Myrcene':'--myr',
  'alpha-Pinene':'--apn','beta-Pinene':'--bpn','Linalool':'--lin','alpha-Humulene':'--hum',
  'alpha-Bisabolol':'--bis','Terpinolene':'--tpl','Ocimene':'--oci','Terpineol':'--ter','Farnesene':'--far'};
// [phrase, evidence 1-3, what it rests on]
// 3 = a real receptor mechanism. 2 = animal work + some human data. 1 = folklore,
// rodent studies at doses you'll never inhale, or aromatherapy. Most of this is a 1.
const REPORTED = {
  'beta-Caryophyllene':['body calm, eases tension',3,'Selective CB2 agonist (Gertsch 2008) — the only terpene with a real receptor mechanism. Human trials still thin.'],
  'Limonene':['lifts mood, brightens',2,'Some small human inhalation studies on mood/anxiety. No cannabinoid-receptor mechanism.'],
  'Linalool':['mellow, softens the edges',2,'Sedative in rodent models and aromatherapy work. Not shown at inhaled cannabis doses.'],
  // Was 'heavy, sedating, couch-leaning' — three assertions stated flat, on the
  // thinnest evidence in the table. On the CARD that was survivable: the WHY

  // never the note, so there the sedation claim stood unqualified on 56 cards.

  // was the tool's own voice adding a mechanism it doesn't have. The note below
  // still explains where the couch-lock story comes from — now as background for
  // a claim the card declines to make, rather than a footnote contradicting it.

const dots = n => '●'.repeat(n) + '○'.repeat(3-n);

// ── category: derived from `form`, first rule wins. Add a rule to grow further.
// Vape is checked before Preroll: a disposable never says "preroll", but an
// "Infused Preroll" must not be caught by a loose vape term.
// Word boundaries matter — bare /cart/ would match "carton" and /pod/ "tripod".
// The preroll pattern accepts Preroll, Pre-roll, Pre-Roll and Pre Roll: real
// COAs use all four, and /preroll/i alone was silently filing the hyphenated
// ones under Flower.
const CATEGORY_RULES = [
  [/\b(vapes?|carts?|cartridges?|disposables?|pods?)\b/i, 'Vape'],
  // Blunts are prerolls. Lobo's "Infused Blunt 1g" is the first one to arrive
  // and without this it falls through to Flower, which would put a rolled
  // product on the flower shelf and out of the preroll size filter entirely.
  [/pre[\s-]?rolls?|\bblunts?\b/i, 'Preroll'],
];
const category = p => (CATEGORY_RULES.find(([re]) => re.test(p.form)) || [,'Flower'])[1];
const CATEGORIES = ['All', 'Flower', 'Preroll', 'Vape'];
// not a UI filter category (yet) — just enough to pick honest fallback copy below
const isEdible = p => /gummy|edible|chocolate|beverage|tincture|capsule/i.test(p.form);

// ── CAN THE CUSTOMER SMELL THIS? ─────────────────────────────────────────────
//
// Only flower. The shop has smell jars — glass, pump top — so "trust your nose"
// is a real instruction for an eighth. A preroll is in a sealed tube and a vape
// is a sealed cartridge; telling someone to smell either is telling them to do
// something they physically cannot.
//
// Measured 31 Aug: of the 70 in-stock cards that told someone to use their nose,
// 45 were sealed — 64%. Prerolls were worst (23 of 69 on the faint path, since
// so many are blends with weak profiles) and every one of the 16 vape cards
// reading "folklore, trust your nose over this" was a sealed cartridge.
//
// WHAT REPLACES IT, and why it is not "go by the label": the card second-guesses
// the label two lines further down ("Package says Indica, yours said Sativa"),
// and the shop's own website disagrees with Compass on 50 products. Pointing at
// the label while distrusting it is worse than saying nothing.
//
// Brand or price instead — the same answer Compare reaches when the chemistry
// does not separate two products. It is what actually decides the sale.
// (Alisha, 31 Aug: "customers put a lot of weight into our recommendations.
// imho, i think quality is subjective. people like Dank and their weed sucks".)
// Compass reports chemistry; when the chemistry is thin it defers to what the
// customer already values rather than inventing a quality judgement.
const smellable = p => category(p) === 'Flower';

// A customer's "sativa / indica / hybrid" is a request in the vocabulary the
// package is written in, so it's answered from the package — see filterLean()
// below for the measurements behind that, which reversed an earlier decision to
// answer it from chemistry instead. The card still shows the ⚠ clash where the
// terps disagree; the budtender sees it and can say so.
const LEAN_OF = { Sativa: 'lifting', Indica: 'settling', Hybrid: 'mixed' };

// ── weight / package details, parsed out of `form`.
// weightText: "3.5g", "1g ×4" (multipack), "" when the form has no weight.
// The forms are messy ("0.5g (5pk)", "4-pack", "3ct", "Pre-Roll") so parse
// defensively rather than trust a fixed layout.
// A pack's gram figure is ambiguous: some labels state the PER-UNIT weight
// ("1g 4-pack" = four 1g joints), others the TOTAL ("3.5g 7-pack" = seven 0.5g
// joints, 3.5g total). Nothing in the string says which, and a COA reports net
// weight, not per-unit. So infer: a real preroll is a standard size; if the
// stated grams is implausible as one joint but divides evenly into a standard
// size, it's the total. Genuinely ambiguous cases (e.g. 1.5g 2-pack) default to
// per-unit and show the total too, so a human can sanity-check via Edit.
// Tolerance is RELATIVE, not absolute, because producers round the pack weight
// on the label. Ruby Farms' "Preroll 5g (7-pack)" is seven 0.7g joints — 4.9g,
// printed as 5g. 5/7 = 0.7143, which is 0.0143 from the 0.7 standard: outside a
// 0.01 absolute window, so the old test read 5g as the PER-JOINT weight and the
// card claimed "5g ×7 · 35g total". Five records said that. As a fraction of the
// standard it's 2%, which a relative window catches without letting anything
// else through (0.75g 2-pack stays per-unit at 7% off 0.35).
const STD_UNIT = [0.35, 0.5, 0.7, 0.75, 0.9, 1, 1.5];
const stdUnit = g => STD_UNIT.find(s => Math.abs(s - g) / s < 0.03) || null;
const nearStd = g => stdUnit(g) !== null;
const gstr = g => (+g.toFixed(2)) + 'g';
const parseSize = p => {
  const f = String(p.form || '');   // a numeric `form` is truthy and has no .match
  // The leading digit is OPTIONAL. A hand-edit of ".75g 2-Pack" made this
  // regex skip the dot, capture "75", and render "75g ×2 · 150g total" — a
  // hundredfold error that still looks like a weight, on a card nobody would
  // think to double-check. `\d*\.?\d+` reads ".75" as 0.75, and the engine
  // finds the dot first, so it can never fall back to the bare digits.
  const w = f.match(/(\d*\.?\d+)\s*g\b/i);
  const pk = f.match(/(\d+)\s*-?\s*(?:pk|ct|pack|cpk)/i);
  if (!w) return null;
  const g = parseFloat(w[1]);
  if (!pk) return { per:g, count:1, total:g };
  const n = parseInt(pk[1], 10), perIfTotal = g / n;
  const statedIsTotal = category(p) === 'Preroll' && nearStd(perIfTotal) && !nearStd(g);
  // Snap to the standard size rather than showing the raw division: the joints
  // are 0.7g, not 0.71g, and the size dropdown should group them with every
  // other 0.7g preroll. The stated pack weight stays as the total.
  return statedIsTotal ? { per:stdUnit(perIfTotal), count:n, total:g } : { per:g, count:n, total:g*n };
};
const weightText = p => { const s = parseSize(p); if (!s) return '';
  return s.count > 1 ? `${gstr(s.per)} ×${s.count} · ${gstr(s.total)} total` : gstr(s.per); };
// per-unit weight for grouping in the size dropdown — the TRUE per-joint size
const weightOnly = p => { const s = parseSize(p); return s ? gstr(s.per) : ''; };
// ── the size filter carries pack-vs-single, not just the weight
//
// "0.5g" alone was quietly ambiguous: in stock right now that's 5 single joints
// against 28 that come in packs of 2, 5, 6 or 7 — so filtering to 0.5g and
// handing someone the first result was a coin flip on whether they got one joint
// or seven. Worse, 0.6g, 0.7g and 0.9g exist ONLY as multipacks, so those three
// options could never return a single and never said so.
//
// Values are "s|0.5g" / "p|0.5g". Packs are a preroll thing — every flower and
// vape on the shelf is a single — so the grouped dropdown only appears where
// both kinds actually exist, and Flower and Vape look exactly as they did.
const isPackForm = p => { const s = parseSize(p); return !!s && s.count > 1; };
const sizeKey = p => { const w = weightOnly(p); return w ? (isPackForm(p) ? 'p|' : 's|') + w : ''; };
// "s|*" and "p|*" are the whole group regardless of weight — a customer asks for
// "a pack of prerolls", not for 0.5g multipacks, and picking a size to get there
// meant guessing which sizes even come in packs.
const sizeMatches = (p, sel) => {
  if (sel === 'any') return true;
  const k = sizeKey(p);
  if (!k) return false;
  return sel.endsWith('|*') ? k[0] === sel[0] : k === sel;
};
// Names the filter for the empty states: "0.5g packs", "multipacks", "singles".
const sizeLabel = sel => {
  if (!sel || sel === 'any') return '';
  const [kind, size] = sel.split('|');
  if (size === '*') return kind === 'p' ? 'multipacks' : 'singles';
  return `${size} ${kind === 'p' ? 'packs' : 'singles'}`;
};
// vape sub-type — the package distinction a budtender needs
const vapeType = p => /cart/i.test(p.form) ? 'Cart' : /dispos/i.test(p.form) ? 'Disposable' : '';
// Infused means concentrate was added, and it moves the number a lot: infused
// prerolls here average 39.7% THC against 27.6% for plain ones. The word sits in
// a different place in every form string ("Infused Preroll 0.5g", "Preroll 0.6g
// Infused", "Preroll 0.5g (5pk, Live Resin Infused)"), so just look for it.
// Not applied to vapes — those are concentrate by definition.
const isInfused = p => /infus/i.test(p.form || '');
// the label shown in the form chip: "Flower · 3.5g", "Vape · Cart · 1g",
// "Preroll · Infused · 1g"
const formLabel = p => {
  const c = category(p), s = weightText(p);
  if (c === 'Vape') return ['Vape', vapeType(p), s].filter(Boolean).join(' · ');
  return [c, isInfused(p) ? 'Infused' : '', s].filter(Boolean).join(' · ');
};

// ── shelf_tag: what the PACKAGE claims. Never inferred from chemistry — a
// guessed tag would make the label-vs-chemistry comparison measure the guess
// (CLAUDE_CODE_BRIEF.md). Anything unrecognised — a typo, a stray space, a
// missing field — normalises to Unverified, which is excluded from the
// comparison. Failing closed is the point: a mistyped tag must never be
// mistaken for a real one a human stood in front of the package and set.
// The page does NOT own this vocabulary — compass-manage.js does, and the page
// never writes the field. So display whatever string the record holds instead
// of validating against a list here: a value added at the editing end (like
// "Sativa-leaning Hybrid", which some NY brands print) renders with no change
// to this file. Only blank/missing/"Unverified" count as unset.
// Which step of the scale a tag sits on. Anything unrecognised returns null and
// falls back to the plain .tag-shelf chip, so the page still does NOT own this
// vocabulary — a new value added at the editing end renders, just uncoloured.
const TAG_STEP = {
  'sativa':'s1', 'sativa-leaning hybrid':'s2', 'hybrid':'s3',
  'indica-leaning hybrid':'s4', 'indica':'s5'

const tagStep = t => TAG_STEP[String(t || '').trim().toLowerCase()] || null;
const shelfTag = p => {
  const v = String(p.shelf_tag || '').trim();
  return (!v || v.toLowerCase() === 'unverified') ? 'Unverified' : v;
};
// The direction each label CLAIMS — used only to decide whether the package
// and the chemistry contradict each other. A plain "Hybrid" asserts no
// direction, and an unrecognised value has no known one, so neither can clash;
// both still display, they just don't get a verdict. Keys are lowercased for
// matching, so capitalisation drift in a hand-edited record still resolves.
const SHELF_EXPECTS = {
  'sativa': 'lifting',
  'sativa-leaning hybrid': 'lifting',
  'indica-leaning hybrid': 'settling',
  'indica': 'settling'
};

// ── The shelf-vs-chemistry verdict line and its ⚠ clash warning were REMOVED
// on 2026-07-30, along with labelCheck(). Recorded here because it was the
// tool's signature feature and removing it deserves a reason on the record.
//
// It claimed the terpenes contradicted the package. Two findings killed it:

// 1. Nothing supports the claim. Tested across every non-faint sativa/indica
//    record (n=48/31), no terpene in CHAR separates the two groups at any
//    corrected significance level; myrcene is a coin flip and limonene runs
//    backwards. Learn the directions on half the records, predict the other
//    half: 45.7% accurate against 60.8% for always guessing "sativa". That is

//    cluster reliably, but not along the sativa/indica axis. It is also exactly

//    asserting in prose the claim the dropdown had just abandoned.
//
// 2. Repairing it made it worse. Pointing the line at the measured chemistry
//    (rather than the stored `lean`) fixes the contradiction by construction —
//    36 of 135 cards disagreed with the read printed directly above them — but
//    it would then flag 29 of 48 sativa-labelled products against 7 of 31
//    indica. Caryophyllene and myrcene dominate nearly every profile and both
//    point "settle", so sativa labels absorb almost every hit. That is the
//    structural bias, not a shelf full of mislabelled jars.

// Compass just no longer adjudicates it on evidence it doesn't have. A real
// mislabel check needs something outside the terpenes to check against.

// `p.lean` now has NO reader anywhere in this page. The capture script still
// writes it; nothing here consults it.
// one tap from the card to this record's file in GitHub's editor. No token: the
// page stays public and read-only, GitHub does the auth. Only for records that
// came from the repo (_key) — the embedded seed has no file to point at.
const editURL = p => (GH_USER && GH_REPO && p._key)
  ? `https://github.com/${GH_USER}/${GH_REPO}/edit/main/data/${encodeURIComponent(p._key)}.json`
  : null;
// lets "social preroll" in the effect box auto-apply the Preroll filter
const CATEGORY_WORDS = [[/\b(vapes?|carts?)\b/, 'Vape'], [/\bpre[\s-]?rolls?\b/, 'Preroll'], [/\bflowers?\b/, 'Flower']];
const detectCategoryWord = q => (CATEGORY_WORDS.find(([re]) => re.test(q)) || [])[1] || null;
// ── search normalisation ──────────────────────────────────────────────────
// Mirrors loose() in the Alleaves sync, and for the same reason: one product is
// spelled several ways by the shop, the brand and the POS, and a literal
// substring match makes the reader guess which one this record used. "smart bud"
// could not find SmartBud; "lorange" could not find L'Orange; "kings and queens"
// could not find Kings & Queens, and typing the ampersand could not find it
// spelled out. Whichever spelling won, the other failed.
//
// Applied to BOTH sides, so punctuation, spacing, case and accents stop
// mattering and a record can be named after the package — which is the rule
// everywhere else in Compass — without costing anyone the ability to find it.
const searchNorm = s => String(s || '')
  .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
  .replace(/&/g, ' and ')
  .toLowerCase().replace(/[^a-z0-9]/g, '');

// and the only question they raise at the counter is "did I scan this twice?"
//
// Two overlapping batches are NOT two choices. Nobody asks for a batch — the
// customer asks for the Gelato pen and gets whichever package is nearer. So the
// card's job is to stop reading as a duplicate and to let the old batch be
// retired, NOT to help anyone choose between them.
//
// Identity is label metadata only: brand, strain, and the parsed pack shape.
// Never chemistry — measured across this catalogue, identical terpenes mean the
// same standardised blend far more often than they mean the same product, and
// four pairs of genuinely different strains would be merged by a chemistry test.
//
// The strain and form STRINGS can't be compared raw. Anthem shipped the same
// preroll as both "Northern Lights / Infused Preroll 0.5g (5-pack, 2.5g total)"
// and "Northern Lights - Pack / Preroll 2.5g Infused 5-Pack" — different text,
// one product. So the strain drops a trailing "- Pack" and the form goes through
// parseSize, which reads both of those as 0.5g ×5 infused.
const STRAIN_PACK = /\s*\b(pack|pk|multipack|singles?)\b\s*$/;
const idNorm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
// A blunt is a preroll for shelving, but it is NOT the same product as a joint
// of the same weight — the customer is choosing between them. Lobo ships Gruntz
// as both an "Infused Blunt 1g" and a "Preroll 1g Infused" off the same lot, and
// without this they share an identity and collapse into one card the moment both
// are in stock.
const rollFormat = p => /\bblunts?\b/i.test(p.form || '') ? 'blunt' : '';
const productId = p => {
  const z = parseSize(p);
  return [idNorm(p.brand), idNorm(p.strain).replace(STRAIN_PACK, '').trim(),
          category(p), z ? z.per : '?', z ? z.count : '?', isInfused(p) ? 'inf' : '',
          rollFormat(p)].join('|');
};

// Which batch the card shows: the newest, because it is the one still on the
// shelf after the older one sells through. `scanned_at` is stamped at capture;
// records from before that field existed fall back to the Metrc tag, which is
// not chronological but IS stable — and a card that silently swapped batches
// between renders would be worse than one showing an arbitrary-but-fixed pick.
const newestBatch = ps => ps.slice().sort((x, y) =>
  String(y.scanned_at || '').localeCompare(String(x.scanned_at || '')) ||
  String(key(y)).localeCompare(String(key(x))))[0];

// Collapse in-stock batches of one product to a single card.
//
// Only in-stock records collapse. A sold-out record already says "out of stock"
// wherever it is listed, so it never reads as a duplicate of a live one, and
// leaving it alone keeps the archive honest for Find similar's source picker.
//
// The chosen record is COPIED before annotation — DATA is shared by every view
// and must never carry per-view state. The copy keeps _key, so the card on
// screen still resolves to the exact batch it came from: Edit ↗ opens that
// batch's file, and Compare ↔ and Find similar hand off the right one.
function collapseBatches(list){
  const groups = new Map();
  for (const p of list){
    if (!stocked(p)) continue;
    const k = productId(p);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(p);
  }
  const chosen = new Map();
  for (const [k, ps] of groups){
    if (ps.length < 2) continue;
    // Collapsing only. The `_batches` / `_batchesDiffer` annotation that used to
    // ride along here was never read by anything — batchNote asks the record —
    // and the test behind it compared the two read sentences AS STRINGS, which
    // reports a difference whenever wording moves without the direction moving.
    // See batchNote for the measurement that retired it.
    chosen.set(k, Object.assign({}, newestBatch(ps)));
  }
  if (!chosen.size) return list;
  const seen = new Set(), out = [];
  for (const p of list){
    if (!stocked(p)){ out.push(p); continue; }
    const k = productId(p);
    if (!chosen.has(k)){ out.push(p); continue; }
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(chosen.get(k));
  }
  return out;
}

const pool = () => collapseBatches(DATA.filter(p => $('#oos').checked || stocked(p))
  .sort((x, y) => x.strain.localeCompare(y.strain, undefined, {sensitivity: 'base'})));
// The sellable shelf — in-stock only, alphabetical. Used by the tabs that
// recommend something to hand a customer (effect, similar), which hide the
// out-of-stock toggle and so must never consult it.
const inStock = () => collapseBatches(DATA.filter(p => stocked(p))
  .sort((x, y) => x.strain.localeCompare(y.strain, undefined, {sensitivity: 'base'})));

function vec(p){ const t = p.total_terpenes || 1, o = {};
  for (const [k,v] of Object.entries(p.terpenes||{})) o[k] = v/t; return o; }
function sim(x, y){
  const vx = vec(x), vy = vec(y); let d=0, nx=0, ny=0;
  for (const k of new Set([...Object.keys(vx), ...Object.keys(vy)])){
    const p = vx[k]||0, q = vy[k]||0; d += p*q; nx += p*p; ny += q*q;
  }
  return (nx&&ny) ? d/(Math.sqrt(nx)*Math.sqrt(ny)) : 0;
}
// Character words for the read: [lead phrase, one-word note, direction].
// Kept separate from REPORTED (which still drives the evidence dots and Why
// panel) because the read needs a headline phrase and a short undertone word,
// not the clinical descriptor. "upbeat" replaces "bright" for limonene — bright
// read as a flavour note, not a feeling.
const CHAR = {
  // "buzzy", not "heady": heady is industry vernacular whose everyday meaning is
  // "intoxicating" — a strength claim, competing with the THC figure printed
  // directly above it — and it sat one letter from "heavy", its own opposite, in
  // the same sentence on 10 cards ("heavy and heady in equal measure"). Buzzy is
  // already this terpene's own descriptor in REPORTED and collides with nothing.
  //
  // THE LINE BELOW IS NOT WHERE THAT IS DECIDED. Nothing reads CHAR[k][0]; the
  // card takes CHAR[k][1] and looks it up in SAY, so this entry's first field
  // was changed and the sentence carried on saying "heady" for months. Fixed at
  // SAY.buzzy — see the note there. Left as a warning: a phrase edited here is
  // an edit to a field with no reader.
  'Terpinolene':        ['alert and buzzy','buzzy','lift'],
  'Limonene':           ['upbeat and social','upbeat','lift'],
  'alpha-Pinene':       ['clear-headed','clear','lift'],
  'beta-Pinene':        ['clear-headed','clear','lift'],
  'Ocimene':            ['light and breezy','breezy','lift'],
  'beta-Myrcene':       ['heavy and relaxed','heavy','settle'],
  // 'body', not 'settle'. Caryophyllene's evidence is CB2 (Gertsch 2008) —
  // peripheral, anti-inflammatory — and REPORTED calls it "body calm, eases
  // tension". That is a body claim, not a drowsiness one, and filing it beside
  // myrcene's sedation treated "calm in the body" and "low energy" as one thing.
  //
  // It also broke the read. With caryophyllene on the settle side and leading 71
  // of 150 in stock, everything else settling counted as "same direction", so the
  // sentence reached past a 0.24% linalool to find a 0.04% limonene and then
  // dropped that too for being tiny. 44 reads named a terpene that wasn't the
  // runner-up; 43 named no second character at all. Giving caryophyllene its own
  // direction means it contrasts with both sides and the read finds the actual
  // runner-up: those drop to 5 and 12.
  //
  // A third value is NOT a third opposite — see OPPOSED below. Body sits apart
  // from the lift/settle pair rather than at one end of it.
  'beta-Caryophyllene': ['body-calm','calm','body'],
  'Linalool':           ['mellow and soft','mellow','settle'],
  'alpha-Humulene':     ['cozy and low-key','cozy','settle'],
  'alpha-Bisabolol':    ['gentle and easy','gentle','settle'],
  'Farnesene':          ['settled','settled','settle'],
  // Restored — see the note in REPORTED above. It shares the word "mellow" with
  // linalool, which was harmless while terpineol never reached a card and is not
  // any more: it now leads three. Left as it was rather than invented anew,
  // because a sharper word would be a claim, and terpineol is 1-of-3 folklore.
  'Terpineol':          ['mellow','mellow','settle'],
  // See the note in REPORTED. Single-word phrases on purpose: the two-word forms
  // above ("cozy and low-key") pair two effect words, and for nerolidol there
  // isn't a second honest word to reach for. Farnesene already sets that
  // precedent with ['settled','settled','settle'].
  'Nerolidol':          ['soothing','soothing','settle']

  // Valencene and Guaiol had words here and no longer do.
  //
  // Every other word in this table comes from a claim about how something FEELS
  // — "heady, alert, buzzy", "heavy and relaxed", "lifts mood", "body calm,
  // eases tension". Those two came from claims about how something SMELLS:
  // valencene's recorded claim is "bright, citrusy" (it is the orange-peel
  // terpene) and guaiol's is "dry". Put on the same line as a feel word, they
  // don't read as a weaker claim, they read as a category error — All Gas said
  // "bright, with a cozy undertone", which is a smell and a feeling joined by a
  // comma, and Mandarin Cookies was described entirely as "dry" off 0.06%.
  //
  // Neither has an effect word to fall back to. Valencene's only real evidence
  // is anti-inflammatory in vitro and in skin models, which is not evidence for
  // a felt body effect at inhaled doses, and the table above already records the
  // uplifting claim as folklore. Guaiol is folklore with very little published
  // either way. Inventing a feel word for either is the "folklore on demand"
  // this file refuses elsewhere, so the read leaves them out and unreadNote()
  // says so when they are large enough to matter.
  //
  // They keep their REPORTED entries: the chip still prints "valencene 0.70%"
  // and the WHY panel still cites the evidence. What they lose is the ability to
  // put a word in the read. Measured: 14 cards change, none for the worse — All
  // Gas [Indica] goes from "bright, with a cozy undertone" to "cozy and low-key,
  // with a breezy lift on top", and six cards stop claiming an "upbeat lift on
  // top" that rested on 0.01-0.02% valencene.
};
// ── DO NOT derive `lean` by summing this table. Tried 2026-07-30, reverted the
// same day; the numbers are in PLAN.md §1 so nobody repeats it.
//
// The stored `lean` really is a model guess rather than arithmetic, and it really
// is unreproducible — that diagnosis was right. But replacing it with
// `sum(lift terps) vs sum(settle terps)` measures nothing:
//   - The settle side is NEVER zero (0 of 176 readable profiles); the lift side
//     is zero in 17. Median settle:lift across the whole inventory is 2.76x, so
//     any threshold at or under that calls the AVERAGE product settling. It was
//     returning the baseline, not a reading.
//   - beta-Caryophyllene is in 165 of 177 profiles and LEADS 89 of them, and of
//     those leaders the package says Sativa 29 / Indica 18. It cannot mark a
//     direction it appears in nearly everything with.
//   - Against the package on 79 non-faint sativa/indica records, the sum agreed
//     28 and contradicted 28 — a coin flip. The stored field scores 60%.
// Consistency with says() is not evidence: the read and the verdict agreeing
// proves only that they share a computation, which is equally true of a wrong one.
// The dominant terpenes derived from the ACTUAL measured values, sorted — not
// the stored `dominant` field, which occasionally disagreed with the numbers.
// This is the same order the chips now use, so the whole card reads consistently.
const domTerps = p => Object.entries(p.terpenes||{})
  .filter(([k,v]) => v>0 && REPORTED[k]).sort((a,b)=>b[1]-a[1]).map(([k])=>k);

// Some records carry NO terpene profile at all — distillate carts whose COA
// reports cannabinoids only. That is a different thing from `faint` (a real
// reading that has degraded): there is nothing here to read, at any confidence.
// Everything the card says about chemistry has to stand down for these, or the
// tool states a reading it does not have. This caught three vape carts that
// were stored as confidence:"strong", lean:"mixed" with terpenes:{} — and so
// announced "terps read mixed" off an empty profile.
const hasProfile = p => Object.values(p.terpenes || {}).some(v => v > 0);

// Which lean the TYPE dropdown matches a product on: THE PACKAGE, always.
//
// This used to filter on chemistry wherever the profile was readable, on the
// grounds that surfacing a mislabelled jar is the point of the tool. Changed
// 2026-07-30, because the chemistry does not carry that claim. Tested against
// every sativa/indica-labelled non-faint record we have (n=48/31): not one of
// the twelve terpenes in CHAR separates the two groups at any corrected
// significance level, myrcene lands at AUC 0.498 — a coin flip — and limonene
// runs backwards. Learn each terpene's direction on half the records and predict
// the other half and you get 45.7% accuracy, against 60.8% for always guessing
// "sativa". Full numbers in PLAN.md §1.
//
// That result is not a surprise; it's the published one. Terpene profiles do
// cluster into reliable chemovars, but those clusters don't line up with the
// sativa/indica axis. So filtering the dropdown on derived direction was sorting
// the case by a quantity nobody has shown to exist, and it was doing it instead
// of the one claim a human actually stood in front of the package and read.
//
// The mislabel warning that used to sit alongside this went the same way, later
// the same day and for the same reason — see the note where labelCheck() was.
// A plain "Hybrid" still asserts nothing, and Unverified still matches no type.
const SHELF_LEAN = Object.assign({}, SHELF_EXPECTS, { hybrid: 'mixed' });
const filterLean = p => SHELF_LEAN[String(p.shelf_tag || '').trim().toLowerCase()] || null;

// How close the two sides have to be before the card will call them even.
//
// 1.25x, not the 1.5x this started at. Once the read stopped picking its lead by
// direction, far more cards found their top two genuinely close and the even
// phrasing jumped from 14 cards to 43 — a quarter of the shelf sharing one
// phrase, which is how the evidence badge became meaningless. Every one of the
// 43 was accurate; that isn't the same as useful. At 1.25x it lands on 26.
// Measured alternatives: 1.15x → 12 cards, 1.35x → 32, 1.5x → 43.
const EVEN_T = 1.25;

// A word borrowed from one terpene can only speak for a direction when that
// terpene is most of it. Agent Orange's settle total is seven terpenes —
// myrcene 0.23 + linalool 0.20 + humulene 0.06 + terpineol 0.05 + farnesene
// 0.05 + nerolidol 0.05 + bisabolol 0.04 — and myrcene holds 34%. Printing
// "heavy" there is myrcene speaking for six others, four of them folklore-tier
// under 0.06%. 72 of 214 in-stock cards are shaped that way.
//
// So when nothing holds at least this share of its own direction, the read
// names the DIRECTION instead of borrowing a terpene's word. That is a real
// fact and a useful one at the counter: a spiky profile has a character, a
// broad one is rounded with nothing standing out.
//
// 0.45 is a judgement call — the distribution is smooth, with no natural gap —
// but a mild one, and NOT the same kind of dial as a floor on the values
// themselves. That was tried and rejected: a floor changed which DIRECTION won
// on 56% of cards depending where it sat, and Agent Orange's answer oscillated
// in and out of correctness three times across the range. This threshold never
// changes which direction leads, only whether that direction is named by its
// biggest terpene or by itself, and a card either side of the line reads
// defensibly both ways. 0.40 -> 0.50 moves 30 cards.
// ── What a budtender would actually SAY, out loud, to someone deciding.
//
// The card used to print a label — "heavy and relaxed, with an upbeat lift on
// top". Accurate, and nobody talks like that. Standing with a customer you say
// "this one can feel body heavy while still putting you in a good mood", so
// that is what the card should hand you.
//
// Two forms per word, because the connectors need different grammar. ADJ sits
// after "can feel ___" and after "mostly ___"; ING sits after "while still
// ___". Mixing them is what broke the first draft: "in a good mood" is a
// prepositional phrase, so "with some in a good mood" is not English.
//
// Same character words, same evidence, same directions — only the surface
// changes. Nothing here invents an effect that CHAR did not already claim.
const SAY = {
  //  word       adjective                gerund
  heavy:    ['body heavy',             'weighing you down'],
  calm:     ['loose in the body',      'easing the body'],
  // "round the edges" is British; this shop is in New York.
  mellow:   ['soft around the edges', 'softening the edges'],
  cozy:     ['low-key',                'keeping things low-key'],
  gentle:   ['easy',                   'keeping it easy'],
  settled:  ['settled',                'settling you'],
  soothing: ['soothing',               'soothing you'],
  upbeat:   ['upbeat',                 'putting you in a good mood'],
  // "alert and buzzy", not "heady and alert" — and THIS is the line that decides
  // it. CHAR's first field was changed to "alert and buzzy" on the same grounds
  // and the comment there was written as though that settled it; nothing reads
  // CHAR[k][0]. says() builds the sentence from SAY[CHAR[k][1]], so the card
  // went on saying "heady" for nine in-stock products, including The Botanist's
  // Millionaire — "heady and alert as much as body heavy" — which is the exact
  // heavy/heady collision the earlier note claimed to have removed.
  buzzy:    ['alert and buzzy',        'keeping you alert'],
  clear:    ['clear-headed',           'keeping your head clear'],
  breezy:   ['light',                  'keeping it light'],
};
// The broad phrases in the same two forms — see BROAD_T below.
const BROAD_SAY = {
  settle: ['calm all over',   'keeping you calm all over'],
  lift:   ['lifted all over', 'keeping you lifted all over'],
};

const BROAD_T = 0.45;
// Body holds only caryophyllene, so a body lead is never broad — it is always
// exactly one terpene at 100% of its direction, and needs no phrase here.
const BROAD_PHRASE = { settle: 'calm overall', lift: 'bright overall' };
// The direction phrase this product's read leads with, or null when one terpene
// speaks for its direction and lends its own word. says() and the evidence badge
// both ask, so a card can never print "calm overall" over "leans on myrcene".
const broadLead = p => {
  const { tot, best, dirs } = dirTotals(p);
  if (!dirs.length) return null;
  const d0 = dirs[0][0];
  return best[d0][1] / tot[d0] < BROAD_T ? (BROAD_PHRASE[d0] || null) : null;
};
// Terpenes that have a character word, biggest first. The read is built from the
// top of this list and nothing else.
const rankedTerps = p => Object.entries(p.terpenes||{})
  .filter(([k,v]) => v>0 && CHAR[k]).sort((a,b)=>b[1]-a[1]);

// Lift against calm is the only pairing where calling a product even says
// anything. `settle` and `body` both speak in calm words — cozy, low-key,
// body-calm — so a settle/body pair isn't balanced between two things, it's the
// same thing measured twice. Four in-stock cards read "calm and cozy in equal
// measure", which contrasts nothing and tells a budtender nothing.
const PULLS_APART = (a, b) => (a === 'lift') !== (b === 'lift');

// Each character axis summed, biggest first, plus the biggest single terpene in
// each. says() and netDir both read from this, so the card and Compare cannot
// disagree about which way a product leans.
const dirTotals = p => {
  const tot = {}, best = {};
  for (const [k, v] of rankedTerps(p)){
    const dir = CHAR[k][2];
    tot[dir] = (tot[dir] || 0) + v;
    if (!best[dir]) best[dir] = [k, v];   // ranked is descending, so first wins
  }
  return { tot, best, dirs: Object.entries(tot).sort((x, y) => y[1] - x[1]) };
};

// Does this profile have a direction worth naming at all? Null when a pulling-
// apart pair is close enough that the read calls them even, so anything the card
// calls even is never also described by Compare as pulling one way. Used by
// Compare.
//
// This used to compare the single biggest terpene against the first one on any
// other axis, while says() compared direction SUMS — so the two disagreed. Blue
// Widow's card said neither direction took over while Compare was willing to say
// it pulled against a lifting product. Both now run the same test.
const netDir = p => {
  const { tot, dirs } = dirTotals(p);
  if (!dirs.length) return null;
  const dir0 = dirs[0][0];
  const opp = dirs.slice(1).find(([d]) => PULLS_APART(d, dir0));
  return (opp && dirs[0][1] / tot[opp[0]] <= EVEN_T) ? null : dir0;
};
// Only lift and settle are opposites. 'body' is a third character, not a third
// end of the same line — a caryophyllene-led product and a myrcene-led one are
// different, but they do not pull against each other, and Compare must not say
// they do. Without this, adding 'body' would have turned every body-vs-settle
// pairing into "these pull in opposite directions", on the 71-of-150 products
// caryophyllene leads.
const OPPOSED = (a, b) => (a === 'lift' && b === 'settle') || (a === 'settle' && b === 'lift');

// The read: lead with the BIGGEST measured terpene, name a meaningful opposing
// one as an undertone, call them even only when they nearly are.
//
// It used to pick the lead by direction — take `lean`, then lead with the
// strongest terpene pointing that way. That let the sentence lead with a terpene
// that wasn't the biggest one on the card: Mountain Girl reads "heady and alert"
// off 2.41% myrcene, the largest single terpene reading in the inventory, with
// the chips saying so directly above. Eight records did that.
//
// `lean` is gone from here entirely. It was a model guess that disagreed with
// itself on 58% of strains scanned more than once (Pineapple Express is stored
// as mixed, lifting AND settling), so it had no business choosing the first
// three words of the card. The biggest terpene is measured, stable and already
// printed in the chips above — the read now just agrees with them.
function says(p){
  const ranked = rankedTerps(p);
  if (!ranked.length) return 'hard to call from the terpenes alone';

  // Sum each DIRECTION. The old version compared the single biggest terpene
  // against the first opposing one and ignored everything below them, so Hudson
  // Blue Dream — myrcene 0.73 settling against terpinolene 0.67 AND pinene 0.54
  // lifting — read "heavy and buzzy in equal measure" while the card printed the
  // two lifting terpenes one line above. The read contradicted its own evidence.
  // Measured over 268 records, summing takes agreement between the read's lead
  // and the direction carrying the most terpene mass from 90% to 99%.
  const { tot, best, dirs } = dirTotals(p);
  const lead = best[dirs[0][0]];

  // The contrast is NOT simply the runner-up direction. `settle` and `body` both
  // speak in calm words, so pairing them says the same thing twice — 107 of the
  // old reads did exactly that ("body-calm, with a cozy undertone"). Summing
  // alone made it worse (125). Lift is the only real opposite in this
  // vocabulary, so when a calm direction leads, contrast against lift; when lift
  // leads, contrast against whichever calm direction is larger. That leaves 13.
  const dir0 = dirs[0][0];
  const pick = dir0 === 'lift'
    ? (best.settle && best.body ? (tot.settle >= tot.body ? 'settle' : 'body')
                                : (best.settle ? 'settle' : best.body ? 'body' : null))
    : (best.lift ? 'lift'
       : dir0 === 'settle' ? (best.body ? 'body' : null)
                           : (best.settle ? 'settle' : null));

  // Does the biggest terpene in the leading direction speak for the whole of it?
  // See BROAD_T. When it doesn't, the direction names itself.
  const broad = broadLead(p);
  const leadSay = broad ? BROAD_SAY[dir0] : SAY[CHAR[lead[0]][1]];

  // Nothing to contrast with — 17 records carry no lifting terpene at all, and a
  // bare lead is the honest answer there rather than an invented tension.
  if (!pick) return leadSay[0];

  const opp = best[pick];
  const oppSay = SAY[CHAR[opp[0]][1]];
  // How big the SECOND side is, as a share of the first. This is the number the
  // sentence grades itself on, and it is the useful one at the counter: not how
  // confident the ranking is, but how much of the other thing is in there.
  const oppShare = tot[pick] / dirs[0][1];
  const ratio = dirs[0][1] / tot[pick];
  // A ladder on HOW BIG THE SECOND SIDE IS, not on how the two rank.
  //
  // "X, with an upbeat lift on top" and "X, with a heavy undertone" were the
  // same fact — more X than Y — dressed as a layered experience. Top notes and
  // undertones are perfume vocabulary; nothing in a lab report says one thing
  // sits above another, or arrives first. Same overclaim as "in equal measure"
  // before it, and the third time this file has had to take one out.
  //
  // Each rung below is just the share, said plainly. Measured over 215 in-stock
  // cards the bands are 34 / 54 / 57 / 38 / 25, so every rung earns its place.
  //
  // Phrasing is constrained: this lands after "Can feel ___", "described as
  // ___" and "reads ___", so it has to work as a complement. A full clause
  // ("neither X nor Y takes over") breaks all three — tried, reverted.
  // Both halves use the gerund rather than the adjective wherever they join, so
  // the sentence survives multi-word entries. "X and Y in equal parts" gave
  // Millionaire "heady and alert and body heavy in equal parts" — a double
  // "and" — and "with a little Y" gave "with a little body heavy", which needs
  // a noun it doesn't have. "as much as" and an adverb fix both without asking
  // every word for a third form.
  // The pair has to pull apart before the second half is worth saying at all.
  // This guard used to sit only on the even rung, which let 14 cards say the
  // same thing twice — "soft round the edges while still easing the body",
  // "loose in the body while still keeping things low-key". Settle and body are
  // both calm, so there is no "while still" between them; it reads as a contrast
  // where none exists. Those cards now just state the lead.
  if (!PULLS_APART(dir0, pick)) return leadSay[0];

// rating. Which batch is which is left out too: fulfillment happens in the back
// of the store, so a budtender cannot know which jar is going in the bag, and
// naming the dates would be information nobody can act on.
function batchNote(p){
  if (!p || !stocked(p)) return '';
  if (!Array.isArray(p.thc_range) || p.thc_range.length !== 2) return '';
  const n = p.batches > 1 ? p.batches : 2;
  return `<p class="ev">${n} batches on the shelf, so the THC is a range.</p>`;
}

// ── the read: honest about what it can and can't call
function read(x, y){
  // disambiguate the two strains only when they collide (same name, diff brand)
  const xn = nameVs(x, y), yn = nameVs(y, x), nm = p => p === x ? xn : yn;
  const faint = [x,y].filter(p => p.confidence === 'faint' && hasProfile(p));
  let h = '';
  // No profile at all is a harder stop than faint: there's no reading to
  // discount, so don't imply one. THC is still a real, comparable number.
  const bare = [x,y].filter(p => !hasProfile(p));
  if (bare.length){
    h += `<p><b>Can't compare these on chemistry.</b> ${bare.map(nm).join(' and ')} ${bare.length>1?'have':'has'} no terpene profile on file — the lab reported cannabinoids only. <b>Go with the package label here.</b></p>`;
    if (x.thc != null && y.thc != null && Math.abs(x.thc - y.thc) >= 3){
      const [hi, lo] = x.thc >= y.thc ? [x,y] : [y,x];
      h += `<p>What I can say: <b>${nm(hi)}</b> is the stronger one (${thc1(hi.thc)} THC vs ${thc1(lo.thc)}).</p>`;
    }
    return h;
  }
  if (faint.length){
    // Faint is a CAUTION, never a short circuit. It used to return here, and
    // every version of that was wrong for the same reason: it decided the whole
    // comparison on one product's total, or on which single terpene was largest,
    // and threw away the comparison the customer actually needs.
    //
    // Heir Heads (1.72%, strong) vs Baby Yoda (0.46%, faint) is the case that
    // proved it. Both lead with caryophyllene, so a lead-based test called them
    // indistinguishable and said "go with the package label" — while Heir Heads
    // carried 16x the linalool and 26x the limonene, and both packages said
    // Indica. One side of that pair has excellent data.
    //
    // The gap test below is the right noise filter and already existed: it
    // compares in ABSOLUTE percentage points (>= 0.1), so a 0.33-vs-0.02
    // linalool difference survives while 0.17-vs-0.12 caryophyllene doesn't.
    // Faintness makes small values unreliable; it does not make large
    // differences unreliable. Nothing here needed a second, weaker rule.
    //
    // So: say the numbers are small, then get out of the way.
    h += `<p><b>Faint profile${faint.length>1?'s':''} — read the top rows only.</b> ${faint.map(nm).join(' and ')} ${faint.length>1?'have':'has'} very little terpene content (${faint.map(p=>tpct(p.total_terpenes)+'%').join(', ')}), so the small values below are close to noise.</p>`;
  }
  // Same test the read uses, so Compare can't announce "opposite directions"
  // over two reads that both lead the same way — or over a pair the cards call
  // even. Was branching on `lean`, which the read no longer consults.
  const [xd, yd] = [netDir(x), netDir(y)];
  if (OPPOSED(xd, yd))
    // "; Y more <read>" was written when a read was one adjective. It has been
    // clumsy since the reads grew ("Zourz more upbeat and social, with a heavy
    // undertone") and breaks outright now that a read can itself begin with
    // "mostly" — "Zourz more mostly body heavy". Parallel "as" instead.
    h += `<p>These pull in opposite directions. People tend to describe <b>${xn}</b> as <b>${says(x)}</b>, and <b>${yn}</b> as <b>${says(y)}</b>.</p>`;
  else if (domTerps(x)[0] === domTerps(y)[0])
    // Trimmed 31 Aug. "so they're close cousins" is decoration, and "The
    // difference is underneath" announces what the next two paragraphs are about
    // to do anyway — three sentences to deliver one fact.
    //
    // NOTE the read here is x's, applied to both. That holds because this branch
    // only fires when the two share a lead terpene, and the lead is what the
    // first half of says() is built from. The second half comes from whatever
    // opposes it, which is where the pair CAN differ — so the sentence is at its
    // weakest in that tail. Kept for now; if it ever reads wrong the fix is the
    // lead half alone, not a longer sentence.
    h += `<p>Both lead with <b>${short(domTerps(x)[0]).toLowerCase()}</b> — both can feel <b>${says(x)}</b>.</p>`;
  else
    h += `<p><b>${xn}</b> can feel <b>${says(x)}</b>. <b>${yn}</b> can feel <b>${says(y)}</b>.</p>`;

  const ranked = [...new Set([...domTerps(x).slice(0,3), ...domTerps(y).slice(0,3)])]
    .map(k => [k, (x.terpenes[k]||0) - (y.terpenes[k]||0)])
    .sort((p,q) => Math.abs(q[1]) - Math.abs(p[1]));
  const gaps = ranked.filter(([,d]) => Math.abs(d) >= 0.1).slice(0,2);
  const gapKeys = gaps.map(g => g[0]);
  // Both gaps favour the SAME product on 14,670 of 21,945 pairs — two thirds of
  // every comparison — so the product's name was opening two consecutive lines
  // and the reader had to notice it hadn't changed. Say it once and continue.
  //
  // Only when it's the same product. On the other third the two lines name
  // different products, and there the repetition is the whole point: it's what
  // shows the trade being made. Collapsing those would lose the contrast.
  //
  // Each line still carries its own figures, phrase and dots together, because
  // that grouping is what makes them usable mid-conversation — the version that
  // pushed both effect phrases to the end read shorter and parsed worse.
  let prevHi = null;
  for (const [k, d] of gaps){
    const [hi, lo] = d > 0 ? [x,y] : [y,x];
    const lead = hi === prevHi ? '…and more' : `<b>${nm(hi)}</b> carries more`;
    h += `<p>${lead} ${termName(k, gapKeys).toLowerCase()} (${pctOr(hi.terpenes[k])} vs ${pctOr(lo.terpenes[k])}) — ${REPORTED[k]?REPORTED[k][0]:'a character difference'} <span class="ev">${REPORTED[k]?dots(REPORTED[k][1]):''}</span></p>`;
    prevHi = hi;
  }
  // "Close enough that I'd sell on smell or price" was the tool giving up, and it
  // gave up too readily. On 231 of the 290 pairs that reach here — 80% — one
  // product still carries at least 25% MORE of something than the other.
  // Sherbanger 3 vs ADL 2 is the case that showed it: 0.34% vs 0.27% limonene, a
  // quarter more, and the card said nothing at all.
  //
  // The 0.1 threshold above stays. It's the bar for a CLAIM, it's absolute, and
  // being absolute is what stops a faint profile's noise getting through. But
  // when nothing clears it, naming the largest real difference beats silence —
  // hedged, because measurable and noticeable are not the same thing.
  //
  // Floor of 0.04 is the labs' own reporting limit: below it a difference isn't a
  // difference, and the old line is the honest answer.
    // SMELL IS ONLY REAL ADVICE FOR FLOWER. The shop has smell jars — glass,
    // pump top — so "sell on smell" is something a budtender can actually do
    // with an eighth. A preroll and a vape are sealed; you cannot smell either,
    // and telling someone to is telling them to do the impossible.
    //
    // This is not a rare corner. Measured 31 Aug over every same-category pair
    // in stock, 83% of the pairs that reach one of these two lines are prerolls
    // or vapes — the advice was wrongest exactly where it was given most:
    //
    //     Flower   1596 pairs   1.6% reach a line
    //     Preroll  2016 pairs   6.1%          <- nearly 4x, mostly blends
    //     Vape     1378 pairs   0.2%
    //
    // Both sides must be flower before smell is offered — a flower/preroll pair
    // can only be smelled by half.
    //
    // The replacement is what Alisha actually does, in her words: "I defer to
    // the customer. maybe there's a brand they prefer or they might want the
    // cheaper one". Not a chemistry claim dressed up — the honest end of the
    // road.
    const canSmell = smellable(x) && smellable(y);
  if (!gaps.length){
    const [k, d] = ranked[0] || [];
    if (k && Math.abs(d) >= 0.04){
      const [hi, lo] = d > 0 ? [x,y] : [y,x];
      h += `<p>Very close. The clearest difference is ${termName(k, [k]).toLowerCase()} — <b>${nm(hi)}</b> ${pctOr(hi.terpenes[k])} against ${pctOr(lo.terpenes[k])}${
        REPORTED[k] ? ` — ${REPORTED[k][0]} <span class="ev">${dots(REPORTED[k][1])}</span>` : ''
      }. Small enough that ${canSmell ? 'smell' : 'brand'} or price may decide it better than chemistry.</p>`;
    } else {
        h += canSmell
          ? `<p>The profiles are close enough that I'd sell on smell or price.</p>`
          : `<p>The profiles are close enough that it's the customer's call — brand or price.</p>`;
    }
  }
  if (x.thc != null && y.thc != null && Math.abs(x.thc - y.thc) >= 3){
    const [hi, lo] = x.thc >= y.thc ? [x,y] : [y,x];
    h += `<p><b>${nm(hi)}</b> is meaningfully stronger (${thc1(hi.thc)} THC vs ${thc1(lo.thc)}) — that'll drive the experience more than any terpene here.</p>`;
  }
  return h;
}

// Find Similar's result line. A bare "89% similarity" is a decode-it number,
// against the whole point of this tool. So say WHAT makes them close, and — per
// the brief, THC drives the experience more than any terpene — how the strength
// compares to what the customer actually had. `src` is the product they asked
// about; `x` is the in-stock suggestion.
// WHEN SEVERAL MATCHES ARE TIED, DON'T LEAD WITH THE ONE THAT STARTS AN ARGUMENT.
//
// The shelf tag is NOT part of the similarity score and must not become part of
// it: guessing a product's tag from its terpene balance is right 61% of the
// time against a 59% baseline of always saying "Sativa", so the label carries
// almost no information about how something feels. Ranking on it would re-teach
// the folklore the evidence dots exist to argue against.
//
// But the customer is holding a jar that says Sativa, and on this shelf the best
// chemical match carries a different tag 118 times out of 188 — 40 of them
// outright Sativa/Indica flips. That is a conversation at the counter, not an
// edge case.
//
// What makes the fix nearly free is how tightly the scores cluster: 18 products
// sat within 5 points of the best match for Boogie Wuggie, because caryophyllene
// leads 106 of 188 in stock and most profiles therefore look alike. Inside that
// noise the ranking is choosing on rounding, so choosing on the package instead
// costs nothing real.
//
// So: among candidates within 2 points of the top of their own tier, the ones
// that are not the outright opposite come first. Measured across the shelf, that
// takes opposite-tag leads from 40 to 10 for an average of 1 point of similarity
// and 1.9 at worst. Exact tag matching was tested and rejected — it reaches 164
// of 188 but spends up to 4.5 points doing it, which is buying the folklore.
//
// Hybrid is deliberately NOT an opposite. It is the honest answer when the
// chemistry disagrees with the label, and forcing an exact match would skip past
// it for something worse.
//
// The 10 that survive are the real ones: Northern Lights and Super Lemon Haze
// match at 99.1% with nothing non-opposite within 3.3 points. Those get named on
// the card instead of hidden — see matchNote.
const OPPOSITE_SHELF = (a, b) =>
  (a === 'Sativa' && b === 'Indica') || (a === 'Indica' && b === 'Sativa');
const SHELF_TIEBREAK = 0.02;

function preferSameShelf(ranked, src){
  if (ranked.length < 2) return ranked;
  const srcTag = shelfTag(src);
  if (!/^(Sativa|Indica)$/.test(srcTag)) return ranked;   // nothing to be opposite to
  const best = ranked[0][0];
  const near = [], rest = [];
  // Each tier gets its own window, because the tier is what the reader sees —
  // a global window computed off a tier-3 leader would reorder tier 1 by a
  // score no card on screen is showing.
  for (const e of ranked) (e[0] >= best - SHELF_TIEBREAK ? near : rest).push(e);
  const ok  = near.filter(e => !OPPOSITE_SHELF(srcTag, shelfTag(e[1])));
  const opp = near.filter(e =>  OPPOSITE_SHELF(srcTag, shelfTag(e[1])));
  return [...ok, ...opp, ...rest];   // filter is stable, so score order survives
}

function matchNote(src, x, s){
  let why = '';
  // a faint source has unreliable dominants, so don't assert a shared lead off it
  if (src.confidence !== 'faint' && domTerps(src).length){
    if (domTerps(src)[0] === domTerps(x)[0]) why = `both lead with ${short(domTerps(x)[0]).toLowerCase()}`;
    else {
      const shared = domTerps(x).slice(0,3).find(k => domTerps(src).slice(0,3).includes(k));
      if (shared) why = `both carry ${short(shared).toLowerCase()}`;
    }
  }
  // THC can be missing on either side — don't invent a comparison from a null
  const d = (x.thc != null && src.thc != null) ? x.thc - src.thc : null;
  // ACROSS FORMATS THE SUBTRACTION MEANS NOTHING, so it must not be spoken as
  // strength. Vapes run 70-95% and flower 15-35%, so every flower is "lighter"
  // than every vape whatever it actually is — from a 91.2% vape this line called
  // a 57% moonrock "lighter", which is arithmetically true and the opposite of
  // useful, that moonrock being the strongest thing in the shop that is not a
  // vape. Find similar defaults to the source's own format, so this only fires
  // when someone taps All; that is exactly when they are least able to spot it.
  //
  // Same mistake the THC ranking made with coated flower, one panel over: the
  // page states that THC is the one number that reliably drives the experience,
  // so a strength claim it puts in front of a budtender will be believed.
  //
  // WITHIN a format the comparison stands, moonrocks included — a coated eighth
  // really is stronger to smoke than a plain one. It is only the % across
  // formats that measures different things.
  // NOT category — SCALE. A preroll is flower, rolled: measured 28 Aug on this
  // shelf, flower runs 20.0-57.0 and prerolls 14.7-50.9, overlapping by 31
  // points with medians 27.3 and 30.9. Telling someone holding a 22% eighth
  // that a 31% preroll is stronger is both true and useful. Vapes overlap
  // either by ZERO points — 70.9-91.2 — because the number is measuring
  // concentrate, not flower.
  //
  // The first version of this keyed on category and silenced flower-to-preroll
  // too, which is the one cross-format substitution people actually make.
  // (Alisha: "the only way i can see that backfiring is preroll vs flower. most
  // people who want a vape will get another vape.")
  const thcScale = q => category(q) === 'Vape' ? 'concentrate' : 'flower';
  const crossFormat = thcScale(x) !== thcScale(src);
  const thc = x.thc == null ? 'THC not recorded'
    : crossFormat ? `${thc1(x.thc)} THC — different format, so the % doesn't compare`
    : d == null ? `${thc1(x.thc)} THC`
    : Math.abs(d) >= 3
      ? `${d > 0 ? 'stronger' : 'lighter'} — ${thc1(x.thc)} THC vs the ${thc1(src.thc)} you had`
      : `${thc1(x.thc)} THC, about the same strength`;
  // Say the label clash out loud rather than let the customer find it. This only
  // fires where preferSameShelf could not avoid an opposite — nothing within 2
  // points wore a different tag — so it marks the cases where the chemistry
  // genuinely disagrees with the package, not the ones the tiebreak handled.
  // Ten on the shelf as of 27 Aug, and they are worth naming: Northern Lights
  // and Super Lemon Haze match at 99.1%.
  const srcTag = shelfTag(src), xTag = shelfTag(x);
  const clash = OPPOSITE_SHELF(srcTag, xTag)
    ? `<br>Package says <b>${xTag}</b>, yours said ${srcTag} — the chemistry still matches.`
    : '';
  return `<div class="match">${Math.round(s*100)}% match${why ? ' · ' + why : ''}<br>${thc}${clash}</div>`;
}

// What the package claims, sized for the Compare header. It used to carry the
// ⚠ clash too — the single-card verdict brought into the two-up view — and went
// when that did (see the note where labelCheck used to live). The tag still
// shows: Compare is exactly where someone is weighing "the sativa vs the
// indica", so the package's own word belongs here. Compass just doesn't argue
// with it any more.
function cmpShelf(p, align){
  const tag = shelfTag(p);
  if (tag === 'Unverified') return '';
