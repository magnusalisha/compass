<circle cx="514" cy="194" r="3" fill="#C4913B"/>
<text x="602" y="180" font-family="ui-monospace,Menlo,monospace" font-size="9.5" font-weight="400" fill="#C4913B" text-anchor="start" letter-spacing="1.4">CHEMISTRY</text>
<text x="602" y="195" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#C9D6C4" text-anchor="start">Every terpene, biggest first — and</text>
<text x="602" y="209" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#C9D6C4" text-anchor="start">each chip carries the plain word</text>
<text x="602" y="223" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#C9D6C4" text-anchor="start">the read is written from.</text>
<path d="M514 308 H588" stroke="#C4913B" stroke-width="1.2" fill="none" opacity=".85"/>
<circle cx="514" cy="308" r="3" fill="#C4913B"/>
<text x="602" y="294" font-family="ui-monospace,Menlo,monospace" font-size="9.5" font-weight="400" fill="#C4913B" text-anchor="start" letter-spacing="1.4">INTERPRETATION</text>
<text x="602" y="309" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#C9D6C4" text-anchor="start">One sentence, led by the largest</text>
<text x="602" y="323" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#C9D6C4" text-anchor="start">terpene. Hedged on purpose.</text>
<path d="M514 344 H588" stroke="#C4913B" stroke-width="1.2" fill="none" opacity=".85"/>
<circle cx="514" cy="344" r="3" fill="#C4913B"/>
<text x="602" y="330" font-family="ui-monospace,Menlo,monospace" font-size="9.5" font-weight="400" fill="#C4913B" text-anchor="start" letter-spacing="1.4">EVIDENCE</text>
<text x="602" y="345" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#C9D6C4" text-anchor="start">How good the claim is, and which</text>
<text x="602" y="359" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#C9D6C4" text-anchor="start">terpene it rests on. 52 of 213</text>
<text x="602" y="373" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#C9D6C4" text-anchor="start">cards grade themselves folklore.</text>
<path d="M514 373 H588" stroke="#C4913B" stroke-width="1.2" fill="none" opacity=".85"/>
<circle cx="514" cy="373" r="3" fill="#C4913B"/>
<text x="602" y="359" font-family="ui-monospace,Menlo,monospace" font-size="9.5" font-weight="400" fill="#C4913B" text-anchor="start" letter-spacing="1.4">SHOW YOUR WORK</text>
<text x="602" y="374" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#C9D6C4" text-anchor="start">Opens the source behind every</text>
<text x="602" y="388" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#C9D6C4" text-anchor="start">claim on the card.</text>
