<path d="M514 118 H588" stroke="#C4913B" stroke-width="1.2" fill="none" opacity=".85"/>
<circle cx="514" cy="118" r="3" fill="#C4913B"/>
<text x="602" y="104" font-family="ui-monospace,Menlo,monospace" font-size="9.5" font-weight="400" fill="#C4913B" text-anchor="start" letter-spacing="1.4">MEASURED</text>
<text x="602" y="119" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#C9D6C4" text-anchor="start">Lab figures, straight from the COA.</text>
<text x="602" y="133" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#C9D6C4" text-anchor="start">Strength is ranked against this</text>
<text x="602" y="147" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#C9D6C4" text-anchor="start">category's own range in this shop.</text>
