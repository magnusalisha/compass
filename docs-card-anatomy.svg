<text x="62" y="312" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13.5" font-weight="400" fill="#20261F" text-anchor="start">Can read as body-calm, with a buzzy lift on top.</text>
<text x="62" y="340" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="400" fill="#5C6558" text-anchor="start">●●● evidence · real mechanism — leans on</text>
<text x="62" y="355" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="400" fill="#5C6558" text-anchor="start">caryophyllene</text>
